  set: day-10
  type: matching
  stem: "Match each requirement of a travel-booking assistant to the agentic AI concept that addresses it."
  options:
    - { id: a, text: "Remember next month that the traveller prefers aisle seats", explanation: "Long-term memory persists preferences across sessions." }
