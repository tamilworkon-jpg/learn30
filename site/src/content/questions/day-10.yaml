    - { id: c, text: "Decide whether to search again, ask the traveller a question or confirm the booking", explanation: "Orchestration and planning decide the next step in the agent loop." }
    - { id: d, text: "Let any compatible AI application reuse the airline's booking tools through one standard interface", explanation: "MCP standardises how applications connect to tools and data through MCP servers." }
  matchTargets:
