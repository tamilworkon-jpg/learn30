  taskStatement: "5.2"
  lessonRef: day-27#exam-tips
  difficulty: hard

- id: q-week-4-033
  set: week-4
  type: single
  stem: "An accounts-payable system uses a foundation model to extract the invoice number, date and total from emails into JSON. The same email must always produce the same output. Which inference setting is MOST appropriate?"
  options:
    - { id: a, text: "A high temperature with a large top-p", explanation: "Incorrect. High randomness produces varied output, the opposite of what is needed." }
    - { id: b, text: "A temperature of 0 or close to 0", explanation: "Correct. Low temperature makes the most likely token win almost every time, giving consistent extraction." }
    - { id: c, text: "A higher top-k to widen token choices", explanation: "Incorrect. Widening token choices increases variability." }
    - { id: d, text: "Removing all stop sequences", explanation: "Incorrect. Stop sequences help keep output in a fixed format; removing them does not improve consistency." }
  answer: [b]
  explanation: "'Deterministic', 'consistent', 'factual' → low temperature (or low top-p or top-k). Creative tasks use higher values. None of these parameters adds knowledge."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-15#exam-tips
  difficulty: easy

- id: q-week-4-034
  set: week-4
  type: single
  stem: "A compliance team wants a RAG assistant that answers questions such as 'Which suppliers of part X are affected by regulation Y through their parent companies?', which require following links between entities. Which vector store choice supports this BEST?"
  options:
    - { id: a, text: "Amazon DocumentDB", explanation: "Incorrect. DocumentDB suits JSON documents, not multi-hop relationship queries." }
    - { id: b, text: "Amazon RDS for PostgreSQL with pgvector", explanation: "Incorrect. pgvector suits relational data already in PostgreSQL; it does not provide graph traversal for GraphRAG." }
    - { id: c, text: "Amazon Neptune Analytics with GraphRAG in Bedrock Knowledge Bases", explanation: "Correct. Neptune stores relationships and powers GraphRAG, which follows links between entities for multi-hop questions." }
    - { id: d, text: "Amazon S3 with no vector store", explanation: "Incorrect. S3 stores the source documents but does not perform similarity search or graph traversal." }
  answer: [c]
  explanation: "'Relationships', 'knowledge graph', 'multi-hop' → Amazon Neptune with GraphRAG. OpenSearch suits search at scale, pgvector suits relational data and DocumentDB suits JSON documents."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-18#explanation
  difficulty: hard

- id: q-week-4-035
  set: week-4
  type: single
  stem: "A telecom company will run a FAQ chatbot that handles 3 million short questions a month. Quality tests show that several models meet the accuracy bar. Which choice is MOST appropriate?"
  options:
    - { id: a, text: "The largest reasoning model available, for maximum quality", explanation: "Incorrect. A larger model costs more and is slower without a needed quality gain." }
    - { id: b, text: "The model with the largest context window", explanation: "Incorrect. Short questions do not need a very large context window." }
    - { id: c, text: "A new model pre-trained from scratch on the FAQs", explanation: "Incorrect. Pre-training is the most expensive option and unnecessary when existing models meet the bar." }
    - { id: d, text: "The smallest, fastest and cheapest model that met the accuracy bar", explanation: "Correct. When several models meet quality requirements, the smallest suitable model minimises cost and latency at high volume." }
  answer: [d]
  explanation: "Model size, speed and price go together. The best choice is the smallest model that meets quality, latency, cost and compliance requirements, which matters most at high volume."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-15#explanation
  difficulty: medium

- id: q-week-4-036
  set: week-4
  type: single
  stem: "A language-learning app's translation bot is manipulated by a user into writing promotional spam for an unrelated website instead of translating. Which prompt risk does this describe?"
  options:
    - { id: a, text: "Hijacking", explanation: "Correct. Hijacking replaces the application's intended task with the attacker's task." }
    - { id: b, text: "Prompt leaking", explanation: "Incorrect. Prompt leaking reveals the hidden system prompt." }
    - { id: c, text: "Poisoning", explanation: "Incorrect. Poisoning corrupts training or retrieval data." }
    - { id: d, text: "Exposure", explanation: "Incorrect. Exposure reveals sensitive data such as personal information." }
  answer: [a]
  explanation: "Jailbreaking defeats safety rules; hijacking replaces the app's task; poisoning corrupts data; exposure reveals sensitive data; prompt leaking reveals the system prompt. Denied topics and prompt attack filters in Guardrails help keep the app on task."
  domain: D3
  taskStatement: "3.2"
  lessonRef: day-17#explanation
  difficulty: easy

- id: q-week-4-037
  set: week-4
  type: single
  stem: "A developer writes 'Translate the following sentence into French:' followed by a sentence, with no examples, and the model translates it correctly. Which prompting technique is this?"
  options:
    - { id: a, text: "Few-shot prompting", explanation: "Incorrect. Few-shot prompting includes several examples." }
    - { id: b, text: "Zero-shot prompting", explanation: "Correct. Zero-shot prompting gives only the instruction and input, with no examples." }
    - { id: c, text: "Chain-of-thought prompting", explanation: "Incorrect. Chain-of-thought asks for step-by-step reasoning." }
    - { id: d, text: "Fine-tuning", explanation: "Incorrect. Fine-tuning trains the model; this is just a prompt." }
  answer: [b]
  explanation: "Zero-shot prompting relies on the model's general training. Add one example (single-shot) or several (few-shot) when the format or task is unusual. Start simple, then add examples or reasoning steps as needed."
  domain: D3
  taskStatement: "3.2"
  lessonRef: day-16#explanation
  difficulty: easy

- id: q-week-4-038
  set: week-4
  type: multi
  stem: "A RAG assistant for an energy company must refuse answers that are not supported by its retrieved documents and must detect users trying to override its instructions. Which Amazon Bedrock Guardrails capabilities should be configured? (Select TWO.)"
  options:
    - { id: a, text: "Word filters", explanation: "Incorrect. Word filters block exact words or phrases; they cannot judge grounding or detect varied injection attempts." }
    - { id: b, text: "Contextual grounding check", explanation: "Correct. The grounding check scores responses against the source passages and blocks unsupported answers." }
    - { id: c, text: "Denied topics", explanation: "Incorrect. Denied topics block defined subjects, not unsupported answers or instruction overrides." }
    - { id: d, text: "Prompt attack filter", explanation: "Correct. The prompt attack filter, part of content filters, detects jailbreak and prompt injection attempts." }
    - { id: e, text: "Sensitive information filters", explanation: "Incorrect. These detect and mask or block PII." }
  answer: [b, d]
  explanation: "Hallucination in RAG → contextual grounding check (grounding and relevance thresholds). Jailbreak or prompt injection → prompt attack filter. Guardrails apply to both input and output."
  domain: D3
  taskStatement: "3.2"
  lessonRef: day-17#explanation
  difficulty: medium

- id: q-week-4-039
  set: week-4
  type: single
  stem: "A model provider shows reviewers pairs of chatbot answers to the same prompt and records which answer they prefer. It uses these preferences to make the model more helpful and less harmful. Which technique is this data used for?"
  options:
    - { id: a, text: "Continued pre-training", explanation: "Incorrect. Continued pre-training uses unlabelled domain text." }
    - { id: b, text: "Distillation", explanation: "Incorrect. Distillation uses a teacher model's answers to train a smaller student." }
    - { id: c, text: "Reinforcement learning from human feedback (RLHF)", explanation: "Correct. Human preference rankings train a reward model that guides reinforcement learning." }
    - { id: d, text: "Retrieval-augmented generation", explanation: "Incorrect. RAG retrieves documents at question time and does not use preference data." }
  answer: [c]
  explanation: "Human rankings of responses → RLHF: humans rank outputs, a reward model learns those preferences, and reinforcement learning updates the FM to earn higher reward. It aligns models with human values such as helpfulness and harmlessness."
  domain: D3
  taskStatement: "3.3"
  lessonRef: day-19#exam-tips
  difficulty: medium

- id: q-week-4-040
  set: week-4
  type: single
  stem: "A board member asks which way of obtaining a foundation model requires the MOST data, compute and time. Which answer is correct?"
  options:
    - { id: a, text: "Fine-tuning an existing model", explanation: "Incorrect. Fine-tuning needs a relatively small labelled dataset and far less compute." }
    - { id: b, text: "Retrieval-augmented generation", explanation: "Incorrect. RAG does not change model weights and costs far less." }
    - { id: c, text: "Distillation", explanation: "Incorrect. Distillation trains a small student model and is much cheaper than building a model." }
    - { id: d, text: "Pre-training a model from scratch", explanation: "Correct. Pre-training needs massive data and compute over weeks or months." }
  answer: [d]
  explanation: "Pre-training from scratch is the most expensive option and almost never the right business answer. Prefer prompting, then RAG, then fine-tuning, climbing only as far as the requirement demands."
  domain: D3
  taskStatement: "3.3"
  lessonRef: day-19#exam-tips
  difficulty: easy

- id: q-week-4-041
  set: week-4
  type: single
  stem: "A retrieval-only evaluation of a legal RAG assistant shows that the retrieved chunks rarely contain the facts needed to answer the test questions. What should the team change FIRST?"
  options:
    - { id: a, text: "The chunking strategy, embedding model or retrieval settings", explanation: "Correct. Poor context relevance or coverage is a retrieval problem, fixed in chunking, embeddings, filters or reranking." }
    - { id: b, text: "The generation model, replacing it with a larger one", explanation: "Incorrect. A larger model cannot answer from facts that were never retrieved." }
    - { id: c, text: "The temperature, raising it for more varied answers", explanation: "Incorrect. Temperature does not affect what is retrieved." }
    - { id: d, text: "A Guardrails word filter for legal terms", explanation: "Incorrect. Word filters block terms; they do not improve retrieval." }
  answer: [a]
  explanation: "Evaluate RAG retrieval and generation separately. Retrieval metrics (context relevance, coverage) point to chunking, embeddings and search settings; generation metrics (faithfulness, correctness, citations) point to prompt, model and grounding checks."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: hard

- id: q-week-4-042
  set: week-4
  type: single
  stem: "A hospital wants to confirm that a model's patient-education leaflets are medically accurate and written at the right reading level before choosing it. Which evaluation approach fits BEST?"
  options:
    - { id: a, text: "BLEU scores against a public dataset", explanation: "Incorrect. BLEU measures word overlap and cannot judge medical accuracy or tone." }
    - { id: b, text: "Human evaluation using the hospital's own clinicians as the work team", explanation: "Correct. Expert accuracy and subjective qualities need human evaluation, which Bedrock supports with your own work team." }
    - { id: c, text: "Model latency measurements in CloudWatch", explanation: "Incorrect. Latency is operational, not content quality." }
    - { id: d, text: "A public benchmark leaderboard rank", explanation: "Incorrect. Benchmarks do not measure this hospital's specific leaflets." }
  answer: [b]
  explanation: "'Subjective quality, brand voice, expert accuracy' → human evaluation. Amazon Bedrock human evaluation lets you bring your own work team, define metrics and choose a rating method."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#exam-tips
  difficulty: medium

- id: q-week-4-043
  set: week-4
  type: ordering
  stem: "A team uses Amazon Bedrock Model Evaluation to choose between two models for summarising support cases. Place the steps in the correct order, from first to last."
  options:
    - { id: a, text: "Create an evaluation job that selects the models, task type and metrics", explanation: "Second: the job definition points to the dataset and chooses what to measure." }
    - { id: b, text: "Review the report and per-prompt scores and choose a model", explanation: "Last: compare results and decide." }
    - { id: c, text: "Prepare a prompt dataset of representative support cases in Amazon S3", explanation: "First: a representative dataset is needed before any job can run." }
    - { id: d, text: "The job runs and writes its results to Amazon S3", explanation: "Third: Bedrock generates responses, scores them and stores the results." }
  answer: [c, a, d, b]
  explanation: "Bedrock evaluation jobs read a prompt dataset (built-in or your own JSONL in S3), run the selected models, score them with the chosen metrics and store a report in S3. Because jobs are repeatable, rerun them after every change to the model, prompt or retrieval."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-week-4-044
  set: week-4
  type: single
  stem: "A developer sends a 900-page technical standard to a model in one request and receives an error saying the input is too long. Which limit has the request exceeded?"
  options:
    - { id: a, text: "The maximum output tokens setting", explanation: "Incorrect. Maximum output tokens caps the response, not the input." }
    - { id: b, text: "The embedding dimension", explanation: "Incorrect. Embedding dimension is the length of a vector, not a request limit." }
    - { id: c, text: "The model's context window", explanation: "Correct. The context window is the maximum number of tokens the model can consider at once, prompt plus response." }
    - { id: d, text: "The temperature range", explanation: "Incorrect. Temperature controls randomness, not input size." }
  answer: [c]
  explanation: "The context window, measured in tokens, limits prompt plus response. For very long documents, chunk and retrieve relevant parts (RAG), summarise in stages, or choose a model with a larger window, keeping cost and latency in mind."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#exam-tips
  difficulty: medium

- id: q-week-4-045
  set: week-4
  type: single
  stem: "A design agency's image model starts from random noise and refines it over many steps into a picture that matches a text prompt. Which type of model is this?"
  options:
    - { id: a, text: "Recurrent neural network", explanation: "Incorrect. RNNs process sequences step by step and are not the basis of modern image generation." }
    - { id: b, text: "Embedding model", explanation: "Incorrect. Embedding models output vectors, not images." }
    - { id: c, text: "K-means clustering model", explanation: "Incorrect. K-means groups data; it does not generate images." }
    - { id: d, text: "Diffusion model", explanation: "Correct. Diffusion models generate images by iteratively removing noise, guided by the prompt." }
  answer: [d]
  explanation: "Diffusion models learn to reverse a noising process: starting from noise, they remove it step by step until an image appears. Amazon Nova Canvas is an example of an image-generation model on Bedrock."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: easy

- id: q-week-4-046
  set: week-4
  type: multi
  stem: "A bank's support agent must remember each customer's preferred contact channel across separate conversations and hand billing disputes to a specialist billing agent. Which agentic AI concepts address these requirements? (Select TWO.)"
  options:
    - { id: a, text: "Short-term memory only", explanation: "Incorrect. Short-term memory covers only the current conversation." }
    - { id: b, text: "Long-term memory", explanation: "Correct. Long-term memory stores facts such as preferences across sessions." }
    - { id: c, text: "A higher temperature", explanation: "Incorrect. Temperature affects randomness, not memory or delegation." }
    - { id: d, text: "Batch inference", explanation: "Incorrect. Batch inference processes offline jobs." }
    - { id: e, text: "A supervisor pattern with multi-agent collaboration", explanation: "Correct. A supervisor agent delegates tasks to specialist agents." }
  answer: [b, e]
  explanation: "Remember across sessions → long-term memory; current conversation → short-term memory. One agent delegating to specialists → supervisor or multi-agent collaboration. AgentCore Memory and Bedrock multi-agent collaboration support these patterns."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-10#exam-tips
  difficulty: medium

- id: q-week-4-047
  set: week-4
  type: single
  stem: "An online fashion store uses generative AI to write personalised product descriptions. Leadership wants a metric that shows whether this is creating business value. Which metric is MOST appropriate?"
  options:
    - { id: a, text: "Conversion rate of product pages", explanation: "Correct. Conversion rate shows whether visitors buy more, a direct business outcome." }
    - { id: b, text: "ROUGE score of descriptions", explanation: "Incorrect. ROUGE measures text overlap with references, a model metric." }
    - { id: c, text: "Model latency in milliseconds", explanation: "Incorrect. Latency is a technical metric, not business value." }
    - { id: d, text: "Average number of output tokens", explanation: "Incorrect. Token counts relate to cost, not value created." }
  answer: [a]
  explanation: "Business value is measured with business metrics: conversion rate, ARPU, customer lifetime value, efficiency, cost per interaction and CSAT. Model metrics such as accuracy or ROUGE describe the model, not the outcome."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#exam-tips
  difficulty: easy

- id: q-week-4-048
  set: week-4
  type: single
  stem: "An electronics retailer's chatbot confidently tells customers about a three-year warranty that the company has never offered. Which mitigation addresses this MOST effectively?"
  options:
    - { id: a, text: "Switch to a larger model", explanation: "Incorrect. Larger models still hallucinate when they lack the facts." }
    - { id: b, text: "Ground answers in the official warranty documents with RAG and show citations", explanation: "Correct. Grounding gives the model the real policy text and citations let users verify it." }
    - { id: c, text: "Increase the temperature", explanation: "Incorrect. Higher temperature increases the risk of invented content." }
    - { id: d, text: "Increase the maximum output tokens", explanation: "Incorrect. Longer answers do not make them more accurate." }
  answer: [b]
  explanation: "A confident but false answer is a hallucination. Mitigate with RAG grounding and citations, Guardrails contextual grounding checks, clear instructions to answer only from context, and human review for high-impact answers."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: medium

- id: q-week-4-049
  set: week-4
  type: single
  stem: "A contact-centre application sends a steady, high volume of requests to Amazon Bedrock around the clock and needs guaranteed throughput during peak hours. Which pricing option fits BEST?"
  options:
    - { id: a, text: "On-demand inference", explanation: "Incorrect. On-demand suits variable traffic but does not guarantee capacity." }
    - { id: b, text: "Batch inference", explanation: "Incorrect. Batch inference is for offline jobs where results are not needed immediately." }
    - { id: c, text: "Provisioned Throughput", explanation: "Correct. Provisioned Throughput reserves model capacity for steady, high-volume traffic with guaranteed performance." }
    - { id: d, text: "Prompt caching on its own", explanation: "Incorrect. Prompt caching reduces cost of repeated prefixes but does not guarantee throughput." }
  answer: [c]
  explanation: "Provisioned Throughput buys guaranteed capacity billed per hour even when idle, so it suits steady, high-volume traffic. For variable or modest traffic, on-demand is usually cheaper."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-13#exam-tips
  difficulty: medium

- id: q-week-4-050
  set: week-4
  type: single
  stem: "A sales operations team with no developers wants to ask questions about business data, build dashboards and create simple AI agents and automations. Which AWS offering fits BEST?"
  options:
    - { id: a, text: "Kiro", explanation: "Incorrect. Kiro is an agentic IDE for developers, with spec-driven development." }
    - { id: b, text: "AWS Transform", explanation: "Incorrect. AWS Transform modernises and migrates applications such as mainframe, .NET and VMware workloads." }
    - { id: c, text: "Strands Agents", explanation: "Incorrect. Strands Agents is an open-source SDK for developers writing agents in code." }
    - { id: d, text: "Amazon Quick", explanation: "Correct. Amazon Quick gives business users insights, dashboards, no-code agents and automation." }
  answer: [d]
  explanation: "Business users, dashboards, insights and no-code agents → Amazon Quick. Developers in an IDE → Kiro. Application modernisation → AWS Transform. Code-first agents → Strands Agents, run in production on AgentCore."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-12#exam-tips
  difficulty: easy

- id: q-week-4-051
  set: week-4
  type: single
  stem: "An enterprise wants AI agents to help modernise hundreds of legacy .NET Framework applications and move them to Linux. Which AWS service is designed for this?"
  options:
    - { id: a, text: "AWS Transform", explanation: "Correct. AWS Transform uses agentic AI to modernise and migrate workloads such as .NET, mainframe, VMware and Java." }
    - { id: b, text: "Amazon Quick", explanation: "Incorrect. Quick serves business users with insights and automation." }
    - { id: c, text: "Amazon Bedrock Knowledge Bases", explanation: "Incorrect. Knowledge Bases provides managed RAG, not code modernisation." }
    - { id: d, text: "Amazon SageMaker Canvas", explanation: "Incorrect. Canvas is no-code ML for analysts." }
  answer: [a]
  explanation: "AWS Transform is the ready-made agentic application for modernisation and migration. Knowing which packaged application fits a persona is part of task statement 2.3."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-12#explanation
  difficulty: medium

- id: q-week-4-052
  set: week-4
  type: single
  stem: "A large language model learned language by predicting the next word across billions of unlabelled web pages, with no human-written labels. Which kind of learning is this?"
  options:
    - { id: a, text: "Supervised learning with human labels", explanation: "Incorrect. No human labels were used." }
    - { id: b, text: "Self-supervised learning", explanation: "Correct. The data provides its own labels (the next or missing word), which is self-supervised learning." }
    - { id: c, text: "Reinforcement learning", explanation: "Incorrect. Reinforcement learning learns from rewards through trial and error." }
    - { id: d, text: "Clustering", explanation: "Incorrect. Clustering groups similar items; it does not predict words." }
  answer: [b]
  explanation: "Foundation models are pre-trained with self-supervised learning: labels are created automatically from the data itself, such as the next token. This is why they can learn from huge unlabelled datasets."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#exam-tips
  difficulty: medium

- id: q-week-4-053
  set: week-4
  type: single
  stem: "A delivery company's ETA model was accurate at launch. Eight months later its predictions are noticeably worse, although no code has changed; new suburbs and traffic patterns have appeared. What is the MOST likely cause and fix?"
  options:
    - { id: a, text: "Underfitting; switch to a simpler model", explanation: "Incorrect. A simpler model would not adapt to the new patterns." }
    - { id: b, text: "A software bug; redeploy the same model", explanation: "Incorrect. Nothing changed in the code; redeploying the same model keeps the same problem." }
    - { id: c, text: "Data drift; monitor inputs and retrain on recent data", explanation: "Correct. The world changed, so the model must be retrained with data that reflects it." }
    - { id: d, text: "Overfitting; remove features", explanation: "Incorrect. The model performed well on new data at launch; the gap appeared over time." }
  answer: [c]
  explanation: "'Accuracy dropped months after launch with no code change' → drift. Monitor production data and performance (for example with SageMaker Model Monitor) and retrain when drift is detected."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#exam-tips
  difficulty: medium

- id: q-week-4-054
  set: week-4
  type: single
  stem: "A streaming service wants to show each viewer a personalised row of recommended films based on viewing history, without building ML models itself. Which AWS service fits BEST?"
  options:
    - { id: a, text: "Amazon Comprehend", explanation: "Incorrect. Comprehend analyses text for sentiment, entities and topics." }
    - { id: b, text: "Amazon Lex", explanation: "Incorrect. Lex builds conversational chatbots." }
    - { id: c, text: "Amazon Rekognition", explanation: "Incorrect. Rekognition analyses images and video." }
    - { id: d, text: "Amazon Personalize", explanation: "Correct. Personalize is a managed service for personalised recommendations." }
  answer: [d]
  explanation: "Recommendations → Amazon Personalize. Chatbot → Lex. Image and video analysis → Rekognition. Text analysis → Comprehend. Managed AI services offer the least operational overhead when no ML expertise is available."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#exam-tips
  difficulty: easy

- id: q-week-4-055
  set: week-4
  type: multi
  stem: "A logistics company wants to pull line items and totals from scanned supplier invoices and then detect the sentiment and key entities in customer complaint emails. Which AWS services should it use? (Select TWO.)"
  options:
    - { id: a, text: "Amazon Polly", explanation: "Incorrect. Polly converts text to speech." }
    - { id: b, text: "Amazon Textract", explanation: "Correct. Textract extracts text, tables and form fields from scanned documents." }
    - { id: c, text: "Amazon Lex", explanation: "Incorrect. Lex builds chatbots." }
    - { id: d, text: "Amazon Rekognition", explanation: "Incorrect. Rekognition analyses images and video, and its text detection does not extract document structure such as tables." }
    - { id: e, text: "Amazon Comprehend", explanation: "Correct. Comprehend detects sentiment, entities and key phrases in text." }
  answer: [b, e]
  explanation: "Textract extracts text and structure (tables, forms) from documents; Comprehend understands text (sentiment, entities, PII). Together they automate document and email processing without building models."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#exam-tips
  difficulty: medium

- id: q-week-4-056
  set: week-4
  type: ordering
  stem: "A company has automated MLOps for its demand-forecasting model on SageMaker AI. Place the steps that follow a drift alert in the correct order, from first to last."
  options:
    - { id: a, text: "SageMaker Pipelines retrains the model on recent data and evaluates it", explanation: "Third: the automated pipeline produces and tests a new candidate." }
    - { id: b, text: "SageMaker Model Monitor detects that live data has drifted from the baseline", explanation: "First: monitoring detects the problem." }
    - { id: c, text: "The approved model version is deployed to the endpoint", explanation: "Last: only an approved version reaches production." }
    - { id: d, text: "An alarm triggers the retraining pipeline", explanation: "Second: the alert starts the automated workflow." }
    - { id: e, text: "The new version is registered in Model Registry and awaits approval", explanation: "Fourth: the registry versions the model and records approval status." }
  answer: [b, d, a, e, c]
  explanation: "MLOps automates the loop: Model Monitor detects drift, CloudWatch alarms trigger Pipelines, Pipelines retrains and evaluates, Model Registry versions and gates approval, and the approved model is deployed. The ML lifecycle is a loop, not a line."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: hard

- id: q-week-4-057
  set: week-4
  type: multi
  stem: "A property platform has built a model that predicts house sale prices in dollars. Which metrics are appropriate for measuring its error? (Select TWO.)"
  options:
    - { id: a, text: "Mean absolute error (MAE)", explanation: "Correct. MAE is the average size of the errors in the same units as the price." }
    - { id: b, text: "Precision", explanation: "Incorrect. Precision is a classification metric." }
    - { id: c, text: "Recall", explanation: "Incorrect. Recall is a classification metric." }
    - { id: d, text: "Root mean squared error (RMSE)", explanation: "Correct. RMSE measures regression error and penalises large errors more heavily." }
    - { id: e, text: "Area under the ROC curve (AUC)", explanation: "Incorrect. AUC measures how well a classifier separates classes." }
  answer: [a, d]
  explanation: "Regression predicts numbers, so use error metrics such as MAE and RMSE. Classification uses accuracy, precision, recall, F1 and AUC."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#exam-tips
  difficulty: medium
