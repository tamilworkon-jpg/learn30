- id: q-week-4-001
  set: week-4
  type: single
  stem: "A lender's credit model reports 92% overall accuracy. A review finds that applicants over 70, who make up 3% of the training data, are wrongly declined far more often than other groups. Which response is MOST appropriate?"
  options:
    - { id: a, text: "Evaluate performance per age group and add more representative data for older applicants", explanation: "Correct. Subgroup evaluation exposes the gap, and representative data addresses its cause." }
    - { id: b, text: "Delete the age column and retrain on the same data", explanation: "Incorrect. Proxy features can still carry age information, and the small group is still under-represented." }
    - { id: c, text: "Raise the overall accuracy target to 95%", explanation: "Incorrect. A higher average can still hide poor performance for a small group." }
    - { id: d, text: "Accept the result, because 92% is a strong overall score", explanation: "Incorrect. Averages hide subgroup inaccuracy, which is a fairness and legal risk." }
  answer: [a]
  explanation: "Bias and variance hurt small groups first, and overall averages hide it. Evaluate per subgroup, fix data gaps (sampling bias) with inclusive, balanced data, and monitor fairness after deployment. Removing a sensitive column alone rarely removes bias."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-22#exam-tips
  difficulty: hard

- id: q-week-4-002
  set: week-4
  type: single
  stem: "After launch, a bank's voice assistant cannot understand customers with speech impairments. The project team admits this group was never part of user research or testing. Which responsible AI dimension was MOST directly neglected?"
  options:
    - { id: a, text: "Robustness", explanation: "Incorrect. Robustness is about coping with noisy, unusual or adversarial input; the root cause here is that a group of users was never considered." }
    - { id: b, text: "Inclusivity", explanation: "Correct. Inclusivity means designing for and testing with the full range of people who will use the system." }
    - { id: c, text: "Veracity", explanation: "Incorrect. Veracity concerns whether outputs are true and accurate." }
    - { id: d, text: "Controllability", explanation: "Incorrect. Controllability is the ability of humans to monitor, steer and override the system." }
  answer: [b]
  explanation: "'Works worse for one group' points to fairness; 'the group was never considered in design or testing' points to inclusivity. Inclusive design involves diverse users in research and tests the system with them before launch."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-22#explanation
  difficulty: easy

- id: q-week-4-003
  set: week-4
  type: single
  stem: "A recruitment model is trained on ten years of hiring decisions. During those years, managers rarely hired candidates from certain universities regardless of skill, and the model now scores those candidates lower. Which type of bias is this?"
  options:
    - { id: a, text: "Sampling bias", explanation: "Incorrect. Sampling bias means a group is missing or under-represented in the data; here the data records past unfair decisions." }
    - { id: b, text: "Measurement bias", explanation: "Incorrect. Measurement bias comes from faulty or inconsistent ways of recording a feature." }
    - { id: c, text: "Historical bias", explanation: "Correct. The data faithfully reflects past unfair decisions, and the model learns to repeat them." }
    - { id: d, text: "High variance", explanation: "Incorrect. Variance is a statistical fit concept, not the cause of learning past unfair patterns." }
  answer: [c]
  explanation: "Historical bias: data reflects past unfair decisions. Sampling bias: a group is missing or under-represented. Measurement bias: features recorded inaccurately for some groups. Label bias: labellers' judgements are skewed. Most bias enters through data."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-22#exam-tips
  difficulty: hard

- id: q-week-4-004
  set: week-4
  type: multi
  stem: "A media company's legal team is drafting a risk register for a new generative AI content tool. Which items are legal risks of generative AI as described in this course? (Select THREE.)"
  options:
    - { id: a, text: "Generated images that closely copy copyrighted characters", explanation: "Correct. Intellectual property infringement is a key legal risk of generative AI." }
    - { id: b, text: "Faster response times than the previous tool", explanation: "Incorrect. Speed is a performance characteristic, not a legal risk." }
    - { id: c, text: "Hallucinated facts that customers rely on", explanation: "Correct. Hallucinations can mislead users and create liability." }
    - { id: d, text: "Outputs that stereotype or disadvantage groups of people", explanation: "Correct. Biased outputs create discrimination and reputational risk." }
    - { id: e, text: "Token-based pricing for model usage", explanation: "Incorrect. Pricing is a cost consideration, not a legal risk." }
    - { id: f, text: "A smaller context window than competing models", explanation: "Incorrect. Context window size is a technical limitation, not a legal risk." }
  answer: [a, c, d]
  explanation: "Legal risks of generative AI include IP infringement, biased outputs, loss of customer trust, end-user risk and hallucinations. They are managed with data provenance, output controls, grounding with citations, human oversight and documentation."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-22#explanation
  difficulty: easy

- id: q-week-4-005
  set: week-4
  type: multi
  stem: "A data science team building a credit model on SageMaker AI must check its training dataset for imbalance across age groups before training and, after deployment, explain to applicants which factors drove each decision. Which capabilities meet these needs? (Select TWO.)"
  options:
    - { id: a, text: "SageMaker Clarify pre-training bias metrics", explanation: "Correct. Clarify measures bias in the dataset before any model is trained." }
    - { id: b, text: "Amazon Bedrock Guardrails denied topics", explanation: "Incorrect. Denied topics block subjects in generative AI conversations; they do not analyse datasets." }
    - { id: c, text: "SageMaker Model Monitor data quality monitoring", explanation: "Incorrect. Data quality monitoring watches deployed input data for drift, not dataset bias or individual explanations." }
    - { id: d, text: "SageMaker Clarify SHAP feature attributions", explanation: "Correct. SHAP attributions show how much each feature contributed to an individual prediction." }
    - { id: e, text: "Amazon Macie", explanation: "Incorrect. Macie discovers sensitive data in S3; it does not measure bias or explain predictions." }
  answer: [a, d]
  explanation: "SageMaker Clarify detects pre-training bias in data, post-training bias in predictions, and explains predictions with SHAP. Model Monitor continues the job after deployment by tracking drift, including bias drift and feature attribution drift."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-23#exam-tips
  difficulty: medium

- id: q-week-4-006
  set: week-4
  type: single
  stem: "A deployed SageMaker AI loan model passed its fairness review at launch. Six months later, the approval-rate gap between age groups has slowly widened. Which capability would have detected this automatically?"
  options:
    - { id: a, text: "A one-time SageMaker Clarify pre-training bias report", explanation: "Incorrect. A point-in-time report on training data cannot detect changes in production over time." }
    - { id: b, text: "Amazon Bedrock Guardrails content filters", explanation: "Incorrect. Guardrails filter generative AI prompts and responses, not tabular model decisions." }
    - { id: c, text: "AWS Artifact", explanation: "Incorrect. Artifact provides AWS's compliance reports, not model monitoring." }
    - { id: d, text: "SageMaker Model Monitor bias drift monitoring", explanation: "Correct. Bias drift monitoring tracks Clarify bias metrics on live predictions and alerts when they move past a threshold." }
  answer: [d]
  explanation: "Clarify gives a point-in-time report; Model Monitor keeps checking deployed models over time for data quality, model quality, bias drift and feature attribution drift, and raises alerts through CloudWatch."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-23#explanation
  difficulty: medium

- id: q-week-4-007
  set: week-4
  type: matching
  stem: "An MLOps engineer sets up SageMaker Model Monitor for a fraud model. Match each observed problem to the monitoring type that detects it."
  options:
    - { id: a, text: "The average transaction amount in live traffic doubles compared with the training baseline", explanation: "Data quality monitoring compares live input data with the training baseline." }
    - { id: b, text: "Recall falls from 85% to 60% once confirmed fraud labels arrive", explanation: "Model quality monitoring compares predictions with ground-truth labels collected later." }
    - { id: c, text: "The gap in flag rates between two customer regions widens", explanation: "Bias drift monitoring tracks Clarify bias metrics over time." }
    - { id: d, text: "Merchant category suddenly becomes the most important driver of predictions", explanation: "Feature attribution drift monitoring tracks changes in feature importance." }
  matchTargets:
    - { id: t1, text: "Model quality" }
    - { id: t2, text: "Data quality" }
    - { id: t3, text: "Feature attribution drift" }
    - { id: t4, text: "Bias drift" }
  answer: { a: t2, b: t1, c: t4, d: t3 }
  explanation: "Model Monitor has four monitoring types: data quality (input drift), model quality (metric decline, needs ground-truth labels), bias drift and feature attribution drift (both use Clarify). Alerts flow to CloudWatch and can trigger retraining."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-23#explanation
  difficulty: medium

- id: q-week-4-008
  set: week-4
  type: multi
  stem: "A retailer wants its new product-tagging AI to meet accuracy targets while minimising environmental impact. Which choices support this goal? (Select TWO.)"
  options:
    - { id: a, text: "Use the smallest model that meets the accuracy requirement, or distil a larger one", explanation: "Correct. Smaller models need less compute and energy per request." }
    - { id: b, text: "Always choose the largest available model to be safe", explanation: "Incorrect. Larger models use more energy and cost more, often without a needed gain." }
    - { id: c, text: "Run on efficient hardware such as AWS Inferentia or Graviton and remove idle endpoints", explanation: "Correct. Efficient chips and no idle capacity reduce energy use and cost." }
    - { id: d, text: "Retrain the model from scratch every week whether or not performance has changed", explanation: "Incorrect. Unnecessary retraining wastes compute; retrain when monitoring shows a need." }
    - { id: e, text: "Keep extra endpoints running permanently in case traffic spikes", explanation: "Incorrect. Over-provisioned idle endpoints waste energy; use auto scaling or serverless options instead." }
  answer: [a, c]
  explanation: "Responsible model selection includes sustainability: the smallest suitable model, distillation, efficient hardware (Inferentia, Trainium, Graviton) and no idle endpoints. These choices also lower cost."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-23#explanation
  difficulty: medium

- id: q-week-4-009
  set: week-4
  type: single
  stem: "An insurer automates claim triage with an ML model. For high-value claims where the model's confidence is below 80%, the company wants a person to make the decision. Which design meets this requirement?"
  options:
    - { id: a, text: "A confidence threshold that routes low-confidence predictions to a human review workflow", explanation: "Correct. Thresholds send uncertain or high-impact cases to people while confident cases flow automatically." }
    - { id: b, text: "Raise the model's temperature for low-confidence claims", explanation: "Incorrect. Temperature applies to generative sampling and would not involve a person." }
    - { id: c, text: "Discard low-confidence predictions and approve those claims automatically", explanation: "Incorrect. Auto-approving uncertain cases removes oversight exactly where it is needed." }
    - { id: d, text: "Publish a SageMaker Model Card describing the model", explanation: "Incorrect. A Model Card documents the model; it does not route decisions to reviewers." }
  answer: [a]
  explanation: "Human review handles low-confidence and high-impact predictions. A confidence threshold decides which cases go to people; reviewers' decisions can also become new labelled data to improve the model."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-23#explanation
  difficulty: easy

- id: q-week-4-010
  set: week-4
  type: single
  stem: "A regulator requires a building society to show exactly how each mortgage decision is reached from about 15 applicant attributes stored in a table. Accuracy only needs to match the current scorecard. Which modelling approach fits BEST?"
  options:
    - { id: a, text: "A deep neural network with no explanation layer", explanation: "Incorrect. Deep networks are opaque and would need post-hoc explanations that only approximate their reasoning." }
    - { id: b, text: "A transparent model such as logistic regression or a small decision tree", explanation: "Correct. Transparent models can be read directly, which suits regulated tabular decisions that need clear reasons." }
    - { id: c, text: "A large language model prompted with the application data", explanation: "Incorrect. LLMs are opaque, nondeterministic and not designed for auditable scoring." }
    - { id: d, text: "An ensemble of thousands of trees", explanation: "Incorrect. Large ensembles are hard to read directly and need post-hoc explanation." }
  answer: [b]
  explanation: "Transparent models (linear and logistic regression, small decision trees, rules) can be read and audited directly. Opaque models (deep networks, large ensembles, LLMs) can be more accurate on complex data but need post-hoc techniques. When interpretability is required and accuracy is sufficient, choose the transparent model."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#exam-tips
  difficulty: easy

- id: q-week-4-011
  set: week-4
  type: single
  stem: "A declined loan applicant asks: 'What would I need to change to be approved?' Which explanation technique answers this question MOST directly?"
  options:
    - { id: a, text: "A partial dependence plot of income", explanation: "Incorrect. Partial dependence shows how the average prediction changes with one feature across all applicants." }
    - { id: b, text: "Global feature importance for the whole model", explanation: "Incorrect. Global importance summarises what matters overall, not what this applicant should change." }
    - { id: c, text: "A counterfactual explanation", explanation: "Correct. A counterfactual states the smallest change to the input that would change the outcome." }
    - { id: d, text: "A confusion matrix", explanation: "Incorrect. A confusion matrix summarises classification errors across many predictions." }
  answer: [c]
  explanation: "Counterfactual explanations ('if your debt ratio were below 40%, you would likely be approved') are very actionable for end users. SHAP gives local or global feature attributions, LIME approximates the model locally, and partial dependence plots show average effects."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#explanation
  difficulty: hard

- id: q-week-4-012
  set: week-4
  type: single
  stem: "Before production, a model approval board requires each internally built model to have a record of its intended use, risk rating, training details and evaluation results. Which AWS capability is designed for this?"
  options:
    - { id: a, text: "AWS AI Service Cards", explanation: "Incorrect. AI Service Cards are AWS's documentation of its own AI services, not of your models." }
    - { id: b, text: "SageMaker Clarify", explanation: "Incorrect. Clarify computes bias metrics and explanations; its reports can be attached to documentation, but it is not the documentation tool." }
    - { id: c, text: "AWS Artifact", explanation: "Incorrect. Artifact provides AWS compliance reports and agreements." }
    - { id: d, text: "SageMaker Model Cards", explanation: "Correct. Model Cards document a model's intended use, risk rating, training and evaluation in one place." }
  answer: [d]
  explanation: "SageMaker Model Cards document your models for governance and audits. AWS AI Service Cards document AWS-managed AI services. Clarify produces the bias and explainability evidence that can be added to a model card."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#exam-tips
  difficulty: easy

- id: q-week-4-013
  set: week-4
  type: single
  stem: "A procurement team is evaluating Amazon Rekognition for identity checks and wants AWS's own documentation of the service's intended use cases, limitations and responsible AI design choices. Where should the team look?"
  options:
    - { id: a, text: "AWS AI Service Cards", explanation: "Correct. AI Service Cards describe intended use cases, limitations and responsible AI considerations for AWS AI services." }
    - { id: b, text: "SageMaker Model Cards", explanation: "Incorrect. Model Cards are for documenting models you build or customise yourself." }
    - { id: c, text: "AWS Trusted Advisor", explanation: "Incorrect. Trusted Advisor checks an account against best practices for cost, security and quotas." }
    - { id: d, text: "Amazon Inspector findings", explanation: "Incorrect. Inspector reports software vulnerabilities in workloads." }
  answer: [a]
  explanation: "Transparency on AWS works at two levels: AWS publishes AI Service Cards for its services, and customers document their own models with SageMaker Model Cards."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#explanation
  difficulty: medium

- id: q-week-4-014
  set: week-4
  type: multi
  stem: "A public-sector agency runs a RAG chatbot that answers questions about benefits. Which measures increase the transparency of the chatbot for citizens? (Select TWO.)"
  options:
    - { id: a, text: "Show citations to the source documents behind each answer", explanation: "Correct. Citations let users see where an answer came from and check it." }
    - { id: b, text: "Hide the fact that answers are generated by AI to avoid confusion", explanation: "Incorrect. Transparency requires telling people they are dealing with AI." }
    - { id: c, text: "Tell users clearly that they are interacting with an AI assistant and what it is for", explanation: "Correct. Disclosure of AI use and purpose is a core part of transparency." }
    - { id: d, text: "Increase the temperature so answers sound more natural", explanation: "Incorrect. Temperature changes randomness, not transparency." }
    - { id: e, text: "Disable invocation logging to protect the system design", explanation: "Incorrect. Removing logs reduces accountability and auditability." }
  answer: [a, c]
  explanation: "Full explanations of LLM outputs are not yet possible, so generative AI apps increase transparency with AI disclosure, citations from RAG, agent traces and documentation. Be careful: a model's self-described reasoning may not reflect how it actually produced the answer."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#explanation
  difficulty: medium

- id: q-week-4-015
  set: week-4
  type: single
  stem: "A start-up plans to build a commercial product on an open-weight foundation model downloaded from a public model hub. What should it do FIRST from a transparency and compliance perspective?"
  options:
    - { id: a, text: "Assume the training data is public, because the weights are open", explanation: "Incorrect. Open weights do not mean the training data is published." }
    - { id: b, text: "Review the licence terms for commercial use, attribution and usage restrictions", explanation: "Correct. Open models carry licence obligations that must be checked before commercial use." }
    - { id: c, text: "Assume no attribution is ever required for open models", explanation: "Incorrect. Many open licences require attribution or impose restrictions." }
    - { id: d, text: "Avoid fine-tuning, because open-weight models cannot be customised", explanation: "Incorrect. Open-weight models can usually be fine-tuned, subject to their licence." }
  answer: [b]
  explanation: "Open models increase transparency because their weights (and sometimes code and data) can be inspected, but open-weight is not the same as open training data. Always check the licence for commercial use, attribution and restrictions."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#exam-tips
  difficulty: hard

- id: q-week-4-016
  set: week-4
  type: matching
  stem: "A responsible AI team must explain several AI systems to different audiences. Match each explanation need to the technique that fits it BEST."
  options:
    - { id: a, text: "Show how much each input feature contributed to one specific credit decision", explanation: "SHAP feature attributions assign each feature a share of the credit for a prediction." }
    - { id: b, text: "Show how average predicted risk changes as debt ratio rises, holding other features constant", explanation: "A partial dependence plot shows the average effect of one feature." }
    - { id: c, text: "Tell an applicant the smallest change that would flip the decision", explanation: "A counterfactual explanation gives the minimal change to the input that changes the outcome." }
    - { id: d, text: "Show which documents a generative AI answer was based on", explanation: "Citations from RAG make generative answers traceable to sources." }
  matchTargets:
    - { id: t1, text: "Counterfactual explanation" }
    - { id: t2, text: "SHAP feature attributions" }
    - { id: t3, text: "RAG citations" }
    - { id: t4, text: "Partial dependence plot" }
  answer: { a: t2, b: t4, c: t1, d: t3 }
  explanation: "Opaque models need post-hoc explanations: SHAP and LIME for feature attributions, partial dependence plots for average effects, counterfactuals for actionable what-ifs. For generative AI, citations and agent traces add transparency."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#explanation
  difficulty: medium

- id: q-week-4-017
  set: week-4
  type: single
  stem: "A hospital's application runs in private subnets of a VPC with no internet gateway. Calls to Amazon Bedrock must not traverse the public internet. Which solution meets this requirement?"
  options:
    - { id: a, text: "Add a NAT gateway so the subnets can reach Bedrock", explanation: "Incorrect. A NAT gateway sends traffic to the service's public endpoint over the internet path." }
    - { id: b, text: "Put AWS WAF in front of the application", explanation: "Incorrect. AWS WAF filters HTTP requests to web applications and is out of scope for this exam; it does not provide private connectivity." }
    - { id: c, text: "Create a VPC interface endpoint for Amazon Bedrock using AWS PrivateLink", explanation: "Correct. Interface endpoints keep traffic between the VPC and Bedrock on the AWS network." }
    - { id: d, text: "Attach an internet gateway and restrict it with a security group", explanation: "Incorrect. This still routes traffic over the internet." }
  answer: [c]
  explanation: "'Without traversing the internet' or 'private connectivity' → VPC interface endpoint powered by AWS PrivateLink. Endpoint policies can further restrict which models or actions are allowed through the endpoint."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#exam-tips
  difficulty: easy

- id: q-week-4-018
  set: week-4
  type: single
  stem: "Before fine-tuning, a retailer wants to find out whether any of its 400 Amazon S3 buckets of chat exports contain names, card numbers or addresses. Which service should it use?"
  options:
    - { id: a, text: "Amazon Inspector", explanation: "Incorrect. Inspector scans compute workloads for software vulnerabilities." }
    - { id: b, text: "Amazon GuardDuty", explanation: "Incorrect. GuardDuty is threat detection from logs and is out of scope for this exam." }
    - { id: c, text: "Amazon Bedrock Guardrails", explanation: "Incorrect. Guardrails mask PII in live prompts and responses; they do not scan stored S3 data." }
    - { id: d, text: "Amazon Macie", explanation: "Correct. Macie uses ML and pattern matching to discover sensitive data such as PII in S3 buckets." }
  answer: [d]
  explanation: "'Discover PII in S3' → Amazon Macie. 'Mask PII in model responses' → Guardrails sensitive information filter. Finding and treating sensitive data before training is part of securing AI systems."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#exam-tips
  difficulty: medium

- id: q-week-4-019
  set: week-4
  type: single
  stem: "A bank's security policy requires it to control, rotate, disable and audit the use of the encryption keys that protect its fine-tuning data and custom model. Which option meets this requirement?"
  options:
    - { id: a, text: "An AWS KMS customer managed key", explanation: "Correct. Customer managed keys give you control over key policy, rotation and disabling, with usage logged in CloudTrail." }
    - { id: b, text: "An AWS owned key", explanation: "Incorrect. AWS owned keys are managed entirely by AWS and cannot be controlled or audited by the customer." }
    - { id: c, text: "AWS Secrets Manager", explanation: "Incorrect. Secrets Manager stores and rotates credentials such as API keys, not data encryption keys." }
    - { id: d, text: "Storing a key in the application's source code", explanation: "Incorrect. Keys in code are a security risk and cannot be governed." }
  answer: [a]
  explanation: "KMS encrypts data at rest; choose customer managed keys when you need to control, rotate, revoke or audit key use. TLS protects data in transit. Bedrock supports customer managed keys for custom models, knowledge bases and agents."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: medium

- id: q-week-4-020
  set: week-4
  type: single
  stem: "An AI agent's Lambda tool calls a partner's shipping API that requires an API key. The key must be rotated every 90 days and must never appear in code or prompts. Where should the key be stored?"
  options:
    - { id: a, text: "Hard-coded in the Lambda function", explanation: "Incorrect. Secrets in code are easily exposed and hard to rotate." }
    - { id: b, text: "AWS Secrets Manager, retrieved by the function at run time", explanation: "Correct. Secrets Manager stores, encrypts and rotates credentials, and access is controlled with IAM." }
    - { id: c, text: "In the agent's system prompt", explanation: "Incorrect. System prompts can leak through prompt attacks." }
    - { id: d, text: "In a prompt template variable filled in by the user", explanation: "Incorrect. This exposes the key to users and the model." }
  answer: [b]
  explanation: "'Store and rotate credentials or API keys' → AWS Secrets Manager. The function's IAM role grants permission to read only that secret, following least privilege."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#exam-tips
  difficulty: easy

- id: q-week-4-021
  set: week-4
  type: multi
  stem: "A company builds a customer-facing application on Amazon Bedrock. Under the shared responsibility model, which responsibilities belong to the company? (Select TWO.)"
  options:
    - { id: a, text: "Physical security of the data centres that host the models", explanation: "Incorrect. Security of the cloud, including facilities, is AWS's responsibility." }
    - { id: b, text: "IAM policies that control who can invoke which models", explanation: "Correct. Identity and access configuration is always the customer's responsibility." }
    - { id: c, text: "Patching the servers that run the foundation models", explanation: "Incorrect. Bedrock is a managed service; AWS maintains the underlying infrastructure." }
    - { id: d, text: "Classifying the data sent in prompts and deciding how outputs are used", explanation: "Correct. Customers own their data and how they use model outputs." }
    - { id: e, text: "Maintaining the Bedrock service's internal network", explanation: "Incorrect. AWS secures the service infrastructure." }
  answer: [b, d]
  explanation: "AWS is responsible for security OF the cloud (infrastructure, managed model hosting). The customer is responsible for security IN the cloud: identities and permissions, data, configuration such as guardrails and encryption choices, and how outputs are used."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: hard

- id: q-week-4-022
  set: week-4
  type: single
  stem: "A productivity agent hosted on Amazon Bedrock AgentCore must read each user's calendar in a third-party SaaS product on that user's behalf, using OAuth tokens scoped to that user. Which capability is designed for this?"
  options:
    - { id: a, text: "IAM user access keys embedded in the agent code", explanation: "Incorrect. Long-term keys in code are insecure and are not per-user delegated access." }
    - { id: b, text: "Policy in AgentCore", explanation: "Incorrect. Policy defines rules about which tools an agent may call; it does not manage users' OAuth credentials." }
    - { id: c, text: "AgentCore Identity", explanation: "Correct. AgentCore Identity manages agent identities and scoped credentials such as OAuth tokens for acting on behalf of users." }
    - { id: d, text: "Amazon Bedrock Guardrails", explanation: "Incorrect. Guardrails filter content; they do not handle authentication to external tools." }
  answer: [c]
  explanation: "'Agent acts on behalf of a user', 'OAuth tokens for tools' → AgentCore Identity. 'Rules on which tools an agent may call' → Policy in AgentCore. Both support least privilege for agents."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#exam-tips
  difficulty: hard

- id: q-week-4-023
  set: week-4
  type: single
  stem: "A data lake on Amazon S3 holds customer records used for ML training. Data scientists may see purchase history but not names or email columns, and the EU team may only see EU rows. Which service provides these controls?"
  options:
    - { id: a, text: "AWS Glue Data Catalog", explanation: "Incorrect. The Data Catalog records what data exists and its schema; it does not enforce column- and row-level permissions on its own." }
    - { id: b, text: "Amazon Macie", explanation: "Incorrect. Macie discovers sensitive data but does not grant fine-grained access." }
    - { id: c, text: "AWS Config", explanation: "Incorrect. Config tracks resource configuration compliance." }
    - { id: d, text: "AWS Lake Formation", explanation: "Correct. Lake Formation centralises fine-grained access control at database, table, column, row and cell level." }
  answer: [d]
  explanation: "'Fine-grained', 'column-level', 'row-level' access to a data lake → AWS Lake Formation, including tag-based access control. Services such as Redshift, EMR and Glue respect these permissions."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-26#exam-tips
  difficulty: medium

- id: q-week-4-024
  set: week-4
  type: single
  stem: "A security review warns that anyone in the company can upload files to the S3 bucket feeding a customer-facing knowledge base, so an insider could plant false policy documents. Which measure BEST protects the integrity of this data?"
  options:
    - { id: a, text: "Restrict write access to the pipeline roles that need it and enable S3 Versioning", explanation: "Correct. Limiting writers prevents planted documents, and versioning allows changes to be traced and rolled back." }
    - { id: b, text: "Grant column-level read permissions in Lake Formation", explanation: "Incorrect. Read permissions do not stop someone from writing poisoned documents." }
    - { id: c, text: "Increase the chunk overlap in the knowledge base", explanation: "Incorrect. Chunking affects retrieval quality, not data integrity." }
    - { id: d, text: "Add a Guardrails word filter for competitor names", explanation: "Incorrect. A word filter does not detect false documents in the source data." }
  answer: [a]
  explanation: "Data poisoning inserts misleading data into training sets or knowledge bases. Defences: restrict write access, S3 Versioning and Object Lock, checksums of approved datasets, vetted sources and review of new documents, and CloudTrail logging of changes."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-26#explanation
  difficulty: hard

- id: q-week-4-025
  set: week-4
  type: matching
  stem: "A data protection officer is reviewing how a training pipeline handles personal data. Match each technique to its description."
  options:
    - { id: a, text: "Keep only the columns the churn model needs and drop names entirely", explanation: "Data minimisation keeps only the data the use case requires." }
    - { id: b, text: "Show card numbers as 'card ending 1234'", explanation: "Masking replaces sensitive values with symbols or partial values." }
    - { id: c, text: "Replace each customer ID with a consistent token, with the mapping stored separately", explanation: "Pseudonymisation lets records still be joined, but data can be re-linked through the protected mapping." }
    - { id: d, text: "Add calibrated statistical noise so group results are useful but no individual can be inferred", explanation: "Differential privacy protects individuals while keeping aggregate results useful." }
    - { id: e, text: "Generate artificial records that keep the statistical patterns of real data", explanation: "Synthetic data describes no real people and is useful for testing and some training." }
  matchTargets:
    - { id: t1, text: "Data minimisation" }
    - { id: t2, text: "Masking" }
    - { id: t3, text: "Pseudonymisation" }
    - { id: t4, text: "Differential privacy" }
    - { id: t5, text: "Synthetic data" }
  answer: { a: t1, b: t2, c: t3, d: t4, e: t5 }
  explanation: "Privacy-enhancing techniques reduce how identifiable data is: minimisation, masking and redaction, pseudonymisation and tokenisation, anonymisation and aggregation, differential privacy and synthetic data. Pseudonymised data can still be linked; anonymised data should not be re-identifiable."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-26#explanation
  difficulty: medium

- id: q-week-4-026
