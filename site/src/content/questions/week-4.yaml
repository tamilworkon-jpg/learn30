- id: q-week-4-029
  set: week-4
  type: single
  stem: "An architecture team wants to review its new generative AI workload against AWS best practices using a dedicated Generative AI lens, record risks and produce an improvement plan. Which service fits BEST?"
  options:
    - { id: a, text: "AWS Well-Architected Tool", explanation: "Correct. The Well-Architected Tool reviews workloads against best practices with lenses such as Generative AI and creates improvement plans." }
    - { id: b, text: "AWS Trusted Advisor", explanation: "Incorrect. Trusted Advisor runs automated account-level checks; it does not conduct lens-based workload reviews." }
