- id: q-week-4-030
  set: week-4
  type: matching
  stem: "A CISO is mapping five generative AI use cases to the Generative AI Security Scoping Matrix. Match each use case to its scope."
  options:
    - { id: a, text: "Staff use a free public chatbot website to draft emails", explanation: "Scope 1, consumer app: the company controls only what data it enters and its usage policy." }
    - { id: b, text: "A CRM SaaS product with built-in generative AI features under an enterprise agreement", explanation: "Scope 2, enterprise app: the company controls contract terms, configuration and access." }
    - { id: c, text: "The company's own app calls a foundation model through Amazon Bedrock", explanation: "Scope 3, pre-trained models: the company owns the application, prompts, data and guardrails." }
    - { id: d, text: "The app uses a Bedrock model the company fine-tuned on its own data", explanation: "Scope 4, fine-tuned models: scope 3 responsibilities plus the fine-tuning data and custom model." }
    - { id: e, text: "A model the company trained from scratch on its own data", explanation: "Scope 5, self-trained models: the company owns the whole stack." }
  matchTargets:
