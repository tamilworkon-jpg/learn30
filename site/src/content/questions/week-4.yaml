    - { id: t2, text: "Scope 2 — Enterprise app" }
    - { id: t3, text: "Scope 3 — Pre-trained models" }
    - { id: t4, text: "Scope 4 — Fine-tuned models" }
    - { id: t5, text: "Scope 5 — Self-trained models" }
  answer: { a: t1, b: t2, c: t3, d: t4, e: t5 }
  explanation: "Scopes 1 and 2 are buying; scopes 3 to 5 are building. Moving from 1 to 5 adds control and responsibility. For each scope, consider governance and compliance, legal and privacy, risk management, controls and resilience."
  domain: D5
  taskStatement: "5.2"
  lessonRef: day-27#explanation
  difficulty: medium

- id: q-week-4-031
  set: week-4
  type: multi
  stem: "A bank is setting up governance for generative AI across its business units. Which practices reflect effective AI governance processes? (Select TWO.)"
  options:
    - { id: a, text: "Create a cross-functional review board that approves high-risk AI use cases", explanation: "Correct. A board with business, legal, security, data science and risk members gives accountable oversight." }
    - { id: b, text: "Complete a launch checklist once and skip further reviews", explanation: "Incorrect. Governance is continuous; models and risks change after launch." }
    - { id: c, text: "Define a review cadence, such as quarterly reviews for high-risk models and after any incident", explanation: "Correct. A regular cadence keeps controls current." }
    - { id: d, text: "Let each employee choose any public chatbot for customer data", explanation: "Incorrect. An acceptable use policy and training should prevent confidential data entering consumer tools." }
    - { id: e, text: "Rely on CloudWatch dashboards as the only governance control", explanation: "Incorrect. Monitoring is one tool; governance also needs policies, owners, reviews and training." }
  answer: [a, c]
  explanation: "Governance processes include policies (acceptable use, model approval, data classification), named owners and a review board, a review cadence, staff training and up-to-date documentation such as Model Cards and risk assessments."
  domain: D5
  taskStatement: "5.2"
  lessonRef: day-27#explanation
  difficulty: medium

- id: q-week-4-032
  set: week-4
  type: multi
  stem: "A European health insurer must keep patient data processed by its Amazon Bedrock assistant inside the EU and must retain model invocation logs unchanged for seven years. Which measures meet these requirements? (Select TWO.)"
  options:
    - { id: a, text: "Deploy in an EU Region and use only EU-scoped cross-Region inference profiles if any", explanation: "Correct. Region choice controls data residency; cross-Region inference must stay within the required geography." }
    - { id: b, text: "Use a global cross-Region inference profile for maximum throughput", explanation: "Incorrect. Global routing may process data outside the EU." }
    - { id: c, text: "Store the logs in S3 with Object Lock and a seven-year retention period", explanation: "Correct. Object Lock keeps records unchangeable for the retention period." }
    - { id: d, text: "Download AWS SOC reports from AWS Artifact", explanation: "Incorrect. Artifact supplies AWS's compliance reports; it does not control residency or retention." }
    - { id: e, text: "Run AWS Trusted Advisor checks weekly", explanation: "Incorrect. Trusted Advisor gives best-practice recommendations; it does not enforce retention or residency." }
  answer: [a, c]
  explanation: "Data governance covers residency (Region choice, care with cross-Region inference), retention (S3 Lifecycle, Glacier, Object Lock, log retention settings), logging and monitoring."
