    - { id: c, text: "AWS Artifact", explanation: "Incorrect. Artifact provides AWS's own compliance reports." }
    - { id: d, text: "Amazon Inspector", explanation: "Incorrect. Inspector finds software vulnerabilities, not misconfigured bucket settings." }
  answer: [b]
