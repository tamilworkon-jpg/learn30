- id: q-day-12-018
  set: day-12
  type: multi
  stem: "A developer is building a policy-question assistant on Amazon Bedrock. Which Bedrock capabilities can provide managed retrieval over company documents and safety filtering of inputs and outputs? (Select TWO.)"
  options:
    - { id: a, text: "Amazon Bedrock Knowledge Bases", explanation: "Correct. Knowledge Bases provide managed RAG: ingest documents, create embeddings, store them and retrieve relevant passages." }
    - { id: b, text: "Amazon Bedrock Guardrails", explanation: "Correct. Guardrails apply content filters, denied topics, PII redaction and grounding checks to inputs and outputs." }
    - { id: c, text: "SageMaker HyperPod clusters", explanation: "Incorrect. HyperPod is for large-scale training in SageMaker AI, not retrieval or safety filtering." }
    - { id: d, text: "Kiro agent hooks", explanation: "Incorrect. Agent hooks automate developer tasks in the Kiro IDE." }
    - { id: e, text: "AWS Transform mainframe agents", explanation: "Incorrect. These agents modernise legacy applications." }
  answer: [a, b]
  explanation: "Bedrock includes building blocks around models: Knowledge Bases (managed RAG), Agents, Guardrails, model customisation, model evaluation, prompt management and flows, plus Custom Model Import and Marketplace."
