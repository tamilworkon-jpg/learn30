  taskStatement: "2.3"
  lessonRef: day-12#explanation
  difficulty: medium

- id: q-day-12-019
  set: day-12
  type: ordering
  stem: "Order these AWS options from the LEAST to the MOST control over models and infrastructure (which is also the order of increasing operational responsibility)."
  options:
    - { id: a, text: "Amazon SageMaker AI training a custom model on instances you choose", explanation: "Last: you choose algorithms, frameworks, instances and hosting — maximum control and responsibility." }
    - { id: b, text: "Amazon Quick", explanation: "First: a ready-made application — you use it rather than build it, with the least control over models." }
    - { id: c, text: "Amazon Bedrock", explanation: "Second: you build your own application on serverless FMs, but AWS operates the models and infrastructure." }
    - { id: d, text: "Amazon SageMaker JumpStart deployment of a pre-trained model to your own endpoint", explanation: "Third: you choose instance types, scaling and networking for a pre-trained model, but do not train from scratch." }
  answer: [b, c, d, a]
  explanation: "The higher the layer of the stack, the less you build and manage: applications such as Amazon Quick, then Bedrock's serverless models, then JumpStart deployments on your own endpoints, then fully custom training and hosting in SageMaker AI."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-12#explanation
  difficulty: medium

