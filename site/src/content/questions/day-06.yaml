- id: q-day-06-016
  set: day-06
  type: single
  stem: "Only 2% of loan applications in a dataset end in default. A model reports 98% accuracy, but the risk team suspects it rarely identifies defaulters. Which single metric should the team use to judge the model on both missed defaulters and false alarms?"
  options:
    - { id: a, text: "Accuracy, because 98% is close to perfect", explanation: "Incorrect. A model that predicts 'no default' for everyone also scores 98%, so accuracy hides the problem." }
    - { id: b, text: "F1 score, because it balances precision and recall on imbalanced data", explanation: "Correct. F1 is the harmonic mean of precision and recall and stays low if the model misses defaulters or raises many false alarms." }
    - { id: c, text: "MAE, because it measures the average size of errors", explanation: "Incorrect. MAE is a regression metric for numeric predictions, not for a default yes/no classification." }
    - { id: d, text: "R², because it shows how much variation the model explains", explanation: "Incorrect. R² is a regression metric and does not apply to this classification task." }
  answer: [b]
  explanation: "With imbalanced classes, accuracy is misleading. Precision measures false alarms, recall measures misses, and F1 combines both into one number. AUC is also useful to compare classifiers across thresholds."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#exam-tips
  difficulty: hard

- id: q-day-06-017
  set: day-06
  type: multi
  stem: "A product-recommendation model is live. Leadership asks whether it is worth the money. Which are business metrics rather than model metrics? (Select TWO.)"
  options:
    - { id: a, text: "Cost per user served", explanation: "Correct. Cost per user is a business metric that links running costs to the people who benefit." }
    - { id: b, text: "Return on investment (ROI)", explanation: "Correct. ROI compares the financial gain with the cost of building and running the model." }
    - { id: c, text: "F1 score", explanation: "Incorrect. F1 is a model metric that combines precision and recall." }
    - { id: d, text: "AUC", explanation: "Incorrect. AUC is a model metric that measures how well a classifier separates classes." }
    - { id: e, text: "RMSE", explanation: "Incorrect. RMSE is a model metric for regression error." }
  answer: [a, b]
  explanation: "Model metrics such as precision, recall, F1, AUC and RMSE describe predictive quality. Business metrics such as cost per user, development cost, ROI, conversion uplift and customer feedback decide whether the model is worth running."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: easy

- id: q-day-06-018
  set: day-06
  type: single
  stem: "A model predicting taxi journey times has an MAE of 3 minutes and an RMSE of 11 minutes. What does the large gap between the two values MOST likely indicate?"
  options:
    - { id: a, text: "Most predictions are close, but a few predictions are very far off", explanation: "Correct. RMSE squares errors, so a handful of very large misses raises it far above MAE." }
    - { id: b, text: "The model is a classifier, so these metrics are invalid", explanation: "Incorrect. MAE and RMSE are standard metrics for regression models such as journey-time prediction." }
    - { id: c, text: "Every prediction is wrong by exactly 11 minutes", explanation: "Incorrect. If every error were the same size, MAE and RMSE would be equal." }
    - { id: d, text: "The model has perfect precision and recall", explanation: "Incorrect. Precision and recall are classification metrics and say nothing about journey-time errors." }
  answer: [a]
  explanation: "MAE is the average absolute error in plain units. RMSE squares errors before averaging, so it punishes large errors more. When RMSE is much larger than MAE, a few big misses — perhaps in bad weather or heavy traffic — deserve investigation."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#examples
  difficulty: medium

- id: q-day-06-019
  set: day-06
  type: single
  stem: "What is the main purpose of Amazon SageMaker Pipelines?"
  options:
    - { id: a, text: "To define ML steps such as processing, training, evaluation and registration as an automated, repeatable workflow", explanation: "Correct. Pipelines automates the ML workflow so the same model can be rebuilt and redeployed reliably." }
    - { id: b, text: "To label images with a human workforce", explanation: "Incorrect. Human labelling is the job of SageMaker Ground Truth." }
    - { id: c, text: "To subscribe to third-party datasets", explanation: "Incorrect. Third-party data subscriptions are provided by AWS Data Exchange." }
    - { id: d, text: "To provide a no-code interface for business analysts to build models", explanation: "Incorrect. No-code model building is the job of SageMaker Canvas." }
  answer: [a]
  explanation: "SageMaker Pipelines is the automation backbone of MLOps on SageMaker AI. A pipeline chains steps — process data, train, evaluate, check a quality condition, register the model — and can run on a schedule or be triggered by events such as drift alerts."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: easy

- id: q-day-06-020
  set: day-06
  type: single
  stem: "A demand-forecasting model's accuracy falls steadily after customer buying habits change. The team wants the model to stay accurate with as little manual work as possible. Which design BEST meets this goal?"
  options:
    - { id: a, text: "Retrain manually whenever someone notices complaints from planners", explanation: "Incorrect. Waiting for complaints is slow and depends on manual effort, which is what MLOps aims to remove." }
    - { id: b, text: "Increase the endpoint instance size so predictions are faster", explanation: "Incorrect. Faster inference does not fix a model whose patterns no longer match reality." }
    - { id: c, text: "Use Model Monitor to detect drift and trigger a SageMaker Pipelines run that retrains on recent data and registers the new version for approval", explanation: "Correct. Monitoring plus automated retraining and a registry approval gate keeps the model accurate with minimal manual effort." }
    - { id: d, text: "Freeze the model so its predictions stay consistent over time", explanation: "Incorrect. A frozen model keeps making stale predictions as the world changes; consistency is not the same as accuracy." }
  answer: [c]
  explanation: "When the relationship between inputs and outcomes changes (concept drift) or input data shifts (data drift), accuracy decays. MLOps closes the loop: Model Monitor detects drift, alarms trigger an automated retraining pipeline, and Model Registry gates the new version before deployment."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: hard
