- id: q-day-06-012
  set: day-06
  type: single
  stem: "A bank's card-fraud model blocks many genuine purchases, and customers are complaining. The bank still wants to catch most fraud but must reduce false alarms. What should the team do?"
  options:
    - { id: a, text: "Lower the decision threshold so the model flags more transactions", explanation: "Incorrect. Lowering the threshold raises recall but creates even more false positives — the opposite of what is needed." }
    - { id: b, text: "Judge the model only on accuracy, which is already above 99%", explanation: "Incorrect. With rare fraud, accuracy hides the false-positive problem; it is the wrong metric here." }
    - { id: c, text: "Raise the decision threshold and track precision alongside recall", explanation: "Correct. A higher threshold flags fewer, more confident cases, improving precision; tracking recall ensures most fraud is still caught." }
    - { id: d, text: "Switch to RMSE as the main evaluation metric", explanation: "Incorrect. RMSE measures regression error and does not apply to a fraud yes/no decision." }
  answer: [c]
  explanation: "Classifiers output a probability that a threshold turns into a decision. Raising the threshold increases precision and lowers recall; lowering it does the opposite. The right balance depends on the business cost of false positives versus false negatives, and F1 summarises the balance."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: hard

- id: q-day-06-013
  set: day-06
  type: multi
  stem: "In which situations is self-hosting a model, for example on a SageMaker AI endpoint, a better choice than calling a managed API? (Select TWO.)"
  options:
    - { id: a, text: "The team has fine-tuned an open-source model and needs full control over the model version, hardware and networking", explanation: "Correct. Self-hosting gives full control over custom weights, versions, instance types and network configuration." }
    - { id: b, text: "Traffic is steady and very high, so dedicated instances cost less than per-request pricing", explanation: "Correct. At constant high volume, paying for instances that are always busy can be cheaper than paying per request or token." }
    - { id: c, text: "The team is small and has no one to manage infrastructure", explanation: "Incorrect. Lack of operations staff points to a managed API, where AWS runs the infrastructure." }
    - { id: d, text: "Traffic is low and spiky, with long idle periods", explanation: "Incorrect. Self-hosted instances bill while idle; spiky low traffic suits pay-per-use managed APIs." }
    - { id: e, text: "The team wants to start within a day without choosing instance types", explanation: "Incorrect. Fast starts without capacity planning are the advantage of a managed API." }
  answer: [a, b]
  explanation: "A managed API trades control for simplicity: no servers, pay per use, quick start. Self-hosting suits custom or open-source models, strict control requirements and steady high volume, but you take on capacity planning, scaling, patching and monitoring."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: hard

