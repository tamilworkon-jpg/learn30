- id: q-day-06-009
  set: day-06
  type: single
  stem: "A three-person start-up wants to add text generation to its app. Traffic is unpredictable, and the team does not want to manage servers, scaling or model updates. How should it consume a foundation model?"
  options:
    - { id: a, text: "Download an open-source model and run it on Amazon EC2 GPU instances", explanation: "Incorrect. Self-hosting on EC2 means managing instances, scaling, patching and paying while they run." }
    - { id: b, text: "Train a new foundation model from scratch on SageMaker AI", explanation: "Incorrect. Training from scratch is enormously expensive and unnecessary for a small team." }
    - { id: c, text: "Host the model on an Amazon EKS cluster that the team operates", explanation: "Incorrect. A self-managed cluster adds the operational work the team wants to avoid." }
    - { id: d, text: "Call a model through Amazon Bedrock as a managed API", explanation: "Correct. Bedrock provides foundation models through an API with no infrastructure to manage and pay-per-use pricing." }
  answer: [d]
  explanation: "A managed API such as Amazon Bedrock suits small teams, fast starts and variable traffic: AWS runs the infrastructure and you pay per request or token. Self-hosting on a SageMaker AI endpoint, EC2, EKS or ECS gives more control but adds operational work and instance costs."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-day-06-010
