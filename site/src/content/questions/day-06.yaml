- id: q-day-06-001
  set: day-06
  type: single
  stem: "Three data science teams each rebuild the same 'average monthly spend' and 'days since last order' features for their own models, and the values sometimes differ. Which Amazon SageMaker AI feature solves this?"
  options:
    - { id: a, text: "SageMaker Model Monitor", explanation: "Incorrect. Model Monitor watches deployed models for drift; it does not store and share features." }
    - { id: b, text: "SageMaker Ground Truth", explanation: "Incorrect. Ground Truth manages data labelling, not feature reuse." }
    - { id: c, text: "SageMaker Feature Store", explanation: "Correct. Feature Store is a central repository to store, share and reuse consistent features for training and inference." }
    - { id: d, text: "SageMaker JumpStart", explanation: "Incorrect. JumpStart offers pre-trained models, not a shared store of a company's features." }
  answer: [c]
  explanation: "SageMaker Feature Store keeps curated features in one place so teams reuse the same definitions for training and inference. That avoids duplicated work and inconsistent values — a typical source of technical debt in ML projects."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: easy

- id: q-day-06-002
  set: day-06
  type: single
  stem: "Business analysts need to clean and normalise a customer dataset before it is used for ML. They do not write code and want a visual tool with ready-made transformations. Which AWS service fits BEST?"
  options:
    - { id: a, text: "AWS Glue DataBrew", explanation: "Correct. DataBrew is a visual, no-code data preparation tool with hundreds of built-in transformations and data-quality profiles." }
    - { id: b, text: "Amazon EMR", explanation: "Incorrect. EMR runs big-data frameworks such as Apache Spark and requires engineering skills." }
    - { id: c, text: "AWS Data Exchange", explanation: "Incorrect. Data Exchange is for finding and subscribing to third-party datasets, not cleaning data." }
    - { id: d, text: "Amazon Redshift", explanation: "Incorrect. Redshift is a data warehouse queried with SQL, not a visual no-code cleaning tool." }
  answer: [a]
  explanation: "AWS Glue DataBrew targets analysts and data scientists who want to prepare data visually without code. SageMaker Data Wrangler and SageMaker Canvas offer similar visual preparation inside SageMaker AI."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: easy

- id: q-day-06-003
  set: day-06
  type: single
  stem: "A churn model has run in production for six months. The company wants to be alerted automatically when the incoming customer data starts to differ from the data the model was trained on. Which feature should it use?"
  options:
    - { id: a, text: "SageMaker Data Wrangler", explanation: "Incorrect. Data Wrangler prepares data before training; it does not monitor production traffic." }
    - { id: b, text: "SageMaker Model Registry", explanation: "Incorrect. Model Registry tracks model versions and approvals, not live data drift." }
    - { id: c, text: "AWS Glue DataBrew", explanation: "Incorrect. DataBrew is a data preparation tool, not a production monitoring service." }
    - { id: d, text: "SageMaker Model Monitor", explanation: "Correct. Model Monitor compares production inputs and predictions with a training baseline and reports data drift, model-quality decay and bias drift." }
  answer: [d]
  explanation: "Monitoring is a core MLOps stage. SageMaker Model Monitor runs on a schedule against a deployed endpoint, compares live data with the training baseline and raises violations that can trigger CloudWatch alarms and retraining."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-day-06-004
  set: day-06
  type: single
  stem: "A hospital builds a model to flag possible early-stage cancer on scans for follow-up by a specialist. Missing a real case is far more harmful than an unnecessary follow-up. Which metric should the team prioritise?"
  options:
    - { id: a, text: "Precision", explanation: "Incorrect. Precision limits false alarms; here false alarms are acceptable but misses are not." }
    - { id: b, text: "Recall", explanation: "Correct. Recall measures how many real cases are caught; maximising it minimises false negatives, the costly error here." }
    - { id: c, text: "Accuracy", explanation: "Incorrect. With rare positive cases, accuracy can be high even when many cancers are missed." }
    - { id: d, text: "RMSE", explanation: "Incorrect. RMSE measures error for regression, not for a yes/no classification." }
  answer: [b]
  explanation: "Recall = TP ÷ (TP + FN). Prioritise recall when false negatives (missed cases) are costly — disease screening, fraud, safety defects. Prioritise precision when false positives are costly, and use F1 when both matter."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-day-06-005
  set: day-06
  type: multi
  stem: "A team's model is retrained by one data scientist running notebook cells by hand, and nobody else can reproduce it. Which MLOps practices would MOST improve this situation? (Select TWO.)"
  options:
    - { id: a, text: "Automate the steps as a pipeline, for example with SageMaker Pipelines", explanation: "Correct. An automated pipeline makes training repeatable and removes fragile manual steps." }
    - { id: b, text: "Version the data, code and models, and register each model version", explanation: "Correct. Versioning and a model registry let anyone trace and rebuild exactly the same model." }
    - { id: c, text: "Keep retraining manual but document the notebook cells in an email", explanation: "Incorrect. Documentation in email does not make the process repeatable or scalable; it leaves the technical debt in place." }
    - { id: d, text: "Stop monitoring the model once its accuracy is high", explanation: "Incorrect. Models decay as data changes; monitoring is a core MLOps practice." }
    - { id: e, text: "Deploy every new model straight to production without evaluation", explanation: "Incorrect. Production readiness requires evaluation and approval gates before deployment." }
  answer: [a, b]
  explanation: "MLOps applies engineering discipline to ML: experiment tracking, automated and repeatable pipelines, versioning, scalable infrastructure, production-readiness checks, monitoring and retraining. These reduce technical debt and make models reliable."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-day-06-006
  set: day-06
  type: single
  stem: "A spam filter is tested on a batch of emails. It produces 45 true positives, 15 false positives and 30 false negatives. What is its precision?"
  options:
    - { id: a, text: "60%", explanation: "Incorrect. 60% is the recall: 45 ÷ (45 + 30)." }
    - { id: b, text: "25%", explanation: "Incorrect. 25% is the share of flagged emails that were false positives: 15 ÷ 60." }
    - { id: c, text: "75%", explanation: "Correct. Precision = TP ÷ (TP + FP) = 45 ÷ (45 + 15) = 75%." }
    - { id: d, text: "50%", explanation: "Incorrect. 45 ÷ (45 + 15 + 30) mixes false positives and false negatives and is not precision." }
  answer: [c]
  explanation: "Precision answers 'of everything flagged, how much was right?': TP ÷ (TP + FP). Recall answers 'of all real cases, how many were caught?': TP ÷ (TP + FN). Here precision is 75% and recall is 60%."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#examples
  difficulty: medium

- id: q-day-06-007
  set: day-06
  type: ordering
  stem: "Place these stages of the ML development lifecycle in the correct order, from first to last."
  options:
    - { id: a, text: "Train and tune candidate models", explanation: "This is the third stage: models learn from the prepared data and hyperparameters are tuned." }
    - { id: b, text: "Deploy the model and monitor it in production", explanation: "This is the last stage: the model serves predictions and is watched for drift, triggering retraining when needed." }
    - { id: c, text: "Identify the business goal and frame the ML problem", explanation: "This is the first stage: success criteria and the ML task must be defined before any data work." }
    - { id: d, text: "Evaluate the model against held-out data and the business target", explanation: "This is the fourth stage: the model must meet the agreed metrics before deployment." }
    - { id: e, text: "Collect, clean and prepare the data, including feature engineering", explanation: "This is the second stage: the data is gathered, explored, cleaned and turned into features." }
  answer: [c, e, a, d, b]
  explanation: "The lifecycle runs from business goal and problem framing, through data collection and preparation, training and tuning, and evaluation, to deployment and monitoring. Monitoring feeds back into data collection when the model needs retraining, so the lifecycle is a loop."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

