- id: q-day-24-017
  set: day-24
  type: multi
  stem: "A company plans to fine-tune an open-weight model from a public model hub and use it in a paid product. Which licence terms must the company check? (Select TWO.)"
  options:
    - { id: a, text: "Whether commercial use and fine-tuning of the model are permitted", explanation: "Correct. Some licences forbid commercial use or restrict derivative models." }
    - { id: b, text: "Acceptable use restrictions and attribution requirements", explanation: "Correct. Custom and community licences often prohibit certain uses and require specific attribution." }
    - { id: c, text: "Whether the model weights are larger than 10 GB", explanation: "Incorrect. File size is an engineering concern, not a licence term." }
    - { id: d, text: "Whether the model was trained on GPUs", explanation: "Incorrect. The training hardware does not affect what the licence allows." }
    - { id: e, text: "Whether the model supports streaming responses", explanation: "Incorrect. Streaming is a technical feature, not a licence condition." }
  answer: [a, b]
  explanation: "Before using an open model or dataset, check commercial use, modification and fine-tuning rights, redistribution, attribution and prohibited uses. Licensing connects directly to the intellectual property risk of generative AI."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#explanation
  difficulty: medium

- id: q-day-24-018
  set: day-24
  type: multi
  stem: "A bank is designing explanations for an AI-assisted loan process. Which practices follow human-centred design for explainable AI? (Select THREE.)"
  options:
    - { id: a, text: "Tailor explanations to each audience, such as plain-language reasons for customers and SHAP values for data scientists", explanation: "Correct. Different people need different explanations to understand and act." }
    - { id: b, text: "Show loan officers the key factors and confidence level, and let them override the recommendation", explanation: "Correct. This supports amplified decision-making with a human in control." }
    - { id: c, text: "Give customers a way to contest a decision and reach a human", explanation: "Correct. Contestability and human contact are core to human-centred AI." }
    - { id: d, text: "Show only a single risk score with no reasons, to keep the screen simple", explanation: "Incorrect. A bare score gives people nothing to act on and encourages automation bias." }
    - { id: e, text: "Avoid telling customers that AI is involved, to prevent confusion", explanation: "Incorrect. Disclosure of AI use is a basic transparency practice." }
    - { id: f, text: "Use the same technical SHAP chart for customers, regulators and engineers", explanation: "Incorrect. Technical charts suit data scientists but not customers; explanations should match the audience." }
  answer: [a, b, c]
  explanation: "Human-centred explainable AI puts the people who use and are affected by the system first: tailored explanations, honest uncertainty, override for experts, disclosure of AI use and a route to contest decisions."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#explanation
  difficulty: medium

- id: q-day-24-019
  set: day-24
  type: ordering
  stem: "Arrange these model types from the MOST interpretable to the MOST opaque."
  options:
    - { id: a, text: "Deep neural network", explanation: "Fourth: millions of weights make it opaque, so it needs post-hoc explanation." }
    - { id: b, text: "Linear regression", explanation: "First: each coefficient can be read directly." }
    - { id: c, text: "Large language model", explanation: "Last: billions of parameters make it the most opaque; transparency relies on citations, traces, evaluations and documentation." }
    - { id: d, text: "Ensemble of gradient-boosted trees such as XGBoost", explanation: "Third: many combined trees are too complex to read but can be explained with SHAP and partial dependence." }
    - { id: e, text: "Small decision tree", explanation: "Second: its rules can be followed, though deep trees become harder to read." }
  answer: [b, e, d, a, c]
  explanation: "As models become more flexible they generally become harder to explain: linear models and small trees can be read directly, tree ensembles and deep networks need post-hoc techniques, and foundation models are the most opaque."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#diagram
  difficulty: medium

