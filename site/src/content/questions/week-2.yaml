- id: q-week-2-031
  set: week-2
  type: single
  stem: "A research lab needs to train a new large model for several weeks across hundreds of accelerators on a resilient, managed cluster. Which AWS option is designed for this?"
  options:
    - { id: a, text: "Amazon Bedrock on-demand inference", explanation: "Incorrect. On-demand inference calls existing models; it does not train new large models." }
