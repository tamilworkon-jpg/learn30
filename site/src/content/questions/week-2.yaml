- id: q-week-2-001
  set: week-2
  type: single
  stem: "A developer counts the tokens in the same 300-word paragraph for two different foundation models in Amazon Bedrock. One model reports 410 tokens and the other reports 450. What is the MOST likely explanation?"
  options:
    - { id: a, text: "One of the models counts only output tokens", explanation: "Incorrect. Both counts are for the same input paragraph; the difference is in how the text is split." }
    - { id: b, text: "Each model family uses its own tokenizer and vocabulary", explanation: "Correct. Tokenizers differ between model families, so the same text can produce a different number of tokens." }
    - { id: c, text: "Tokens are always whole words, so one model must be miscounting", explanation: "Incorrect. Tokens are word pieces; common words may be one token, while rarer words are split into several." }
    - { id: d, text: "The larger number includes the embedding dimensions", explanation: "Incorrect. Embedding dimensions describe the length of a vector, not the number of tokens in a text." }
  answer: [b]
  explanation: "A tokenizer splits text into tokens and maps each to an ID in the model's fixed vocabulary. Every model family has its own tokenizer, so token counts, and therefore cost and context-window usage, can differ for the same text. A rule of thumb for English is about four characters, or three-quarters of a word, per token."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: easy

- id: q-week-2-002
  set: week-2
  type: single
  stem: "A company is building a knowledge base over long, structured equipment manuals. It wants small passages for precise matching against questions, but wants the model to receive the larger surrounding section so that answers keep their context. Which chunking strategy fits BEST?"
  options:
    - { id: a, text: "No chunking, treating each manual as one chunk", explanation: "Incorrect. A whole manual as one chunk blurs its meaning and wastes context-window tokens; it suits only short documents such as single FAQs." }
    - { id: b, text: "Fixed-size chunking with no overlap", explanation: "Incorrect. Uniform chunks without overlap can split ideas at boundaries and do not link small matches to larger context." }
    - { id: c, text: "Hierarchical chunking", explanation: "Correct. Hierarchical chunking matches on small child chunks and returns the larger linked parent chunk for context." }
    - { id: d, text: "Increasing the embedding dimensions", explanation: "Incorrect. Embedding dimensions affect how meaning is represented, not how documents are split into passages." }
  answer: [c]
  explanation: "Chunk size is a balancing act: too large blurs meaning, too small loses context. Hierarchical chunking solves both for long, structured documents by matching on precise child chunks and returning their parent chunk. Amazon Bedrock Knowledge Bases supports default, fixed-size, hierarchical, semantic and no-chunking options, plus custom chunking with Lambda."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: medium

- id: q-week-2-003
  set: week-2
  type: single
  stem: "Amazon Titan Text Embeddings V2 can be configured to output 256, 512 or 1,024 values for each input. What does this number represent?"
  options:
    - { id: a, text: "The maximum number of tokens in the input text", explanation: "Incorrect. Input length limits are a separate setting; these values describe the output vector." }
    - { id: b, text: "The number of chunks created from each document", explanation: "Incorrect. Chunking happens before embedding and is configured separately." }
    - { id: c, text: "The number of similar documents returned by a search", explanation: "Incorrect. The number of results returned is the k in k-nearest-neighbour search, not a property of the embedding model." }
    - { id: d, text: "The number of dimensions in the embedding vector", explanation: "Correct. An embedding is a vector of numbers, and the count of values is its number of dimensions." }
  answer: [d]
  explanation: "An embedding model turns text, images or audio into a vector, a list of numbers that represents meaning. The number of values is the vector's dimensions. Content with similar meaning gets vectors that are close together, which enables semantic search."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: easy

- id: q-week-2-004
  set: week-2
  type: single
  stem: "A furniture retailer wants shoppers to upload a photo of a chair they like and see visually similar products from a catalogue that contains both product photos and text descriptions. Which component is MOST important for this search?"
  options:
    - { id: a, text: "A multimodal embedding model that places images and text in the same vector space", explanation: "Correct. Multimodal embeddings put images and text on the same 'map', so an uploaded photo can retrieve matching products by similarity." }
    - { id: b, text: "A text-only LLM that generates product descriptions", explanation: "Incorrect. Generating descriptions does not let the system compare an uploaded photo with catalogue items." }
    - { id: c, text: "A diffusion model that generates new chair images", explanation: "Incorrect. Diffusion models create new images; the requirement is to find existing products." }
    - { id: d, text: "Keyword search over product titles", explanation: "Incorrect. A photo has no keywords to match, so keyword search cannot use it as the query." }
  answer: [a]
  explanation: "Multimodal embedding models, such as Amazon Nova multimodal embeddings, place text and images in one vector space. Stored in a vector database, they let a photo or a text query retrieve similar items by vector similarity, even when no words overlap."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: medium

- id: q-week-2-005
  set: week-2
  type: single
  stem: "An agent connects to an MCP server for a document-management system. The server offers 'create_folder' and 'share_document', and it also offers the contents of policy files that the application can read into the model's context. How does MCP classify these two kinds of capability?"
  options:
    - { id: a, text: "Both are prompts", explanation: "Incorrect. MCP prompts are reusable templates, not actions or data." }
    - { id: b, text: "The actions are tools, and the readable files are resources", explanation: "Correct. MCP tools are actions the model can invoke; resources are data the application can read into context." }
    - { id: c, text: "The actions are resources, and the files are tools", explanation: "Incorrect. This reverses the two roles." }
    - { id: d, text: "Both are MCP clients", explanation: "Incorrect. A client is the component inside the host that connects to a server; it is not a capability the server offers." }
  answer: [b]
  explanation: "In the Model Context Protocol, a host (the AI application) runs one MCP client per server. Servers expose tools (actions the model can call), resources (data such as files or records to read into context) and prompts (reusable templates). The client discovers these at start-up."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-10#explanation
  difficulty: medium

- id: q-week-2-006
  set: week-2
  type: single
  stem: "During training, what does a diffusion model learn to do?"
  options:
    - { id: a, text: "Predict the next token in a sequence of text", explanation: "Incorrect. Next-token prediction is how transformer LLMs are pre-trained." }
    - { id: b, text: "Compete against a discriminator that judges whether images are real", explanation: "Incorrect. A generator competing with a discriminator describes a GAN, an older generative family." }
    - { id: c, text: "Predict and remove noise that was added to real images in many small steps", explanation: "Correct. In training, noise is added step by step to real images and the model learns to predict and remove it." }
    - { id: d, text: "Group similar images into clusters", explanation: "Incorrect. Clustering is unsupervised grouping, not image generation." }
  answer: [c]
  explanation: "A diffusion model is trained by gradually adding noise to real images and learning to undo each step. To generate, it starts from random noise and removes noise step by step, steered by an embedding of the text prompt. Remember: text generation means transformer LLMs; image generation from noise means diffusion models."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: hard

- id: q-week-2-007
  set: week-2
  type: single
  stem: "Which stage of the foundation model lifecycle gives a model its broad general knowledge and language ability by training on an enormous unlabelled dataset with self-supervised next-token prediction?"
  options:
    - { id: a, text: "Fine-tuning", explanation: "Incorrect. Fine-tuning adapts an already pre-trained model with a smaller, often labelled, dataset." }
    - { id: b, text: "Evaluation", explanation: "Incorrect. Evaluation measures quality, safety and bias before release; it does not teach the model." }
    - { id: c, text: "Feedback", explanation: "Incorrect. Feedback collects real-world signals that feed the next iteration." }
    - { id: d, text: "Pre-training", explanation: "Correct. Pre-training on huge unlabelled data, typically by predicting the next token, gives an FM its general knowledge." }
  answer: [d]
  explanation: "The FM lifecycle stages are data selection, model selection, pre-training, fine-tuning, evaluation, deployment and feedback. Pre-training needs thousands of GPUs for weeks or months and costs millions of dollars, so only a few providers do it; most companies start at model selection."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-09#explanation
  difficulty: easy

- id: q-week-2-008
  set: week-2
  type: single
  stem: "A document assistant handles 300,000 requests per month. Each request uses about 2,000 input tokens and 500 output tokens. The model costs $0.30 per million input tokens and $1.50 per million output tokens. What is the approximate monthly model cost?"
  options:
    - { id: a, text: "$180", explanation: "Incorrect. $180 is only the input cost: 600 million input tokens × $0.30 per million." }
    - { id: b, text: "$225", explanation: "Incorrect. $225 is only the output cost: 150 million output tokens × $1.50 per million." }
    - { id: c, text: "$1,125", explanation: "Incorrect. This prices all 750 million tokens at the output rate; input and output are priced separately." }
    - { id: d, text: "$405", explanation: "Correct. Input: 300,000 × 2,000 = 600 million × $0.30 = $180. Output: 300,000 × 500 = 150 million × $1.50 = $225. Total $405." }
  answer: [d]
  explanation: "Monthly cost ≈ requests × (input tokens × input price + output tokens × output price). Input and output tokens are billed separately, and output tokens usually cost several times more per token."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-09#examples
  difficulty: hard

- id: q-week-2-009
  set: week-2
  type: single
  stem: "A finance analyst asks why output tokens on Amazon Bedrock are usually priced several times higher than input tokens. Which explanation is MOST accurate?"
  options:
    - { id: a, text: "Output tokens are stored permanently by AWS for model training", explanation: "Incorrect. Bedrock does not use prompts and outputs to train base models." }
    - { id: b, text: "Each output token needs another sequential pass through the model, while input tokens can be processed in parallel", explanation: "Correct. Generation happens one token at a time, so output consumes far more compute per token than reading the prompt." }
    - { id: c, text: "Output tokens are longer than input tokens", explanation: "Incorrect. Tokens are produced by the same tokenizer; their size does not depend on direction." }
    - { id: d, text: "Input tokens are free when the context window is not full", explanation: "Incorrect. Input tokens are always billed on on-demand pricing, whether or not the context window is full." }
  answer: [b]
  explanation: "When the model reads your prompt, all input tokens can be processed together. Every output token requires a further pass through the whole model, one after another. That is why output costs more, why long answers are slower, and why limiting maximum output tokens is an effective cost lever."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-09#explanation
  difficulty: medium

- id: q-week-2-010
  set: week-2
  type: single
  stem: "A team assembles each request from system instructions, tool definitions, a few retrieved chunks and the user's question. It wants prompt caching to work well and the model to focus on the right material. How should it order the context?"
  options:
    - { id: a, text: "Put the user's question first and the system instructions last", explanation: "Incorrect. Putting variable content first changes the prefix on every request, so caching cannot reuse it." }
    - { id: b, text: "Randomise the order on each request so the model does not over-rely on position", explanation: "Incorrect. A changing order prevents prefix caching and makes behaviour less predictable." }
    - { id: c, text: "Put stable content such as system instructions and tool definitions first, followed by the variable material and the question", explanation: "Correct. A stable prefix can be cached, and clearly ordered, structured sections help the model separate instructions from data." }
    - { id: d, text: "Repeat the system instructions in every section to be safe", explanation: "Incorrect. Repetition adds tokens and cost without adding information." }
  answer: [c]
  explanation: "Context engineering covers what goes into the context window, in what form and order. Place stable content (instructions, tool definitions) first so prompt caching can reuse the prefix, use clear sections or tags, and put the question and the most important material where the model will attend to it."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-09#explanation
  difficulty: hard

- id: q-week-2-011
  set: week-2
  type: multi
  stem: "A company already stores embeddings of its support tickets and help articles in a vector database. Which additional use cases can these embeddings support directly? (Select TWO.)"
  options:
    - { id: a, text: "Detecting duplicate tickets that describe the same problem in different words", explanation: "Correct. Tickets with similar meaning have nearby vectors, so duplicates can be found by similarity." }
    - { id: b, text: "Generating banner images from a text prompt", explanation: "Incorrect. Image generation needs a diffusion model, not stored text embeddings." }
    - { id: c, text: "Recommending articles similar to the one a customer just read", explanation: "Correct. Items whose vectors are close to what a user viewed make natural recommendations." }
    - { id: d, text: "Calculating exact refund amounts from a pricing formula", explanation: "Incorrect. Exact calculations belong in ordinary code; embeddings represent meaning, not formulas." }
    - { id: e, text: "Converting customer phone calls into text", explanation: "Incorrect. Speech-to-text is done by a service such as Amazon Transcribe." }
  answer: [a, c]
  explanation: "Embeddings power much more than RAG: semantic search by meaning, recommendations of nearby items, clustering of similar tickets, duplicate detection and classification. They do not generate images, transcribe audio or perform exact calculations."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: easy

- id: q-week-2-012
  set: week-2
  type: multi
  stem: "A team is estimating the input-token cost of each call from its assistant to a model on Amazon Bedrock. Which items are billed as input tokens? (Select THREE.)"
  options:
    - { id: a, text: "The system prompt with rules and tone", explanation: "Correct. Everything sent to the model, including the system prompt, counts as input." }
    - { id: b, text: "The retrieved document chunks inserted for RAG", explanation: "Correct. Retrieved passages are part of the prompt, so they are input tokens." }
    - { id: c, text: "The model's generated answer", explanation: "Incorrect. The generated answer is billed as output tokens, usually at a higher price." }
    - { id: d, text: "The definitions of the tools the model may call", explanation: "Correct. Tool definitions are sent with the request and count as input." }
    - { id: e, text: "The model's internal parameters", explanation: "Incorrect. Parameters are the model's learned weights, not tokens you send or pay for per request." }
    - { id: f, text: "The number of model units purchased", explanation: "Incorrect. Model units measure provisioned throughput capacity; they are not tokens in a request." }
  answer: [a, b, d]
  explanation: "Input tokens are everything you send: system prompt, instructions, examples, retrieved documents, conversation history, tool definitions and the user's question. Output tokens are what the model generates. Hidden input consumers such as long histories and verbose tool outputs often drive surprise bills."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-09#explanation
  difficulty: hard

- id: q-week-2-013
  set: week-2
  type: multi
  stem: "Which statements about the Model Context Protocol (MCP) are correct? (Select TWO.)"
  options:
    - { id: a, text: "A tool integration built once as an MCP server can be used by any MCP-compatible host", explanation: "Correct. MCP standardises integrations so one server serves many applications, avoiding M × N custom connectors." }
    - { id: b, text: "MCP replaces tool use, so the model no longer emits tool-use requests", explanation: "Incorrect. MCP standardises how tools are described and reached; the model still requests tool calls that the host executes." }
    - { id: c, text: "MCP is the protocol that connects one agent to other agents", explanation: "Incorrect. Agent-to-agent (A2A) protocols connect agents to agents; MCP connects agents to tools and data." }
    - { id: d, text: "At start-up, the MCP client asks each server what it offers, so tools are discovered dynamically", explanation: "Correct. Dynamic discovery means tools do not have to be hard-coded into the agent." }
    - { id: e, text: "MCP servers can run only on the user's local machine", explanation: "Incorrect. Servers can run locally over standard input/output or remotely over HTTP." }
  answer: [a, d]
  explanation: "MCP is an open standard, introduced by Anthropic in 2024 and adopted by AWS, that works like USB-C for AI tools. Hosts run MCP clients that connect to servers exposing tools, resources and prompts. Treat MCP servers like any integration: authenticate them and give them least privilege."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-10#explanation
  difficulty: medium

- id: q-week-2-014
  set: week-2
  type: ordering
  stem: "A help-centre assistant answers a user's question from documents already chunked and embedded in a vector store. Place the query-time steps in the correct order, from first to last."
  options:
    - { id: a, text: "Add the retrieved chunks and the question to the prompt", explanation: "Fourth: the relevant passages and the question are assembled into the model's context." }
    - { id: b, text: "Convert the user's question into a vector with the same embedding model used for the documents", explanation: "First: the question must be embedded on the same 'map' as the stored chunks." }
    - { id: c, text: "The LLM generates an answer grounded in the retrieved text", explanation: "Last: the model writes the answer using the supplied passages." }
    - { id: d, text: "Run a k-nearest-neighbour similarity search in the vector store", explanation: "Second: the store finds the vectors closest to the question vector, for example by cosine similarity." }
    - { id: e, text: "Return the top few matching chunks", explanation: "Third: only the most relevant passages are kept, which saves tokens and reduces noise." }
  answer: [b, d, e, a, c]
  explanation: "At query time the question is embedded with the same model as the documents, a similarity search finds the nearest vectors, the top chunks are retrieved and inserted into the prompt, and the LLM generates a grounded answer. Mixing embedding models breaks similarity search because the vectors are not comparable."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: medium

- id: q-week-2-015
  set: week-2
  type: matching
  stem: "Match each situation to the context engineering technique it illustrates."
  options:
    - { id: a, text: "Retrieve only the three most relevant chunks and pass only the tools the current step needs", explanation: "Select: include only what is relevant to this request." }
    - { id: b, text: "Summarise conversation turns older than the last five and trim tool outputs to the needed fields", explanation: "Compress: shrink what you keep." }
    - { id: c, text: "Save findings to an external memory store and bring them back only when they are needed", explanation: "Write and persist: keep information outside the context window until it is relevant." }
    - { id: d, text: "Split a research task so that separate sub-agents each work with their own focused context", explanation: "Isolate: separate calls or agents keep focused contexts, and the results are combined." }
  matchTargets:
    - { id: t1, text: "Select" }
    - { id: t2, text: "Compress" }
    - { id: t3, text: "Write and persist" }
    - { id: t4, text: "Isolate" }
  answer: { a: t1, b: t2, c: t3, d: t4 }
  explanation: "Context engineering finds the smallest set of high-value information for each call. The four technique families are select, compress, write and persist, and isolate. On AWS they map to Bedrock Knowledge Bases (select), AgentCore Memory (persist), prompt caching (stable prefix) and Prompt Management (versioned templates)."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-09#explanation
  difficulty: medium

- id: q-week-2-016
  set: week-2
  type: single
  stem: "A marketing team uses an LLM to brainstorm slogans and wants clearly different, creative ideas each time it runs the same prompt. Which setting supports this goal?"
  options:
    - { id: a, text: "A higher temperature", explanation: "Correct. Higher temperature makes sampling more random, which produces more varied and creative outputs." }
    - { id: b, text: "A smaller context window", explanation: "Incorrect. The context window limits how many tokens fit in a request; it does not control creativity." }
    - { id: c, text: "A lower temperature", explanation: "Incorrect. Lower temperature makes output more focused and repeatable, which is the opposite of the goal." }
    - { id: d, text: "A maximum output tokens limit of one token", explanation: "Incorrect. A one-token limit would cut the response off rather than make it creative." }
  answer: [a]
  explanation: "Generation samples from a probability distribution over next tokens. Temperature controls randomness: higher values give more varied, creative output; lower values give more focused, repeatable output. Nondeterminism is useful for brainstorming but a problem when consistent answers are required."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: easy

- id: q-week-2-017
  set: week-2
  type: single
  stem: "An insurer asks its LLM-based assistant why it recommended rejecting a claim. The assistant gives a clear, convincing rationale. Why should auditors NOT treat this rationale as the true reason for the recommendation?"
  options:
    - { id: a, text: "The rationale is newly generated plausible text, not a trace of how the model actually reached its output", explanation: "Correct. Large models are black boxes; asking them to explain themselves produces a plausible explanation, not necessarily the real reason." }
    - { id: b, text: "LLMs are unable to produce text longer than one sentence", explanation: "Incorrect. LLMs routinely produce long text." }
    - { id: c, text: "The explanation is always copied from the training data", explanation: "Incorrect. The model generates new text; the issue is that it may not reflect the real reasoning." }
    - { id: d, text: "Rationales are only accurate at a temperature of exactly 1.0", explanation: "Incorrect. No temperature setting turns a generated explanation into a faithful account of the model's computation." }
  answer: [a]
  explanation: "Interpretability is a key limitation of generative AI. Models with billions of parameters cannot point to the rule that produced an answer, and self-explanations are just more generated text. For decisions that must be explained, prefer transparent models or rules, log prompts and sources, and keep humans in the loop."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: medium

- id: q-week-2-018
  set: week-2
  type: single
  stem: "A document-research assistant is expected to save $900,000 a year. Building and running it will cost $300,000 a year. What is the return on investment (ROI)?"
  options:
    - { id: a, text: "33%", explanation: "Incorrect. This divides cost by benefit; ROI divides net benefit by cost." }
    - { id: b, text: "67%", explanation: "Incorrect. This divides the net benefit by the total benefit instead of by the cost." }
    - { id: c, text: "300%", explanation: "Incorrect. This divides the benefit by the cost without first subtracting the cost." }
    - { id: d, text: "200%", explanation: "Correct. ROI = (benefit − cost) ÷ cost = (900,000 − 300,000) ÷ 300,000 = 200%." }
  answer: [d]
  explanation: "ROI = (benefit − cost) ÷ cost. Count the full cost, including model usage, supporting services, people, evaluation and governance, and present hard savings ahead of soft benefits when building the business case."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: medium

- id: q-week-2-019
  set: week-2
  type: single
  stem: "A bank launches a GenAI concierge to help customers stay with the bank for more years and buy more products over the whole relationship. Which business metric BEST captures this goal?"
  options:
    - { id: a, text: "Customer lifetime value (CLV)", explanation: "Correct. CLV is the total revenue a customer brings over the whole relationship, which better service and retention increase." }
    - { id: b, text: "Conversion rate", explanation: "Incorrect. Conversion rate measures the share of visitors or leads who take one desired action, not long-term value." }
    - { id: c, text: "Time to first token", explanation: "Incorrect. Time to first token is a model latency metric, not a business value metric." }
    - { id: d, text: "ROUGE score", explanation: "Incorrect. ROUGE is a model quality metric for summaries, not a business metric." }
  answer: [a]
  explanation: "Business metrics show whether a GenAI project is worth the money: ROI, conversion rate, ARPU, customer lifetime value, efficiency, cost per interaction, CSAT and deflection rate. CLV is a lagging indicator, so teams also track faster-moving leading indicators."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: easy

- id: q-week-2-020
  set: week-2
  type: single
  stem: "A team is writing the business case for an AI claims assistant. A finance reviewer asks which of the expected benefits counts as a hard saving. Which benefit should the team point to?"
  options:
    - { id: a, text: "Customers feel more positive about the brand", explanation: "Incorrect. Improved brand perception is a soft benefit that is hard to quantify in money." }
    - { id: b, text: "Faster time to market for new products", explanation: "Incorrect. Speed to market is valuable but is treated as a soft benefit." }
    - { id: c, text: "Fewer contractor hours and a lower cost per processed claim", explanation: "Correct. Directly measurable reductions in spend, such as contractor hours and cost per claim, are hard savings." }
    - { id: d, text: "Employees enjoy their work more", explanation: "Incorrect. Employee satisfaction is a soft benefit." }
  answer: [c]
  explanation: "Separate hard savings (fewer contractor hours, lower cost per ticket or claim) from soft benefits (happier customers, faster time to market). Finance teams trust hard savings more, so lead with them and present soft benefits as upside."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: medium

- id: q-week-2-021
  set: week-2
  type: single
  stem: "A company is shortlisting foundation models for a contract-review assistant. It already knows it will need to fine-tune the chosen model on its own documents next year. Which model selection factor must it check now?"
  options:
    - { id: a, text: "Whether the model has the largest parameter count available", explanation: "Incorrect. Size is not a requirement here, and larger models cost more and respond more slowly." }
    - { id: b, text: "Whether the model supports the customisation method the company plans to use", explanation: "Correct. Customisation options are a selection factor: not every model can be fine-tuned or distilled in every service." }
    - { id: c, text: "Whether the model can generate images", explanation: "Incorrect. Image generation is irrelevant for text contract review." }
    - { id: d, text: "Whether the model has the newest knowledge cut-off", explanation: "Incorrect. A recent cut-off can help, but it does not ensure the model can be fine-tuned." }
  answer: [b]
  explanation: "Model selection factors include modality, capability on your task, latency and throughput, cost, context window, language support, customisation options, compliance constraints, licensing and size. The best choice is usually the smallest model that meets quality, latency and compliance needs and supports the planned customisation."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: hard

- id: q-week-2-022
  set: week-2
  type: single
  stem: "For which use case is generative AI LEAST appropriate?"
  options:
    - { id: a, text: "Drafting first versions of product descriptions for a marketing team to edit", explanation: "Incorrect. Content generation with human review is a strong GenAI use case." }
    - { id: b, text: "Summarising long meeting transcripts for attendees, who can check the transcript", explanation: "Incorrect. Summarising unstructured text with users able to verify is a good fit." }
    - { id: c, text: "Translating FAQ pages into several languages before review", explanation: "Incorrect. Translation with review is a common, appropriate GenAI task." }
    - { id: d, text: "Automatically setting medication doses for hospital patients with no clinician review", explanation: "Correct. Zero tolerance for error with no human check is a case where GenAI should not decide on its own." }
  answer: [d]
  explanation: "Use GenAI where variety, language and creativity are valuable and a 'pretty good, checkable' answer is acceptable. Avoid it for exact calculations, decisions that must be fully explainable, zero-tolerance safety-critical tasks without human review, and simple tabular predictions that traditional ML does better."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: easy

- id: q-week-2-023
  set: week-2
  type: multi
  stem: "A compliance team generates regulatory notices with an LLM and needs the wording to be as consistent and repeatable as possible across runs. Which measures help? (Select TWO.)"
  options:
    - { id: a, text: "Lower the temperature", explanation: "Correct. Lower temperature makes sampling more focused and repeatable." }
    - { id: b, text: "Raise the temperature to explore more options", explanation: "Incorrect. Higher temperature increases randomness and variation." }
    - { id: c, text: "Use a prompt template with a fixed, structured output format", explanation: "Correct. Templates and structured formats constrain output and make it easier to validate automatically." }
    - { id: d, text: "Choose the model with the largest context window", explanation: "Incorrect. Context window size does not control variation between runs." }
    - { id: e, text: "Remove all instructions so the model writes freely", explanation: "Incorrect. Fewer constraints lead to more variation, not less." }
  answer: [a, c]
  explanation: "Nondeterminism comes from sampling. Mitigations are a lower temperature, prompt templates, structured output formats and automatic validation of outputs. Other limitations need different mitigations: RAG for hallucinations, Guardrails for unsafe content and transparent models for interpretability."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: medium

- id: q-week-2-024
  set: week-2
  type: multi
  stem: "A retailer launched a GenAI assistant last month. Customer lifetime value will take a year to show any change. Which leading indicators can the team track weekly to steer the project? (Select TWO.)"
  options:
    - { id: a, text: "Customer lifetime value", explanation: "Incorrect. CLV is a lagging indicator that takes months to move." }
    - { id: b, text: "Answer acceptance rate", explanation: "Correct. The share of answers accepted without edits moves quickly and predicts longer-term value." }
    - { id: c, text: "Share of conversations resolved without escalation to a human", explanation: "Correct. Resolution without escalation is a fast-moving signal of whether the assistant is helping." }
    - { id: d, text: "Five-year return on investment", explanation: "Incorrect. Long-horizon ROI is a lagging measure." }
    - { id: e, text: "Annual revenue", explanation: "Incorrect. Annual revenue moves slowly and is affected by many other factors." }
  answer: [b, c]
  explanation: "Lagging indicators such as CLV and annual revenue take months to change. Leading indicators move quickly and predict them: answer acceptance rate, resolution without escalation, thumbs-up ratings, time to first response and repeat-contact rate. Agree on baselines before launch."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: medium

- id: q-week-2-025
  set: week-2
  type: matching
  stem: "Match each generative AI limitation to the mitigation that addresses it MOST directly."
  options:
    - { id: a, text: "Hallucinated answers about company policies", explanation: "Ground answers in trusted documents with RAG, for example Amazon Bedrock Knowledge Bases." }
    - { id: b, text: "Noticeably different wording on every run", explanation: "Lower the temperature and use structured templates to reduce nondeterminism." }
    - { id: c, text: "Toxic or unsafe responses", explanation: "Apply Amazon Bedrock Guardrails content filters and denied topics." }
    - { id: d, text: "Regulators require the true reason behind each decision", explanation: "Use a transparent model or rules for the decision, and log inputs and outputs for audit." }
  matchTargets:
    - { id: t1, text: "Retrieval-augmented generation (RAG)" }
    - { id: t2, text: "Lower temperature and output templates" }
    - { id: t3, text: "Amazon Bedrock Guardrails content filters" }
    - { id: t4, text: "Transparent model with audit logging" }
  answer: { a: t1, b: t2, c: t3, d: t4 }
  explanation: "Each limitation has a matching mitigation: grounding with RAG for hallucinations and outdated knowledge, lower temperature and templates for nondeterminism, Guardrails for toxicity and sensitive data, and transparent models plus logging for interpretability. Human review adds a safety net for high-stakes outputs."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: medium

