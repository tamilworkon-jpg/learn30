  taskStatement: "2.3"
  lessonRef: day-12#explanation
  difficulty: medium

- id: q-week-2-039
  set: week-2
  type: single
  stem: "Two foundation models offer similar quality and similar per-token prices. Every request from the company's application starts with the same 5,000-token block of instructions and examples. Which selection criterion could make one model much cheaper to run for this workload?"
  options:
    - { id: a, text: "Whether the model supports image generation", explanation: "Incorrect. The workload is text; image generation is irrelevant." }
    - { id: b, text: "Whether the model has the largest parameter count", explanation: "Incorrect. A larger model usually costs more per token, not less." }
    - { id: c, text: "Whether the model supports prompt caching", explanation: "Correct. With caching, the repeated 5,000-token prefix is read from the cache at a large discount on later requests." }
    - { id: d, text: "Whether the model was released most recently", explanation: "Incorrect. Release date does not change the cost of repeated prefixes." }
  answer: [c]
  explanation: "Task statement 3.1 includes prompt caching as an FM selection criterion. For workloads with a long, stable prefix, caching can cut the cost of cached input tokens by up to about 90% and reduce latency, so caching support can change a model's effective price considerably."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-13#explanation
  difficulty: medium

- id: q-week-2-040
  set: week-2
  type: single
  stem: "A procurement assistant must check current stock levels at six warehouses, each through a different system, and then combine the results into one recommendation. The checks are independent of each other. Which multi-agent pattern fits BEST?"
  options:
    - { id: a, text: "Sequential pipeline", explanation: "Incorrect. A sequential pipeline runs agents one after another, which wastes time when the checks are independent." }
    - { id: b, text: "Parallel fan-out and fan-in", explanation: "Correct. Independent sub-tasks run at the same time and a final step merges the results." }
    - { id: c, text: "A single model call with no tools", explanation: "Incorrect. Without tools the model cannot query the warehouse systems." }
    - { id: d, text: "Peer handoff (swarm)", explanation: "Incorrect. Peer handoff passes control from one agent to the next best-placed peer; it is not designed to run independent checks simultaneously." }
  answer: [b]
  explanation: "Multi-agent patterns include supervisor (orchestrator–workers), sequential pipeline, parallel fan-out and fan-in, peer handoff (swarm) and graph. Independent sub-tasks that can run simultaneously, followed by a merge step, are the classic fan-out and fan-in case."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-10#explanation
  difficulty: hard

- id: q-week-2-041
  set: week-2
  type: single
  stem: "A logistics company uses a large foundation model to classify 30 million shipping emails a month into eight categories. It wants to keep accuracy close to the large model while cutting per-request cost and latency, and it is willing to pay for a one-time job. Which approach fits BEST?"
  options:
    - { id: a, text: "Continued pre-training of the large model on all company emails", explanation: "Incorrect. Continued pre-training is expensive and still leaves the company serving a large model." }
    - { id: b, text: "Pre-training a new model from scratch", explanation: "Incorrect. Pre-training from scratch is by far the most expensive option and unnecessary for a narrow task." }
    - { id: c, text: "Adding longer instructions to every prompt", explanation: "Incorrect. Longer prompts add input tokens on every request, increasing cost." }
    - { id: d, text: "Model distillation into a smaller student model", explanation: "Correct. A large teacher model's answers train a smaller student that serves the task faster and at a fraction of the per-token price." }
  answer: [d]
  explanation: "Customisation usually climbs a cost ladder: prompt engineering, RAG, fine-tuning, continued pre-training, pre-training from scratch. Distillation is the exception that saves money at inference time: you pay once for the distillation job and save on every request afterwards."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-13#explanation
  difficulty: hard

- id: q-week-2-042
  set: week-2
  type: multi
  stem: "A customer-service agent can issue refunds and send emails to customers. Which orchestration controls should the team add to the agent loop? (Select TWO.)"
  options:
    - { id: a, text: "A maximum number of loop iterations and a token budget per task", explanation: "Correct. Iteration limits and budgets stop runaway loops and uncontrolled cost." }
    - { id: b, text: "Give the agent every tool in the company so that it never lacks a capability", explanation: "Incorrect. Extra tools increase risk and confusion; agents should have least privilege." }
    - { id: c, text: "A human approval checkpoint before refunds and outgoing customer emails", explanation: "Correct. Human-in-the-loop checkpoints before high-impact actions reduce the risk of harmful actions." }
    - { id: d, text: "Remove timeouts so long tasks can always finish", explanation: "Incorrect. Timeouts are a recommended guard rail for stuck or slow tool calls." }
    - { id: e, text: "Let the model execute API calls directly without the application in between", explanation: "Incorrect. In tool use, the application executes tools, which is where controls and logging are applied." }
  answer: [a, c]
  explanation: "Good orchestration puts guard rails on the agent loop: maximum iterations, timeouts, error handling when tools fail, token budgets and human-in-the-loop checkpoints before payments, deletions or messages to customers. Least-privilege tool access limits the damage from manipulated prompts."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-10#explanation
  difficulty: medium

- id: q-week-2-043
  set: week-2
  type: single
  stem: "A start-up serves a deep learning image model at very high volume and wants AWS-designed chips that lower the cost of inference. Which option fits BEST?"
  options:
    - { id: a, text: "AWS Trainium", explanation: "Incorrect. Trainium is designed for training models rather than low-cost inference." }
    - { id: b, text: "Amazon S3", explanation: "Incorrect. S3 is object storage, not compute." }
    - { id: c, text: "AWS Inferentia", explanation: "Correct. Inferentia is the AWS-designed chip for low-cost, high-performance inference." }
    - { id: d, text: "AWS Glue", explanation: "Incorrect. Glue is a serverless data integration service." }
  answer: [c]
  explanation: "Deep learning training and inference run on GPU instances or AWS-designed chips: AWS Trainium for training and AWS Inferentia for low-cost inference, usually managed through Amazon SageMaker AI."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-04#explanation
  difficulty: easy

- id: q-week-2-044
  set: week-2
  type: single
  stem: "A marketing analyst has 50 numeric attributes for each customer and wants to plot all customers on a two-dimensional chart while keeping as much of the information as possible. Which technique fits BEST?"
  options:
    - { id: a, text: "Logistic regression", explanation: "Incorrect. Logistic regression is a supervised classification algorithm." }
    - { id: b, text: "Principal component analysis (PCA)", explanation: "Correct. PCA is dimensionality reduction: it compresses many features into a few while keeping most of the information, which enables 2D or 3D visualisation." }
    - { id: c, text: "Random Cut Forest", explanation: "Incorrect. Random Cut Forest detects anomalies." }
    - { id: d, text: "Reinforcement learning", explanation: "Incorrect. Reinforcement learning trains an agent through rewards." }
  answer: [b]
  explanation: "Dimensionality reduction compresses many features into fewer. PCA, the best-known method, speeds up training, removes noise and redundancy, and lets you visualise high-dimensional data in two or three dimensions."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: medium

- id: q-week-2-045
  set: week-2
  type: single
  stem: "A plant-identification model overfits its 8,000 training photos. The team creates flipped, rotated and slightly recoloured copies of each training image. What is this technique, and why does it help?"
  options:
    - { id: a, text: "Data augmentation, which helps the model learn what matters instead of incidental details", explanation: "Correct. Realistic variations of training examples reduce overfitting by teaching the model to ignore orientation and lighting quirks." }
    - { id: b, text: "Feature extraction, which freezes the network's layers", explanation: "Incorrect. Feature extraction is a transfer learning approach, not a way of creating new training examples." }
    - { id: c, text: "Early stopping, which ends training sooner", explanation: "Incorrect. Early stopping watches the validation score; it does not create new images." }
    - { id: d, text: "Dimensionality reduction, which removes pixels", explanation: "Incorrect. Dimensionality reduction compresses features; it does not create image variations." }
  answer: [a]
  explanation: "Overfitting fixes include more and more varied data, simpler models, regularisation, early stopping, dropout and data augmentation. Augmentation creates realistic variations, such as flipped images or paraphrased sentences, so the model learns the real pattern."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#explanation
  difficulty: easy

- id: q-week-2-046
  set: week-2
  type: single
  stem: "Which description matches the standard recipe used to build modern generative AI models?"
  options:
    - { id: a, text: "Supervised training from scratch on a small labelled dataset for each task", explanation: "Incorrect. That describes traditional task-specific ML, not foundation models." }
    - { id: b, text: "Clustering of unlabelled data followed by rule writing", explanation: "Incorrect. Clustering and rules are not how foundation models are built." }
    - { id: c, text: "Reinforcement learning only, with no pre-training", explanation: "Incorrect. RLHF is often used after pre-training and fine-tuning, not instead of them." }
    - { id: d, text: "Self-supervised pre-training on huge unlabelled data, followed by supervised fine-tuning", explanation: "Correct. Models first learn general patterns by predicting hidden or next tokens, then are fine-tuned with labelled examples." }
  answer: [d]
  explanation: "Self-supervised learning creates its own labels from the data, for example by hiding the next word. Because no human labelling is needed, foundation models can learn from trillions of words. Self-supervised pre-training followed by supervised fine-tuning, often with RLHF, is the standard recipe."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: hard

- id: q-week-2-047
  set: week-2
  type: single
  stem: "During training, a neural network randomly switches off a share of its neurons at each step so that it cannot rely on any single path through the network. Which technique is this, and what problem does it address?"
  options:
    - { id: a, text: "Backpropagation, which addresses slow inference", explanation: "Incorrect. Backpropagation calculates each weight's contribution to the error; it does not switch neurons off." }
    - { id: b, text: "Dropout, which addresses overfitting", explanation: "Correct. Dropout randomly disables neurons during training to reduce overfitting." }
    - { id: c, text: "Pooling, which addresses underfitting", explanation: "Incorrect. Pooling shrinks feature maps in CNNs and is not a remedy for underfitting." }
    - { id: d, text: "Positional encoding, which addresses data drift", explanation: "Incorrect. Positional encoding tells transformers the order of tokens." }
  answer: [b]
  explanation: "Dropout is an overfitting remedy for neural networks. Along with more data, regularisation, early stopping and data augmentation, it helps the model generalise rather than memorise the training data."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#explanation
  difficulty: medium

- id: q-week-2-048
  set: week-2
  type: multi
  stem: "A student is labelling the parts of a neural network diagram. Which items are activation functions? (Select TWO.)"
  options:
    - { id: a, text: "ReLU", explanation: "Correct. ReLU keeps positive values and turns negative values into zero." }
    - { id: b, text: "Gradient descent", explanation: "Incorrect. Gradient descent is the optimisation method that nudges weights to reduce the loss." }
    - { id: c, text: "Epoch", explanation: "Incorrect. An epoch is one full pass through the training set." }
    - { id: d, text: "Sigmoid", explanation: "Correct. Sigmoid squashes any value into the range 0 to 1, useful for probabilities." }
    - { id: e, text: "Pooling", explanation: "Incorrect. Pooling is a CNN layer that shrinks feature maps." }
  answer: [a, d]
  explanation: "Each neuron multiplies inputs by weights, adds a bias and passes the total through an activation function such as ReLU, sigmoid or softmax. Activation functions add non-linearity; without them, stacked layers collapse into one linear model."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-04#explanation
  difficulty: easy

- id: q-week-2-049
  set: week-2
  type: single
  stem: "An electronics brand translates its product manuals into 15 languages with Amazon Translate. Product names and technical terms such as 'FlexDock' must always be translated the same way, or kept unchanged. Which feature should it use?"
  options:
    - { id: a, text: "Amazon Translate custom terminology", explanation: "Correct. Custom terminology keeps brand and technical terms translated consistently." }
    - { id: b, text: "Amazon Polly lexicons", explanation: "Incorrect. Polly lexicons control pronunciation in speech, not translation." }
    - { id: c, text: "Amazon Comprehend key phrase extraction", explanation: "Incorrect. Key phrase extraction finds important phrases but does not control translation." }
    - { id: d, text: "Amazon Textract forms extraction", explanation: "Incorrect. Textract extracts key–value pairs from documents." }
  answer: [a]
  explanation: "Amazon Translate provides neural machine translation in real time or batch. Custom terminology ensures brand names and technical terms are translated consistently, which is important for catalogues, manuals and support content."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: easy

- id: q-week-2-050
  set: week-2
  type: single
  stem: "A developer is designing an Amazon Lex bot for booking car rentals. The bot must collect the pickup city, the pickup date and the car size before it can complete a booking. In Amazon Lex, what are these pieces of information called?"
  options:
    - { id: a, text: "Intents", explanation: "Incorrect. An intent is what the user wants to do, such as BookCar." }
    - { id: b, text: "Utterances", explanation: "Incorrect. Utterances are sample phrases a user might say to express an intent." }
    - { id: c, text: "Slots", explanation: "Correct. Slots are the details the bot must collect to fulfil an intent." }
    - { id: d, text: "Lexicons", explanation: "Incorrect. Lexicons are an Amazon Polly feature for pronunciation." }
  answer: [c]
  explanation: "Amazon Lex bots are built from intents (what the user wants), sample utterances (ways to say it) and slots (details to collect, such as city and dates). Lex handles speech and language understanding and can call an AWS Lambda function to fulfil the request."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: easy

- id: q-week-2-051
  set: week-2
  type: multi
  stem: "A company wants insights from customer emails without training any model. Which tasks can Amazon Comprehend perform out of the box? (Select TWO.)"
  options:
    - { id: a, text: "Detect the dominant language of each email", explanation: "Correct. Comprehend detects the dominant language of text." }
    - { id: b, text: "Extract table rows from scanned PDF invoices", explanation: "Incorrect. Extracting tables from scanned documents is an Amazon Textract feature." }
    - { id: c, text: "Convert voicemail recordings into text", explanation: "Incorrect. Speech-to-text is done by Amazon Transcribe." }
    - { id: d, text: "Detect personal information such as names and phone numbers", explanation: "Correct. Comprehend detects PII in text." }
    - { id: e, text: "Generate new marketing images", explanation: "Incorrect. Image generation needs a generative image model, such as a Stability AI model in Amazon Bedrock." }
  answer: [a, d]
  explanation: "Amazon Comprehend detects sentiment, entities, key phrases, dominant language, PII and syntax, groups documents by topic modelling, and supports custom classification and entity recognition trained on your labels."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: medium

- id: q-week-2-052
  set: week-2
  type: single
  stem: "Before building an AI solution that reads supplier invoices, a project sponsor asks what the team must agree on so it can later prove the project delivered value. What is the BEST answer?"
  options:
    - { id: a, text: "The number of layers the neural network will have", explanation: "Incorrect. Architecture details do not show whether the project moved a business number." }
    - { id: b, text: "The exact training algorithm and its hyperparameters", explanation: "Incorrect. These are technical choices made later; they do not define business value." }
    - { id: c, text: "Which programming language the developers will use", explanation: "Incorrect. Implementation language is unrelated to measuring business value." }
    - { id: d, text: "How value will be measured, such as cost per processed invoice and hours saved, compared with the full cost of the solution", explanation: "Correct. A use case succeeds only if it moves an agreed business metric by more than its total cost." }
  answer: [d]
  explanation: "Before building, agree how value will be measured: hours saved, cost per processed document, response times, conversion, fraud losses or satisfaction. Compare the expected gain with the full cost, including data preparation, labelling, development, hosting, monitoring and human review."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: medium

- id: q-week-2-053
  set: week-2
  type: single
  stem: "A transaction-monitoring model works on imbalanced data: missed fraud is costly, and false alarms also create significant work for analysts. Which single metric BEST balances both concerns?"
  options:
    - { id: a, text: "Accuracy", explanation: "Incorrect. Accuracy is misleading on imbalanced data because predicting the majority class scores highly." }
    - { id: b, text: "F1 score", explanation: "Correct. F1 is the harmonic mean of precision and recall, so it balances false positives and false negatives." }
    - { id: c, text: "Mean absolute error", explanation: "Incorrect. MAE is a regression metric." }
    - { id: d, text: "R²", explanation: "Incorrect. R² describes how much variation a regression model explains." }
  answer: [b]
  explanation: "Prioritise recall when false negatives are costly, precision when false positives are costly, and F1 when the classes are imbalanced and both errors matter. AUC compares classifiers independent of the threshold, and accuracy is meaningful only for balanced classes with equal error costs."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: easy

- id: q-week-2-054
  set: week-2
  type: single
  stem: "Where in the AI lifecycle does Amazon Quick mainly fit?"
  options:
    - { id: a, text: "The use and insight stage, where business users explore dashboards, research and agents over company data", explanation: "Correct. Amazon Quick is an agentic workspace that brings BI dashboards, research, chat agents and automation to business users." }
    - { id: b, text: "The labelling stage, where annotators mark training data", explanation: "Incorrect. Labelling is done with tools such as SageMaker Ground Truth." }
    - { id: c, text: "The build stage, where developers turn specifications into code", explanation: "Incorrect. That is the role of Kiro, the agentic IDE." }
    - { id: d, text: "The large-scale model training stage", explanation: "Incorrect. Large-scale training happens in SageMaker AI." }
  answer: [a]
  explanation: "Kiro serves the build stage for developers, turning requirements into specifications, designs, tasks and code. Amazon Quick serves the use and insight stage, where people consume AI results and make decisions. Bedrock and SageMaker AI cover the models in between."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: easy

- id: q-week-2-055
  set: week-2
  type: single
  stem: "A content-moderation model flags 200 posts. 150 of the flagged posts truly violate the policy, and the model misses another 100 violating posts. What is the model's recall?"
  options:
    - { id: a, text: "75%", explanation: "Incorrect. 150 ÷ 200 = 75% is precision, the share of flagged posts that were correct." }
    - { id: b, text: "67%", explanation: "Incorrect. About 0.67 is the F1 score, the harmonic mean of 75% precision and 60% recall." }
    - { id: c, text: "60%", explanation: "Correct. Recall = TP ÷ (TP + FN) = 150 ÷ (150 + 100) = 60%." }
    - { id: d, text: "40%", explanation: "Incorrect. 40% is the share of violating posts that were missed (100 ÷ 250), not recall." }
  answer: [c]
  explanation: "TP = 150, FP = 50 and FN = 100. Recall asks 'of all real cases, how many did I catch?': 150 ÷ 250 = 60%. Precision asks 'of everything I flagged, how much was right?': 150 ÷ 200 = 75%."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#examples
  difficulty: hard

- id: q-week-2-056
  set: week-2
  type: multi
  stem: "A team configures SageMaker Model Monitor for a production endpoint. Which problems can Model Monitor detect? (Select TWO.)"
  options:
    - { id: a, text: "Data drift between production inputs and the training data", explanation: "Correct. Model Monitor detects when live input data no longer looks like the training data." }
    - { id: b, text: "Missing operating-system patches on the team's laptops", explanation: "Incorrect. Model Monitor watches models and data, not employee devices." }
    - { id: c, text: "Decay in model quality and drift in bias over time", explanation: "Correct. Model Monitor tracks model-quality decay and bias drift in production." }
    - { id: d, text: "Slow progress by the human labelling workforce", explanation: "Incorrect. Labelling workflows are managed in SageMaker Ground Truth." }
    - { id: e, text: "Errors in the team's IAM password policy", explanation: "Incorrect. IAM configuration is not monitored by Model Monitor." }
  answer: [a, c]
  explanation: "Model monitoring is a core MLOps practice. SageMaker Model Monitor detects data drift, model-quality decay and bias drift in production, and alerts can trigger retraining through SageMaker Pipelines."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-week-2-057
  set: week-2
  type: matching
  stem: "Match each scenario to the evaluation metric that should be prioritised."
  options:
    - { id: a, text: "A screening model for a serious disease, where missing a real case is dangerous", explanation: "Recall minimises false negatives." }
    - { id: b, text: "A spam filter, where blocking legitimate emails annoys customers", explanation: "Precision minimises false positives." }
    - { id: c, text: "A delivery-time model, where very large misses are especially harmful", explanation: "RMSE squares errors, so large misses dominate the score." }
    - { id: d, text: "Comparing several classifiers before any decision threshold is chosen", explanation: "AUC measures separation across all thresholds." }
  matchTargets:
    - { id: t1, text: "Recall" }
    - { id: t2, text: "Precision" }
    - { id: t3, text: "RMSE" }
    - { id: t4, text: "AUC" }
  answer: { a: t1, b: t2, c: t3, d: t4 }
  explanation: "Choose the metric from the business cost of errors: recall when misses are costly, precision when false alarms are costly, F1 to balance both on imbalanced data, AUC for threshold-independent comparison, RMSE when big numeric misses are especially bad, and MAE to report typical error in plain units."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium
