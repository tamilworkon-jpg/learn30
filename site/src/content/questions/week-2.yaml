  taskStatement: "2.3"
  lessonRef: day-12#explanation
  difficulty: medium

- id: q-week-2-036
  set: week-2
  type: multi
  stem: "A company calls an Amazon Bedrock model through a geographic cross-Region inference profile. Which statements about this approach are correct? (Select TWO.)"
  options:
    - { id: a, text: "Requests can be routed to several Regions within the chosen geography", explanation: "Correct. An inference profile spreads requests across Regions in a geography such as the US or the EU." }
    - { id: b, text: "It helps absorb traffic bursts and provides higher effective throughput", explanation: "Correct. Routing across Regions smooths bursts and reduces throttling." }
    - { id: c, text: "Geographic profiles may send data to any Region worldwide", explanation: "Incorrect. Geographic profiles keep processing within that geography, which helps with data residency." }
    - { id: d, text: "It guarantees a lower price per token than single-Region on-demand", explanation: "Incorrect. Cross-Region inference is about throughput and resilience, not a guaranteed discount." }
    - { id: e, text: "It requires buying provisioned throughput first", explanation: "Incorrect. Cross-Region inference profiles are used with on-demand calls; no provisioned capacity is required." }
  answer: [a, b]
  explanation: "When choosing Regions, balance model availability, data residency, latency and resilience. Cross-Region inference uses an inference profile to route requests across Regions within a geography, increasing effective throughput while geographic profiles keep data in that geography."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-13#explanation
  difficulty: hard

- id: q-week-2-037
  set: week-2
  type: ordering
  stem: "A product team is preparing a cost estimate for a new GenAI assistant on Amazon Bedrock. Place these steps in the recommended order, from first to last."
  options:
    - { id: a, text: "Compare the on-demand estimate with the cost of reserved or self-hosted capacity, and add operational effort", explanation: "Third: only with an on-demand estimate can the team judge whether reserved capacity would be cheaper." }
    - { id: b, text: "Measure real token counts per request in a pilot", explanation: "First: pilot measurements replace guesses, because retrieved passages and history are often larger than expected." }
    - { id: c, text: "After launch, track cost per interaction and set AWS Budgets alerts", explanation: "Last: ongoing tracking connects the bill to business value and warns of overspend." }
    - { id: d, text: "Use the measured token counts to build a cost model: users × requests per user × input and output tokens × price, plus supporting services", explanation: "Second: the measured tokens feed a monthly cost model." }
  answer: [b, d, a, c]
  explanation: "Estimate costs from measured token counts, build a cost model, compare on-demand with reserved or self-hosted options including operational effort, and then track cost per interaction with budgets after launch. For most teams starting out, on-demand wins."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-13#explanation
  difficulty: medium

