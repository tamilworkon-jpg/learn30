  answer: [d]
  explanation: "Amazon Bedrock does not use your prompts and outputs to train base models and does not share them with model providers. Customising a model creates a private copy for your account. Data is encrypted in transit and at rest, access is controlled with IAM, and PrivateLink provides private connectivity."
