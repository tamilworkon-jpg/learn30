- id: q-week-2-032
  set: week-2
  type: single
  stem: "A company has steady, high-volume traffic on one Amazon Bedrock model that will continue for at least the next year. It has decided to use provisioned throughput. How can it obtain the LOWEST hourly rate?"
  options:
    - { id: a, text: "Buy provisioned throughput with no commitment", explanation: "Incorrect. No-commitment provisioned throughput is available but at a higher hourly rate." }
    - { id: b, text: "Switch to batch inference for live traffic", explanation: "Incorrect. Batch is asynchronous and returns results in hours, which does not suit live traffic." }
    - { id: c, text: "Buy provisioned throughput with a 6-month commitment", explanation: "Correct. Longer commitments (1 month or 6 months) lower the hourly rate for model units." }
    - { id: d, text: "Increase the maximum output tokens setting", explanation: "Incorrect. Output length affects token usage, not the hourly price of reserved capacity." }
  answer: [c]
  explanation: "Provisioned throughput reserves model units for a fixed hourly price, whether or not they are used. It can be bought with no commitment or with a 1-month or 6-month commitment for a lower rate. It suits steady, high-volume traffic and many custom models."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-13#explanation
  difficulty: medium

- id: q-week-2-033
  set: week-2
  type: single
  stem: "A team hosts an open-weight model on an Amazon SageMaker AI real-time endpoint with GPU instances. Traffic is low and spiky, mostly during office hours. How does this cost compare with calling a similar model through Amazon Bedrock on-demand?"
  options:
    - { id: a, text: "The endpoint is billed per instance-hour even when idle, so at low or spiky utilisation it is usually more expensive than per-token on-demand pricing", explanation: "Correct. A self-hosted endpoint has a mostly fixed cost, while Bedrock on-demand cost is variable and falls to zero when unused." }
    - { id: b, text: "The endpoint is always cheaper because there are no per-token charges", explanation: "Incorrect. Instance-hours are charged whether the endpoint serves one request or a million, so low utilisation makes each request expensive." }
    - { id: c, text: "Both options charge exactly the same per token", explanation: "Incorrect. They have different cost shapes: fixed instance-hours versus variable tokens." }
    - { id: d, text: "Bedrock on-demand charges a fixed hourly fee even with no requests", explanation: "Incorrect. On-demand has no commitment or minimum; hourly fees apply to provisioned throughput." }
  answer: [a]
  explanation: "Bedrock on-demand has a variable cost that rises with tokens and is zero when idle. A real-time endpoint on SageMaker AI, EC2, ECS or EKS has a mostly fixed cost per instance-hour plus operational effort. Self-hosting can be cheaper only at high, steady utilisation; serverless and asynchronous options can scale to zero."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-13#explanation
  difficulty: hard

- id: q-week-2-034
  set: week-2
  type: single
  stem: "Three applications in one AWS account call the same Amazon Bedrock model. Finance wants AWS Cost Explorer to show the model spend of each application separately. What should the team set up?"
  options:
    - { id: a, text: "A separate prompt cache for each application", explanation: "Incorrect. Prompt caching reduces cost for repeated prefixes; it does not attribute spend." }
    - { id: b, text: "Application inference profiles with cost allocation tags", explanation: "Correct. Application inference profiles let you attach cost allocation tags to model usage, so Cost Explorer can group spend by application." }
    - { id: c, text: "A higher maximum output tokens setting for each application", explanation: "Incorrect. Output limits change usage, not how costs are attributed." }
    - { id: d, text: "Batch inference for all three applications", explanation: "Incorrect. Batch changes the price and timing of inference, not cost attribution." }
  answer: [b]
  explanation: "Tag usage by team, application or customer to make cost tools useful. Bedrock application inference profiles carry cost allocation tags, Cost Explorer analyses historical spend by tag, AWS Budgets alerts on thresholds, and CloudWatch shows near-real-time token metrics."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-13#explanation
  difficulty: medium

- id: q-week-2-035
  set: week-2
  type: multi
  stem: "Under the AWS shared responsibility model, which tasks remain the CUSTOMER's responsibility when building a chatbot on Amazon Bedrock? (Select TWO.)"
  options:
    - { id: a, text: "Patching the GPU servers that run the foundation models", explanation: "Incorrect. AWS operates and patches the infrastructure behind the managed service." }
    - { id: b, text: "Controlling with IAM who can access the application's data and models", explanation: "Correct. Customers manage access to their data and resources." }
    - { id: c, text: "Physical security of the data centres", explanation: "Incorrect. Physical security is AWS's responsibility." }
    - { id: d, text: "Deciding what data goes into prompts and how the model's outputs are used", explanation: "Correct. Customers are responsible for their prompts, application logic and the use of outputs." }
