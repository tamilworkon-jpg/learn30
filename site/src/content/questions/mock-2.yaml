  taskStatement: "4.1"
  lessonRef: day-23#explanation
  difficulty: medium

- id: q-mock-2-044
  set: mock-2
  type: multi
  stem: "A data science team's churn model loses accuracy every few months without anyone noticing quickly. Retraining is done by hand in notebooks that differ from person to person, and nobody is sure which model version is in production. Which Amazon SageMaker AI capabilities address these problems? (Select THREE.)"
  options:
    - { id: a, text: "SageMaker Ground Truth", explanation: "Incorrect. Ground Truth creates labelled data; it does not address monitoring, repeatability or versioning." }
    - { id: b, text: "SageMaker Model Monitor", explanation: "Correct. Model Monitor detects data and model quality drift so accuracy loss is noticed quickly." }
    - { id: c, text: "SageMaker Canvas", explanation: "Incorrect. Canvas is no-code ML for analysts; it does not add MLOps controls to an existing team's workflow." }
    - { id: d, text: "SageMaker Pipelines", explanation: "Correct. Pipelines automates training steps so retraining is repeatable rather than done by hand in notebooks." }
    - { id: e, text: "Amazon Quick", explanation: "Incorrect. Amazon Quick serves business users with insights and agents; it is not an MLOps tool." }
    - { id: f, text: "SageMaker Model Registry", explanation: "Correct. Model Registry versions models and records approval status, showing which version is deployed." }
  answer: [b, d, f]
  explanation: "MLOps makes ML repeatable, scalable and monitored. Model Monitor watches for drift, Pipelines automates retraining, and Model Registry versions and approves models. Together they remove technical debt and make production readiness clear."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: hard

- id: q-mock-2-045
  set: mock-2
  type: single
  stem: "Auditors complain that an internal compliance Q&A tool gives differently worded answers each time they ask the same question. Which inference parameter change will make answers MOST consistent?"
  options:
    - { id: a, text: "Increase the maximum output tokens", explanation: "Incorrect. This allows longer answers but does not reduce variation." }
    - { id: b, text: "Increase top-k", explanation: "Incorrect. A larger top-k lets the model choose from more candidate tokens, which increases variation." }
    - { id: c, text: "Add a stop sequence", explanation: "Incorrect. A stop sequence controls where output ends, not how random it is." }
    - { id: d, text: "Lower the temperature", explanation: "Correct. Lower temperature makes the model favour the most likely tokens, giving more deterministic answers." }
  answer: [d]
  explanation: "Temperature, top-p and top-k control randomness: lower values give consistent, factual output and higher values give creative, varied output. Maximum tokens and stop sequences control length. None of these settings adds knowledge."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-15#explanation
  difficulty: easy

- id: q-mock-2-046
  set: mock-2
  type: single
  stem: "A security team must be alerted automatically if an Amazon S3 bucket that holds training data ever becomes publicly accessible. It also needs a history of how the bucket's settings changed and whether it was compliant at each point. Which service BEST meets these requirements?"
  options:
    - { id: a, text: "AWS CloudTrail", explanation: "Incorrect. CloudTrail records who made each API call, but it does not evaluate resource settings against compliance rules." }
    - { id: b, text: "Amazon Inspector", explanation: "Incorrect. Inspector scans compute workloads for software vulnerabilities, not bucket configurations." }
    - { id: c, text: "AWS Config", explanation: "Correct. Config records configuration changes over time and evaluates resources against rules, flagging non-compliant buckets." }
    - { id: d, text: "AWS Trusted Advisor", explanation: "Incorrect. Trusted Advisor gives periodic best-practice checks but does not keep a configuration and compliance history for each resource." }
  answer: [c]
  explanation: "Configuration history and compliance rules: AWS Config. Who made an API call: CloudTrail. Software vulnerabilities: Inspector. Account-wide best-practice recommendations: Trusted Advisor. Config and CloudTrail are often used together."
