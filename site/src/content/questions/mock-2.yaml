    - { id: c, text: "Amazon Macie", explanation: "Correct. Macie automatically discovers and reports sensitive data such as PII and financial information across S3 buckets." }
    - { id: d, text: "Amazon Comprehend PII detection", explanation: "Incorrect. Comprehend detects PII in text you send to it, but discovering sensitive data across S3 buckets at scale is Macie's job." }
  answer: [c]
  explanation: "Discover sensitive data at rest in S3: Amazon Macie. Mask PII in model inputs and outputs: Guardrails sensitive information filters. Analyse text you send through an API: Comprehend. Software vulnerabilities: Inspector."
