  taskStatement: "3.2"
  lessonRef: day-16#explanation
  difficulty: medium

- id: q-mock-2-053
  set: mock-2
  type: single
  stem: "A small manufacturer wants to detect scratches in photos of its products but has only 60 labelled images. Which approach is MOST likely to give good accuracy?"
  options:
    - { id: a, text: "Train a deep convolutional neural network from scratch on the 60 images", explanation: "Incorrect. Deep networks trained from scratch need far more data and would overfit 60 images." }
    - { id: b, text: "Use linear regression on the raw pixel values", explanation: "Incorrect. Linear regression predicts numbers and cannot learn visual patterns from raw pixels." }
    - { id: c, text: "Run k-means clustering on the images", explanation: "Incorrect. Clustering ignores the labels and does not learn to identify scratches." }
    - { id: d, text: "Fine-tune a pre-trained image model using transfer learning", explanation: "Correct. Transfer learning reuses features learned from millions of images, so a small labelled set is enough." }
  answer: [d]
  explanation: "Deep learning usually needs lots of data, but transfer learning reuses a pre-trained model and adapts it with a small labelled dataset. SageMaker JumpStart offers pre-trained vision models for this. Little labelled data plus a pre-trained model points to transfer learning."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-04#explanation
  difficulty: medium

- id: q-mock-2-054
  set: mock-2
  type: single
  stem: "An insurer's RAG assistant sometimes adds policy details that do not appear in the retrieved documents. The insurer wants to automatically detect and block answers that are not supported by the retrieved sources. Which Amazon Bedrock Guardrails feature should it use?"
  options:
    - { id: a, text: "A denied topic", explanation: "Incorrect. Denied topics block whole subjects; they do not check whether an answer matches its sources." }
    - { id: b, text: "The contextual grounding check", explanation: "Correct. The contextual grounding check scores whether a response is grounded in the supplied source and relevant to the query, and blocks it below a threshold." }
    - { id: c, text: "Automated Reasoning checks", explanation: "Incorrect. Automated Reasoning checks verify answers against formally defined rules and policies, not against the retrieved passages of each request." }
    - { id: d, text: "A word filter", explanation: "Incorrect. Word filters block specific words or phrases." }
  answer: [b]
  explanation: "To catch hallucinations in RAG, use the Guardrails contextual grounding check, which compares responses with the reference source. Automated Reasoning checks validate answers against formal rules. Both help with grounding, but they check different things."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-26#explanation
  difficulty: hard

- id: q-mock-2-055
  set: mock-2
  type: multi
  stem: "A financial services company is reviewing proposed generative AI projects. Which proposals are the LEAST suitable for a generative AI solution? (Select TWO.)"
  options:
    - { id: a, text: "Drafting first versions of marketing emails for human review", explanation: "Incorrect. Content generation with human review is a strong GenAI use case." }
    - { id: b, text: "Summarising long internal meeting transcripts", explanation: "Incorrect. Summarisation is one of the most common and valuable GenAI uses." }
    - { id: c, text: "Calculating payroll deductions that must match statutory rules to the cent", explanation: "Correct. Exact, repeatable calculations need deterministic logic; generative AI is nondeterministic and can make arithmetic errors." }
    - { id: d, text: "Answering employee FAQs grounded in a policy knowledge base", explanation: "Incorrect. Grounded question answering is a good fit for GenAI with RAG." }
    - { id: e, text: "Making final credit decisions that must be explained to regulators feature by feature", explanation: "Correct. Generative models have low interpretability, so a strictly explainable decision suits a transparent traditional model." }
  answer: [c, e]
  explanation: "Generative AI is adaptable and good at content, conversation and summarisation, but it is nondeterministic, can be inaccurate and is hard to interpret. Avoid it where exact results or feature-level explanations are required."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: hard

- id: q-mock-2-056
  set: mock-2
  type: ordering
  stem: "A company is setting up the ingestion side of a RAG solution for its policy manuals. Place these ingestion steps in the correct order, from first to last."
  options:
    - { id: a, text: "Split the manuals into chunks, with some overlap", explanation: "Second: long documents are divided into focused passages before embedding." }
    - { id: b, text: "Generate an embedding vector for each chunk with an embedding model", explanation: "Third: each chunk is turned into a vector that captures its meaning." }
    - { id: c, text: "Write the vectors and chunk text into a vector store index", explanation: "Last: the vectors are indexed so they can be searched at question time." }
    - { id: d, text: "Store the manuals in an Amazon S3 data source", explanation: "First: the source documents must be available to the knowledge base." }
  answer: [d, a, b, c]
  explanation: "Ingestion runs source data, then chunking, then embedding, then indexing in a vector store. At question time the query is embedded with the same model, similar chunks are retrieved, and the FM generates an answer. Bedrock Knowledge Bases automates the whole pipeline."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-18#explanation
  difficulty: medium

- id: q-mock-2-057
  set: mock-2
  type: single
  stem: "A lender removed the gender column from its training data. The model still approves noticeably fewer women than men with similar finances. The data still contains first name, postcode and shopping categories. What is the MOST likely cause, and what should the lender do?"
  options:
    - { id: a, text: "The model is suffering from data drift, so it should be redeployed", explanation: "Incorrect. Redeploying the same model does not change its behaviour, and the issue is bias, not drift." }
    - { id: b, text: "The model is underfitting, so training should run for more epochs", explanation: "Incorrect. More training would learn the biased pattern even more strongly." }
    - { id: c, text: "Other features act as proxies for gender, so the lender should measure outcomes per group, for example with SageMaker Clarify, and mitigate the proxies", explanation: "Correct. Removing a sensitive column does not remove bias when proxies remain. Per-group bias metrics show the problem and guide mitigation." }
    - { id: d, text: "The model is too small, so it should be replaced with a larger model", explanation: "Incorrect. A larger model would learn the proxies just as well." }
  answer: [c]
  explanation: "Proxy features such as names or postcodes can carry the same information as a removed sensitive attribute. Responsible practice is to evaluate per subgroup (Clarify post-training bias metrics), improve data balance, handle proxies and keep monitoring."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-22#explanation
  difficulty: hard

- id: q-mock-2-058
  set: mock-2
  type: single
  stem: "After launching a fine-tuned foundation model, a team collects thumbs-up and thumbs-down ratings and correction notes from users and plans to use them when building the next model version. Which stage of the foundation model lifecycle is this?"
  options:
    - { id: a, text: "Pre-training", explanation: "Incorrect. Pre-training is the initial self-supervised training on huge unlabelled datasets." }
    - { id: b, text: "Model selection", explanation: "Incorrect. Model selection is choosing which base model to start from." }
    - { id: c, text: "Data selection", explanation: "Incorrect. Data selection happens at the start, before training; this activity follows deployment." }
    - { id: d, text: "Feedback", explanation: "Correct. Feedback collects real-world signals after deployment to improve the next version, which closes the lifecycle loop." }
  answer: [d]
  explanation: "The foundation model lifecycle runs data selection, model selection, pre-training, fine-tuning, evaluation, deployment and feedback, and then repeats. Feedback from users and monitoring guides the next round of data and tuning."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-09#explanation
  difficulty: medium

- id: q-mock-2-059
  set: mock-2
  type: single
  stem: "A workflow uses a foundation model to label incoming invoices as 'approve', 'review' or 'reject'. When the same invoice is processed twice, the model sometimes returns different labels or extra wording, which breaks the downstream automation. Which change BEST addresses this?"
  options:
    - { id: a, text: "Set a low temperature and instruct the model to return only one of the three allowed labels", explanation: "Correct. Low temperature reduces nondeterminism and a constrained output format keeps responses machine-readable." }
    - { id: b, text: "Choose a model with a larger context window", explanation: "Incorrect. Context size does not affect output variability." }
    - { id: c, text: "Increase top-p to 1.0", explanation: "Incorrect. A higher top-p widens token choice and increases variability." }
    - { id: d, text: "Purchase provisioned throughput", explanation: "Incorrect. Provisioned throughput guarantees capacity, not consistent outputs." }
  answer: [a]
  explanation: "Nondeterminism means the same input can produce different outputs. Lower temperature or top-p, a constrained output format and validation of the output reduce it. For truly exact decisions, consider deterministic logic or traditional ML instead."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: medium

- id: q-mock-2-060
  set: mock-2
  type: single
  stem: "A support chatbot on Amazon Bedrock sends every request to a large, expensive model. About 80% of requests are simple FAQs that a smaller model in the same family answers well. The company wants to cut cost with the LEAST engineering effort while keeping quality on complex questions. Which solution meets these requirements?"
  options:
    - { id: a, text: "Buy provisioned throughput for the large model", explanation: "Incorrect. Provisioned throughput guarantees capacity but still runs every request on the expensive model." }
    - { id: b, text: "Use Amazon Bedrock intelligent prompt routing between the smaller and larger models", explanation: "Correct. Intelligent prompt routing sends each request to a model in the same family based on predicted quality and cost, with no custom routing code." }
    - { id: c, text: "Run continued pre-training on the small model so it can handle every request", explanation: "Incorrect. Continued pre-training is costly and slow, and complex questions may still need the larger model." }
    - { id: d, text: "Raise the maximum output tokens of the large model", explanation: "Incorrect. Longer outputs increase cost." }
  answer: [b]
  explanation: "Right-size the model: send simple requests to a small model and only hard ones to a large model. Amazon Bedrock intelligent prompt routing does this automatically within a model family. Prompt caching, distillation and shorter outputs also reduce GenAI cost."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-13#explanation
  difficulty: hard

- id: q-mock-2-061
  set: mock-2
  type: multi
  stem: "An e-commerce company wants an assistant that checks order status through an internal API, creates return labels, and answers questions from the returns-policy documents, without managing servers. Which Amazon Bedrock capabilities should it use? (Select TWO.)"
  options:
    - { id: a, text: "Model distillation", explanation: "Incorrect. Distillation reduces model cost; it does not add tool use or retrieval." }
    - { id: b, text: "Amazon Comprehend custom classification", explanation: "Incorrect. Comprehend classifies text; it does not call APIs or answer questions from documents." }
    - { id: c, text: "An agent on Amazon Bedrock AgentCore, with the order and returns APIs exposed as tools through AgentCore Gateway", explanation: "Correct. The agent plans the steps and calls the order and returns APIs as tools; AgentCore hosts it without servers to manage." }
    - { id: d, text: "An Amazon Bedrock knowledge base that the agent queries", explanation: "Correct. The knowledge base grounds policy answers in the returns documents." }
    - { id: e, text: "Amazon Bedrock batch inference", explanation: "Incorrect. Batch inference processes offline jobs and cannot hold interactive, multi-step conversations." }
  answer: [c, d]
  explanation: "AI agents complete multi-step tasks by calling tools. For new agents AWS recommends Amazon Bedrock AgentCore — Gateway turns APIs and Lambda functions into tools — with a knowledge base for grounded answers. Amazon Bedrock Agents (action groups) is closed to new customers since July 2026, though existing agents keep working."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-18#explanation
  difficulty: medium

- id: q-mock-2-062
  set: mock-2
  type: single
  stem: "A company fine-tuned a support model on past chat transcripts. The model performs well for US customers but poorly for customers in Canada and Australia. 95% of the training transcripts came from US customers. Which action will MOST likely fix this?"
  options:
    - { id: a, text: "Train for more epochs on the same dataset", explanation: "Incorrect. More epochs on the same imbalanced data would increase overfitting to US conversations." }
    - { id: b, text: "Add curated, labelled transcripts from Canadian and Australian customers to the training data", explanation: "Correct. Representative training data is a core data-preparation requirement for fine-tuning." }
    - { id: c, text: "Raise the temperature for non-US customers", explanation: "Incorrect. Randomness does not add missing knowledge about regional products or language." }
    - { id: d, text: "Distil the model into a smaller student", explanation: "Incorrect. Distillation copies the teacher's behaviour, including its gaps." }
  answer: [b]
  explanation: "Fine-tuning data must be curated, governed, large enough, well labelled and representative of the people the model will serve. If a group is under-represented, add good examples for that group."
  domain: D3
  taskStatement: "3.3"
  lessonRef: day-19#explanation
  difficulty: medium

- id: q-mock-2-063
  set: mock-2
  type: single
  stem: "A company wants to compare three foundation models available in Amazon Bedrock on its own set of 500 question–answer pairs, scoring accuracy and toxicity. Which approach requires the LEAST effort?"
  options:
    - { id: a, text: "Build a custom evaluation harness on Amazon EC2 instances", explanation: "Incorrect. A custom harness works but means writing and running your own code." }
    - { id: b, text: "Run Amazon SageMaker Model Monitor on each model", explanation: "Incorrect. Model Monitor watches deployed SageMaker models for drift; it does not compare Bedrock models on a test set." }
    - { id: c, text: "Choose the model that ranks highest on a public leaderboard", explanation: "Incorrect. Public benchmarks do not show how the models perform on the company's own data." }
    - { id: d, text: "Create Amazon Bedrock Model Evaluation jobs with the company's dataset", explanation: "Correct. Bedrock Model Evaluation runs managed automatic evaluations with built-in metrics such as accuracy and toxicity on a custom prompt dataset." }
  answer: [d]
