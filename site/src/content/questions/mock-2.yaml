    - { id: t2, text: "Amazon Quick" }
    - { id: t3, text: "Strands Agents" }
    - { id: t4, text: "Kiro" }
    - { id: t5, text: "Amazon Bedrock AgentCore" }
  answer: { a: t2, b: t4, c: t1, d: t5, e: t3 }
  explanation: "Ready-made applications serve specific users: Amazon Quick for business users, Kiro for developers and AWS Transform for modernisation. For custom agents, Strands Agents helps you write them and Bedrock AgentCore runs them securely at scale."
