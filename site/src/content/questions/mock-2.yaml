  taskStatement: "4.2"
  lessonRef: day-24#explanation
  difficulty: hard

- id: q-mock-2-029
  set: mock-2
  type: single
  stem: "An internal HR assistant confidently tells an employee about a 'sabbatical bonus policy' that the company has never had. Which approach MOST effectively reduces this problem?"
  options:
    - { id: a, text: "Ground the assistant in the official HR policy documents with RAG and require citations", explanation: "Correct. Grounding answers in retrieved, trusted documents with citations is the main mitigation for hallucinations." }
    - { id: b, text: "Switch to a larger foundation model", explanation: "Incorrect. Larger models still hallucinate when they lack the company's facts." }
    - { id: c, text: "Increase the temperature", explanation: "Incorrect. Higher temperature makes output more random and can increase invented content." }
    - { id: d, text: "Increase the maximum output tokens", explanation: "Incorrect. Allowing longer answers does not make them more accurate." }
  answer: [a]
  explanation: "A confident but false answer is a hallucination. The fix is grounding (RAG over trusted sources, with citations), optionally with a contextual grounding check and human review, not a bigger model or different sampling settings."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: medium

- id: q-mock-2-030
  set: mock-2
  type: multi
  stem: "A manufacturer wants a product assistant that (1) answers questions from technical specifications that change every week and (2) always writes in the company's distinctive brand voice. Prompt instructions alone have failed to reproduce the voice consistently, and the company has 10,000 approved example responses. Which approaches together meet both requirements MOST cost-effectively? (Select TWO.)"
  options:
    - { id: a, text: "Use RAG with an Amazon Bedrock knowledge base over the specifications", explanation: "Correct. RAG supplies current specifications at question time, and a sync picks up weekly changes without retraining." }
    - { id: b, text: "Run continued pre-training on the specifications every week", explanation: "Incorrect. Weekly continued pre-training is expensive, slow and still cannot cite current specifications." }
    - { id: c, text: "Pre-train a new foundation model on company data", explanation: "Incorrect. Pre-training from scratch is the most expensive option and is not needed." }
    - { id: d, text: "Fine-tune the model on the 10,000 approved responses", explanation: "Correct. Fine-tuning on labelled examples teaches a consistent style and tone that prompting could not achieve." }
    - { id: e, text: "Increase the temperature so the voice sounds more natural", explanation: "Incorrect. Temperature changes randomness, not brand voice or factual knowledge." }
  answer: [a, d]
  explanation: "Use each customisation method for what it does best. Changing facts: RAG. Consistent style, tone or format learned from many labelled examples: fine-tuning. Combining them is common, and it is far cheaper than repeated continued pre-training or pre-training."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-18#explanation
  difficulty: hard

- id: q-mock-2-031
  set: mock-2
  type: matching
  stem: "A utility company has several analytics requests. Match each request to the ML technique that fits it BEST."
  options:
    - { id: a, text: "Predict next month's electricity demand in megawatt-hours for each district", explanation: "Regression, because the output is a number." }
    - { id: b, text: "Decide whether a meter reading is a likely tampering case: yes or no", explanation: "Classification, because the output is a category." }
    - { id: c, text: "Group customers into usage segments when no segment labels exist", explanation: "Clustering, because it finds groups in unlabelled data." }
    - { id: d, text: "Estimate how many minutes a repair crew will take to restore an outage", explanation: "Regression, because the output is a continuous number." }
  matchTargets:
    - { id: t1, text: "Regression" }
