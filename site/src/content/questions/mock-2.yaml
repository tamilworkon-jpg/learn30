- id: q-mock-2-001
  set: mock-2
  type: single
  stem: "A law firm wants an internal assistant that answers lawyers' questions from 200,000 contracts stored in Amazon S3. Contracts are added and amended every day, and every answer must cite the contract it came from. Which solution meets these requirements with the LEAST operational overhead?"
  options:
    - { id: a, text: "Fine-tune a foundation model in Amazon Bedrock on the contracts every week", explanation: "Incorrect. Fine-tuning changes behaviour and style, not current facts. Weekly retraining is costly, always out of date and cannot cite sources." }
    - { id: b, text: "Create an Amazon Bedrock knowledge base with the S3 bucket as its data source and sync it when contracts change", explanation: "Correct. Bedrock Knowledge Bases manages chunking, embedding, vector storage and retrieval, returns citations, and a sync picks up new or changed contracts." }
    - { id: c, text: "Run continued pre-training on the contracts so the model memorises them", explanation: "Incorrect. Continued pre-training is expensive, cannot cite sources and would need repeating every time a contract changes." }
    - { id: d, text: "Paste all relevant contracts into every prompt using the model with the largest context window", explanation: "Incorrect. 200,000 contracts cannot fit in a context window, and sending huge prompts raises cost and latency on every request." }
  answer: [b]
  explanation: "When answers must come from current, proprietary documents with citations, use retrieval-augmented generation (RAG). Amazon Bedrock Knowledge Bases is the managed RAG service: it ingests from S3, chunks, embeds, stores vectors and returns cited answers. Fine-tuning and continued pre-training do not keep up with daily changes."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-18#explanation
  difficulty: medium

- id: q-mock-2-002
  set: mock-2
  type: single
  stem: "A news publisher wants every written article on its website to also be available as natural-sounding spoken audio in several voices. Which AWS service should the publisher use?"
  options:
    - { id: a, text: "Amazon Transcribe", explanation: "Incorrect. Transcribe converts speech to text, which is the opposite direction." }
    - { id: b, text: "Amazon Translate", explanation: "Incorrect. Translate converts text from one language to another; it does not produce audio." }
    - { id: c, text: "Amazon Polly", explanation: "Correct. Polly converts text to lifelike speech in many voices and languages, with SSML to control pronunciation and pauses." }
    - { id: d, text: "Amazon Lex", explanation: "Incorrect. Lex builds conversational chatbots with intents and slots; it is not a text-to-speech service." }
  answer: [c]
  explanation: "Polly is text to speech; Transcribe is speech to text; Translate converts between languages; Lex builds chatbots. Reading the direction of the conversion is the quickest way to separate these services."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: easy

- id: q-mock-2-003
  set: mock-2
  type: single
  stem: "An online retailer receives 50,000 product reviews per day. For each review it needs a positive, negative, neutral or mixed label and a list of the brand names mentioned. The retailer has no ML team and wants the MOST cost-effective solution that needs no prompt maintenance. Which solution should it choose?"
  options:
    - { id: a, text: "Send each review to a large foundation model in Amazon Bedrock with a classification prompt", explanation: "Incorrect. A foundation model can do this, but it requires prompt design and maintenance and per-token costs are usually higher than a purpose-built API for standard sentiment and entities." }
    - { id: b, text: "Train a custom sentiment and entity model in Amazon SageMaker AI", explanation: "Incorrect. Custom training needs labelled data, ML skills and hosting, which is far more effort than the requirement justifies." }
    - { id: c, text: "Create an Amazon Bedrock knowledge base of the reviews and query it", explanation: "Incorrect. A knowledge base retrieves documents to ground answers; it does not label sentiment or extract entities from each review." }
    - { id: d, text: "Use Amazon Comprehend sentiment analysis and entity detection", explanation: "Correct. Comprehend is a pre-trained NLP service that returns sentiment and entities through an API, with no models or prompts to manage." }
  answer: [d]
  explanation: "For standard NLP tasks such as sentiment, entities, key phrases, language and PII, Amazon Comprehend is the purpose-built managed service. Choose a Bedrock foundation model when the task needs generation, summarisation or flexible reasoning rather than a fixed, well-known analysis."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: hard

- id: q-mock-2-004
  set: mock-2
  type: single
  stem: "Before training a loan-approval model in Amazon SageMaker AI, a data science team wants to check whether the training dataset under-represents applicants in some age groups and whether approval labels are imbalanced between those groups. Which capability should the team use?"
  options:
    - { id: a, text: "Amazon SageMaker Clarify pre-training bias analysis", explanation: "Correct. Clarify measures bias in the dataset before training, including class imbalance and label differences between groups." }
    - { id: b, text: "Amazon SageMaker Model Monitor bias drift monitoring", explanation: "Incorrect. Model Monitor watches a deployed model over time; there is no deployed model yet." }
    - { id: c, text: "Amazon Bedrock Guardrails content filters", explanation: "Incorrect. Guardrails filters prompts and responses of generative AI applications; it does not analyse tabular training data for bias." }
    - { id: d, text: "Amazon SageMaker Model Cards", explanation: "Incorrect. Model Cards document a model's intended use and evaluation; they do not calculate bias metrics." }
  answer: [a]
  explanation: "SageMaker Clarify detects bias in data before training (pre-training bias) and in predictions after training (post-training bias), and explains predictions with SHAP. Model Monitor keeps checking a deployed model for drift, and Guardrails filters generative AI content."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-23#explanation
  difficulty: medium

- id: q-mock-2-005
  set: mock-2
  type: single
  stem: "A company uses Amazon Bedrock on-demand inference to write product descriptions. The monthly invoice shows that output tokens make up 80% of the cost. Which action will MOST directly reduce the cost?"
  options:
    - { id: a, text: "Increase the temperature so the model writes more varied text", explanation: "Incorrect. Temperature changes randomness, not length, so it does not reduce the number of output tokens." }
    - { id: b, text: "Switch to provisioned throughput", explanation: "Incorrect. Provisioned throughput buys guaranteed capacity billed by the hour; it is not cheaper for modest or variable traffic and does not shorten responses." }
    - { id: c, text: "Set a maximum output token limit and instruct the model to write concise descriptions", explanation: "Correct. On-demand pricing is per token and output tokens usually cost more than input tokens, so shorter outputs directly cut the largest part of the bill." }
    - { id: d, text: "Add several long example descriptions to every prompt", explanation: "Incorrect. Few-shot examples add input tokens to every request, raising cost rather than lowering it." }
  answer: [c]
  explanation: "On-demand foundation model pricing charges separately for input and output tokens, and output tokens usually cost more. Capping maximum output tokens and asking for concise answers is the most direct way to reduce an output-heavy bill."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-09#explanation
  difficulty: medium

- id: q-mock-2-006
  set: mock-2
  type: single
  stem: "A company has several teams using Amazon Bedrock in one AWS account. Only the finance team's application role should be allowed to invoke one particular model, and other teams' roles must be denied. Which approach meets this requirement?"
  options:
    - { id: a, text: "Create an Amazon Bedrock guardrail with a denied topic for finance", explanation: "Incorrect. Guardrails filter the content of prompts and responses; they do not decide which identities may call a model." }
    - { id: b, text: "Use Amazon Macie to classify the finance team's prompts", explanation: "Incorrect. Macie discovers sensitive data in Amazon S3; it does not control access to Bedrock models." }
    - { id: c, text: "Add an instruction to the system prompt telling the model to answer only finance users", explanation: "Incorrect. A prompt instruction is not an access control and can be bypassed by prompt injection." }
    - { id: d, text: "Use IAM policies that allow bedrock:InvokeModel on that model only for the finance application's role", explanation: "Correct. IAM decides who can invoke which model. A least-privilege policy scoped to the model's ARN allows only the finance role." }
  answer: [d]
  explanation: "Access to AI resources is controlled with IAM: roles and least-privilege policies decide which principals can invoke which models. Guardrails control what content is allowed, not who may call the model. Confusing the two is a common exam trap."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: hard

- id: q-mock-2-007
  set: mock-2
  type: single
  stem: "A support team wants a foundation model to turn customer emails into tickets in a fixed JSON format with consistent field names. The team has five good example tickets, no labelled training dataset and no budget for training. Which approach should the team use FIRST?"
  options:
    - { id: a, text: "Few-shot prompting that includes the example tickets and the required JSON format", explanation: "Correct. Including a few examples in the prompt shows the model the exact format without training, at almost no cost." }
    - { id: b, text: "Fine-tune the model on the five examples", explanation: "Incorrect. Fine-tuning needs a much larger labelled dataset and adds training and hosting costs." }
    - { id: c, text: "Raise the temperature so the model explores more formats", explanation: "Incorrect. Higher temperature makes output more random, which works against a fixed format." }
    - { id: d, text: "Run continued pre-training on old support emails", explanation: "Incorrect. Continued pre-training teaches domain vocabulary from unlabelled text; it is expensive and does not teach a specific output format." }
  answer: [a]
  explanation: "Prompt engineering is the cheapest, fastest first step. Few-shot prompting places examples in the prompt to show the desired format or style; it does not change model weights. Move to fine-tuning only if prompting cannot meet the requirement and a large labelled dataset exists."
  domain: D3
  taskStatement: "3.2"
  lessonRef: day-16#explanation
  difficulty: easy

- id: q-mock-2-008
  set: mock-2
  type: single
  stem: "An insurer runs a damage-assessment model on claim photo bundles uploaded by field adjusters. Each bundle can be up to 500 MB and takes about 8 minutes to process. Adjusters check the results later in the day. Which Amazon SageMaker AI inference option fits BEST?"
  options:
    - { id: a, text: "Real-time inference", explanation: "Incorrect. Real-time endpoints are for low-latency requests with small payloads where a user is waiting." }
    - { id: b, text: "Asynchronous inference", explanation: "Correct. Asynchronous inference queues large payloads and long-running requests and writes results to Amazon S3, so nobody has to wait for a response." }
    - { id: c, text: "Serverless inference", explanation: "Incorrect. Serverless inference suits intermittent traffic with small, quick requests; it is not designed for 500 MB payloads that run for minutes." }
    - { id: d, text: "Batch transform", explanation: "Incorrect. Batch transform processes a whole dataset in a scheduled offline job; here requests arrive one by one through the day and need individual results." }
  answer: [b]
  explanation: "Match inference to the workload: real-time for waiting users, serverless for spiky, small requests, batch transform for large scheduled jobs over a whole dataset, and asynchronous for individual requests with large payloads (up to 1 GB) or long processing times (up to about an hour)."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#explanation
  difficulty: medium

- id: q-mock-2-009
  set: mock-2
  type: single
  stem: "A startup's Amazon Bedrock chatbot receives a few hundred requests per day, with occasional unpredictable spikes after marketing emails. The CFO wants the MOST cost-effective pricing option. Which option should the startup use?"
  options:
    - { id: a, text: "On-demand inference, paying per input and output token", explanation: "Correct. On-demand has no commitment and charges only for tokens used, which suits modest, unpredictable traffic." }
    - { id: b, text: "Provisioned throughput with a one-month commitment", explanation: "Incorrect. Provisioned throughput is billed per hour even when idle, so it is expensive for low and variable traffic." }
    - { id: c, text: "Batch inference", explanation: "Incorrect. Batch inference returns results in hours and does not suit an interactive chatbot." }
    - { id: d, text: "A model hosted on an Amazon SageMaker AI real-time endpoint running 24 hours a day", explanation: "Incorrect. An always-on endpoint costs money while idle and adds operational work." }
  answer: [a]
  explanation: "On-demand pricing fits variable or modest traffic because you pay only for tokens used. Provisioned throughput fits steady, high volume or guaranteed capacity, and batch inference fits large offline jobs. Provisioned capacity is not automatically cheaper."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-13#explanation
  difficulty: medium

- id: q-mock-2-010
  set: mock-2
  type: single
  stem: "A credit union's regulator requires loan officers to be able to read the exact logic a model used for each decision. The training data is a small table with 15 features. Which model type BEST meets this requirement?"
  options:
    - { id: a, text: "A deep neural network explained afterwards with SHAP values", explanation: "Incorrect. SHAP gives post-hoc approximations of feature influence; officers still cannot read the exact logic of a deep network." }
    - { id: b, text: "A large language model asked to explain its reasoning", explanation: "Incorrect. An LLM's explanation is generated text and is not guaranteed to reflect how it decided." }
    - { id: c, text: "A shallow decision tree", explanation: "Correct. A decision tree is a transparent model: each decision follows readable if-then rules." }
    - { id: d, text: "An ensemble of 2,000 gradient-boosted trees", explanation: "Incorrect. Large ensembles are accurate but too complex to read directly, so they need post-hoc explanation." }
  answer: [c]
  explanation: "Transparent models such as linear or logistic regression and small decision trees can be read directly. Opaque models such as deep networks, large ensembles and LLMs need post-hoc techniques like SHAP. When regulation demands readable logic on small structured data, choose a transparent model."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#explanation
  difficulty: medium

- id: q-mock-2-011
  set: mock-2
  type: single
  stem: "An external auditor asks a company for the AWS SOC 2 report and ISO certifications that cover the AWS services used by its AI platform. Where can the company download these documents?"
  options:
    - { id: a, text: "AWS Config", explanation: "Incorrect. Config records and evaluates your own resource configurations; it does not provide AWS's audit reports." }
    - { id: b, text: "AWS Artifact", explanation: "Correct. AWS Artifact is the self-service portal for AWS compliance reports such as SOC and ISO, and for agreements." }
    - { id: c, text: "AWS Trusted Advisor", explanation: "Incorrect. Trusted Advisor checks your account against best practices for cost, security, fault tolerance and quotas." }
    - { id: d, text: "AWS CloudTrail", explanation: "Incorrect. CloudTrail records API activity in your account, not AWS's third-party certifications." }
  answer: [b]
  explanation: "AWS Artifact provides on-demand access to AWS's compliance reports (SOC, ISO, PCI) and agreements. Use it as evidence of AWS's side of the shared responsibility model; you still need your own evidence for your side."
  domain: D5
  taskStatement: "5.2"
  lessonRef: day-27#explanation
  difficulty: easy

- id: q-mock-2-012
  set: mock-2
  type: single
  stem: "A pharmaceutical company has 40 GB of unlabelled internal research papers full of proprietary compound names and lab terminology. A foundation model keeps misunderstanding this vocabulary. Which customisation approach fits this data BEST?"
  options:
    - { id: a, text: "Instruction fine-tuning", explanation: "Incorrect. Instruction fine-tuning needs labelled prompt–response pairs, and the company has unlabelled text." }
    - { id: b, text: "Reinforcement learning from human feedback (RLHF)", explanation: "Incorrect. RLHF needs human rankings of responses and aligns behaviour with preferences; it does not teach domain vocabulary." }
    - { id: c, text: "Continued pre-training on the domain text", explanation: "Correct. Continued pre-training uses large amounts of unlabelled domain text to teach the model a field's vocabulary and language." }
    - { id: d, text: "Model distillation", explanation: "Incorrect. Distillation trains a smaller student on a larger teacher's outputs to cut cost; it does not add domain knowledge." }
  answer: [c]
  explanation: "The type of data points to the technique. Unlabelled domain text means continued pre-training. Labelled prompt–response pairs mean fine-tuning. Human rankings mean RLHF. A big model's answers used to train a small one means distillation."
  domain: D3
  taskStatement: "3.3"
  lessonRef: day-19#explanation
  difficulty: medium

- id: q-mock-2-013
  set: mock-2
  type: multi
  stem: "A software company is building semantic search over its help-centre articles. A user who searches for 'can't get into my account' should find an article titled 'Resetting your password', even though the two share no words. Which components are essential for this solution? (Select TWO.)"
  options:
    - { id: a, text: "A keyword index that only returns articles containing the exact search terms", explanation: "Incorrect. Exact keyword matching would miss the article because the words differ." }
    - { id: b, text: "An embedding model that converts both the articles and the search queries into vectors", explanation: "Correct. Embeddings place text with similar meaning close together, so related phrases match even without shared words." }
    - { id: c, text: "A diffusion model", explanation: "Incorrect. Diffusion models generate images by removing noise; they are not used for text search." }
    - { id: d, text: "A vector store that runs similarity (k-NN) search over the article vectors", explanation: "Correct. A vector store finds the article vectors nearest to the query vector, for example by cosine similarity." }
    - { id: e, text: "A higher temperature setting on the search model", explanation: "Incorrect. Temperature controls randomness in text generation; it has no role in similarity search." }
  answer: [b, d]
  explanation: "Semantic search relies on embeddings, numerical vectors that capture meaning, and a vector store that finds the nearest vectors to the query. The same embedding model must be used for documents and queries so their vectors are comparable."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: medium

- id: q-mock-2-014
  set: mock-2
  type: single
  stem: "A clinic deploys a model that screens scans for a rare condition found in 1% of patients. Missing a patient who has the condition is very serious, while a false alarm only leads to a cheap follow-up test. Which metric should the clinic prioritise when choosing a model?"
  options:
    - { id: a, text: "Precision", explanation: "Incorrect. Precision matters when false alarms are costly; here false alarms are cheap." }
    - { id: b, text: "Accuracy", explanation: "Incorrect. With 1% positives, a model that predicts 'healthy' for everyone is 99% accurate and useless." }
    - { id: c, text: "Root mean squared error (RMSE)", explanation: "Incorrect. RMSE measures error for regression models that predict numbers, not for classification." }
    - { id: d, text: "Recall", explanation: "Correct. Recall measures how many real positive cases the model finds, which matters most when missing a case is costly." }
  answer: [d]
  explanation: "Choose the metric from the cost of mistakes. Missing a case is costly: recall. False alarms are costly: precision. Both matter: F1. On imbalanced data, accuracy can hide a model that never finds the rare class."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-mock-2-015
  set: mock-2
  type: single
  stem: "A news agency generates article summaries with a foundation model and compares each one with a summary written by an editor. It wants an automatic metric that measures how much of the editor's content the generated summary captures, based on word overlap. Which metric should it use?"
  options:
    - { id: a, text: "ROUGE", explanation: "Correct. ROUGE is recall-oriented word-overlap scoring against a reference and is the standard metric for summarisation." }
    - { id: b, text: "BLEU", explanation: "Incorrect. BLEU is precision-oriented with a brevity penalty and is mainly used for translation." }
    - { id: c, text: "F1 score of a classifier", explanation: "Incorrect. F1 balances precision and recall for classification predictions, not generated text against a reference." }
    - { id: d, text: "BERTScore", explanation: "Incorrect. BERTScore compares meaning using embeddings, not word overlap." }
  answer: [a]
  explanation: "Summarisation: ROUGE (recall of the reference's words). Translation: BLEU (precision with a brevity penalty). Meaning over exact words: BERTScore (embeddings). ROUGE and BLEU count word overlap and do not recognise synonyms."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: easy

- id: q-mock-2-016
  set: mock-2
  type: single
  stem: "A company must sort 2 million short customer messages per day into six categories with a response time under 300 ms. In testing, a small model scores 94% accuracy and the largest model in the same family scores 95% at five times the cost and three times the latency. The business target is 92%. Which model should the company choose?"
  options:
    - { id: a, text: "The largest model, because it has the highest accuracy", explanation: "Incorrect. One extra point of accuracy does not justify five times the cost and higher latency when the small model already beats the target." }
    - { id: b, text: "The small model, because it meets the quality target at lower cost and latency", explanation: "Correct. The best choice is the smallest model that meets the quality, latency and cost requirements." }
    - { id: c, text: "The largest model with provisioned throughput to reduce latency", explanation: "Incorrect. Provisioned throughput guarantees capacity but adds hourly cost and does not make a larger model as cheap as a small one." }
    - { id: d, text: "A new model trained from scratch for the six categories", explanation: "Incorrect. Training from scratch is costly and unnecessary when an existing model already exceeds the target." }
  answer: [b]
  explanation: "Model selection weighs capability, latency, cost, context window, language, customisation and compliance. Bigger is not automatically better: the right model is the smallest one that meets the requirements, especially at high volume where cost and latency multiply."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: hard

- id: q-mock-2-017
  set: mock-2
  type: multi
  stem: "A healthcare company is building a RAG application on Amazon Bedrock. Traffic between its VPC and Bedrock must not cross the public internet, and the security team must be able to control, rotate and audit the encryption keys that protect the source documents in Amazon S3. Which actions meet these requirements? (Select TWO.)"
  options:
    - { id: a, text: "Create a VPC interface endpoint (AWS PrivateLink) for Amazon Bedrock", explanation: "Correct. An interface endpoint keeps traffic between the VPC and Bedrock on the AWS network, without internet access." }
    - { id: b, text: "Put AWS WAF in front of the application", explanation: "Incorrect. WAF filters HTTP requests to web applications and is out of scope for this exam; it does not create private connectivity or manage keys." }
    - { id: c, text: "Encrypt the S3 data with an AWS KMS customer managed key", explanation: "Correct. Customer managed keys give the customer control over key policies, rotation and revocation, and every use is logged in CloudTrail." }
    - { id: d, text: "Enable a Bedrock Guardrails sensitive information filter", explanation: "Incorrect. The filter masks PII in prompts and responses; it does not control network paths or encryption keys." }
    - { id: e, text: "Run Amazon Macie on the S3 bucket", explanation: "Incorrect. Macie discovers sensitive data in S3; it does not encrypt data or provide private connectivity." }
  answer: [a, c]
  explanation: "Private connectivity is VPC interface endpoints powered by AWS PrivateLink. Control, rotation and audit of encryption keys is AWS KMS with customer managed keys. Guardrails, Macie and WAF solve different problems."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: medium

- id: q-mock-2-018
  set: mock-2
  type: single
  stem: "A warehouse operator trains software to route picking robots. The software tries different routes, receives a higher score when orders are picked faster and a penalty for collisions, and improves over thousands of attempts. Which type of machine learning is this?"
  options:
    - { id: a, text: "Reinforcement learning", explanation: "Correct. An agent learns a policy by trial and error from rewards and penalties." }
    - { id: b, text: "Supervised learning", explanation: "Incorrect. Supervised learning needs labelled examples of the correct answer, not rewards from actions." }
    - { id: c, text: "Unsupervised learning", explanation: "Incorrect. Unsupervised learning finds structure in unlabelled data and does not involve rewards." }
    - { id: d, text: "Self-supervised learning", explanation: "Incorrect. Self-supervised learning creates labels from the data itself, as in foundation model pre-training." }
  answer: [a]
  explanation: "Reinforcement learning: an agent acts in an environment, receives rewards or penalties and learns a policy that maximises total reward. Supervised learning uses labels, unsupervised learning finds patterns without labels, and self-supervised learning is how foundation models pre-train."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: easy

- id: q-mock-2-019
  set: mock-2
  type: single
  stem: "A retailer's product catalogue and web application already run on Amazon Aurora PostgreSQL. The retailer wants to add semantic product search with the LEAST operational overhead and without adding a new database service. Which vector store option should it choose?"
  options:
    - { id: a, text: "Amazon Neptune", explanation: "Incorrect. Neptune is a graph database for relationship-heavy data, and it would add a new database to operate." }
    - { id: b, text: "A new Amazon OpenSearch Serverless collection", explanation: "Incorrect. OpenSearch Serverless is a strong default vector store, but it would add a new service when the data already lives in PostgreSQL." }
    - { id: c, text: "The pgvector extension in the existing Aurora PostgreSQL database", explanation: "Correct. pgvector stores and searches embeddings next to the existing relational data, with no new database to run." }
    - { id: d, text: "Amazon DocumentDB", explanation: "Incorrect. DocumentDB suits MongoDB-compatible JSON documents and would also be a new service." }
  answer: [c]
  explanation: "Choose a vector store by where the data already lives. Data in PostgreSQL: Aurora or RDS for PostgreSQL with pgvector. Search at scale: OpenSearch. Graph relationships: Neptune. JSON documents: DocumentDB. Reusing an existing database avoids new operational work."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-18#explanation
  difficulty: hard

- id: q-mock-2-020
  set: mock-2
  type: single
  stem: "A public chatbot built on Amazon Bedrock sometimes responds with insults when users deliberately provoke it. Which solution addresses this with the LEAST effort?"
  options:
    - { id: a, text: "Run an Amazon SageMaker Clarify post-training bias report", explanation: "Incorrect. Clarify measures bias and explains predictions for ML models; it does not block harmful chatbot replies." }
    - { id: b, text: "Enable Amazon SageMaker Model Monitor on the chatbot", explanation: "Incorrect. Model Monitor tracks drift for deployed SageMaker models; it does not filter generative AI responses." }
    - { id: c, text: "Retrain the foundation model with RLHF", explanation: "Incorrect. RLHF can improve alignment but is costly and slow compared with a managed filter." }
    - { id: d, text: "Apply an Amazon Bedrock guardrail with content filters for insults and hate", explanation: "Correct. Guardrails content filters block harmful categories such as insults and hate on both input and output, configured without training." }
  answer: [d]
  explanation: "Harmful or off-topic generative AI content points to Amazon Bedrock Guardrails. Clarify is for bias metrics and explanations, and Model Monitor is for drift in deployed ML models. Read the scenario for the type of problem before picking a tool."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-23#explanation
  difficulty: medium

- id: q-mock-2-021
  set: mock-2
  type: matching
  stem: "A large enterprise is planning several generative AI initiatives. Match each requirement to the AWS offering that fits it BEST."
  options:
    - { id: a, text: "Sales managers want to ask plain-English questions about company data and get dashboards, without writing code", explanation: "Amazon Quick is the agentic workspace and BI application for business users." }
    - { id: b, text: "Developers want an agentic IDE that turns requirements into specs, designs and tasks before writing code", explanation: "Kiro is the spec-driven agentic development environment for developers." }
    - { id: c, text: "The IT department wants to modernise legacy .NET and mainframe applications", explanation: "AWS Transform uses agents to migrate and modernise applications." }
    - { id: d, text: "Engineers want to run agents written in any framework in production, with session isolation, memory and identity", explanation: "Amazon Bedrock AgentCore provides secure, scalable runtime and services for agents." }
    - { id: e, text: "Engineers want an open-source SDK to write an agent in a few lines of Python", explanation: "Strands Agents is AWS's open-source SDK for building agents in code." }
  matchTargets:
