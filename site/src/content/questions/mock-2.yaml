  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: hard

- id: q-mock-2-033
  set: mock-2
  type: single
  stem: "A marketing team needs a model that creates product images from text descriptions by starting from random noise and refining it step by step. Which type of model is this?"
  options:
    - { id: a, text: "A recurrent neural network (RNN)", explanation: "Incorrect. RNNs process sequences one step at a time and are not the standard image generators." }
    - { id: b, text: "A diffusion model", explanation: "Correct. Diffusion models generate images by repeatedly removing noise, guided by a text prompt." }
    - { id: c, text: "An embedding model", explanation: "Incorrect. Embedding models output vectors that represent meaning; they do not generate images." }
    - { id: d, text: "A k-means clustering model", explanation: "Incorrect. k-means groups unlabelled data and does not generate content." }
  answer: [b]
  explanation: "Diffusion models learn to reverse a noising process. At generation time they start from noise and remove it step by step under the guidance of a prompt, producing images such as those from Stability AI models in Amazon Bedrock."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: easy

- id: q-mock-2-034
  set: mock-2
  type: single
  stem: "A RAG assistant often gives incomplete answers. Investigation shows that the retrieved chunks rarely contain the needed facts, even though the facts exist in the source documents. Where should the team focus its evaluation and improvement effort FIRST?"
  options:
    - { id: a, text: "Fine-tune the generation model on more question–answer pairs", explanation: "Incorrect. The generator cannot use facts it never receives; the failure happens before generation." }
    - { id: b, text: "Lower the temperature of the generation model", explanation: "Incorrect. Temperature affects randomness, not whether the right content was retrieved." }
    - { id: c, text: "Measure retrieval quality, such as context relevance and coverage, and adjust chunking and embeddings", explanation: "Correct. The retrieval step is failing, so evaluate it separately and tune chunking, embeddings or the number of results." }
    - { id: d, text: "Add more Bedrock Guardrails denied topics", explanation: "Incorrect. Denied topics block subjects; they do not help find missing facts." }
  answer: [c]
  explanation: "Evaluate RAG in two parts. Retrieval: did we fetch the right, complete context (context relevance, coverage)? Generation: is the answer faithful and correct with citations? Here the facts are missing from the retrieved context, so fix retrieval first."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: hard

- id: q-mock-2-035
  set: mock-2
  type: single
  stem: "A company wants to use an open-weight foundation model. It must choose the GPU instance type, customise the serving container and keep the model running in its own account. Which approach meets these requirements?"
  options:
    - { id: a, text: "Deploy the model from Amazon SageMaker JumpStart to a SageMaker AI endpoint", explanation: "Correct. Self-hosting on a SageMaker AI endpoint gives control over instance types, containers and the deployment in the company's account." }
    - { id: b, text: "Call the model through Amazon Bedrock on-demand inference", explanation: "Incorrect. Bedrock is a managed API: it removes infrastructure work but does not let you choose instances or containers." }
    - { id: c, text: "Use Amazon Quick", explanation: "Incorrect. Amazon Quick is a ready-made workspace for business users, not a way to host models." }
    - { id: d, text: "Use Kiro", explanation: "Incorrect. Kiro is an agentic development environment for writing software, not a model-hosting service." }
  answer: [a]
  explanation: "Models can be used through a managed API (Amazon Bedrock: no servers, pay per token) or self-hosted (SageMaker AI endpoints, often via JumpStart: full control over instances and containers, more operational responsibility)."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-mock-2-036
  set: mock-2
  type: single
  stem: "A voice assistant understands American speakers well but often fails for speakers with Scottish and Nigerian accents. Almost all of its training audio came from speakers in the United States. Which type of bias does this MOST likely show?"
  options:
    - { id: a, text: "Historical bias", explanation: "Incorrect. Historical bias comes from data that reflects past unfair decisions, not from a group missing from the data." }
    - { id: b, text: "Sampling bias", explanation: "Correct. The training data under-represents some groups, so the model performs worse for them." }
    - { id: c, text: "High variance caused by too many epochs", explanation: "Incorrect. Overfitting shows a gap between training and test data overall; this failure is linked to specific groups missing from the data." }
    - { id: d, text: "Data drift", explanation: "Incorrect. Drift is a change in production data over time; this gap was present from the start." }
  answer: [b]
  explanation: "Sampling bias happens when the training data does not represent all the people the system will serve. The fix is more inclusive, diverse and balanced data plus per-group evaluation. Overall averages can hide poor performance for small groups."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-22#explanation
  difficulty: medium

- id: q-mock-2-037
  set: mock-2
  type: single
  stem: "A publisher needs summaries of 2 million archived articles for a new search feature. The summaries are needed by next week, and no user waits for an individual response. Which Amazon Bedrock option is MOST cost-effective?"
  options:
    - { id: a, text: "On-demand inference called in a loop from a script", explanation: "Incorrect. On-demand works, but batch processing of the same job is priced at a discount." }
    - { id: b, text: "Provisioned throughput with a six-month commitment", explanation: "Incorrect. A long commitment for a one-off job would leave capacity paid for and idle afterwards." }
    - { id: c, text: "A SageMaker AI real-time endpoint running all week", explanation: "Incorrect. A real-time endpoint is designed for low-latency requests and adds hosting and operations cost." }
    - { id: d, text: "Bedrock batch inference with the prompts in a JSONL file in Amazon S3", explanation: "Correct. Batch inference processes large offline jobs at a discounted per-token price and writes the results to S3." }
  answer: [d]
  explanation: "Large dataset, results not needed immediately, lowest cost: batch inference. On-demand suits interactive or unpredictable traffic, and provisioned throughput suits steady, high-volume or guaranteed capacity needs."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-13#explanation
  difficulty: medium

- id: q-mock-2-038
  set: mock-2
  type: multi
  stem: "A legal-tech team's prompt for extracting termination clauses from contracts returns long, inconsistent answers, and sometimes the model treats contract text as instructions. Which prompt changes will MOST likely improve the results? (Select TWO.)"
  options:
    - { id: a, text: "Ask the model to be as creative as possible", explanation: "Incorrect. Extraction needs faithful, consistent output, not creativity." }
    - { id: b, text: "State the task clearly and specify the exact output format (output indicator)", explanation: "Correct. A precise instruction and a defined output format reduce rambling and inconsistent answers." }
    - { id: c, text: "Increase the temperature to 1.0", explanation: "Incorrect. Higher temperature increases randomness and inconsistency." }
    - { id: d, text: "Wrap the contract text in delimiters such as XML tags to separate it from the instructions", explanation: "Correct. Delimiters show the model which part is data and help prevent contract text being read as instructions." }
    - { id: e, text: "Remove all context about the type of document", explanation: "Incorrect. Context helps the model understand the task; removing it usually makes results worse." }
  answer: [b, d]
  explanation: "Strong prompts contain an instruction, context, input data and an output indicator. Separating input data with delimiters improves both clarity and safety. Low temperature suits extraction tasks."
  domain: D3
  taskStatement: "3.2"
  lessonRef: day-16#explanation
  difficulty: medium

- id: q-mock-2-039
  set: mock-2
  type: multi
  stem: "A logistics company collects three kinds of data: GPS positions recorded every 10 seconds for each truck, photos of signed delivery receipts, and drivers' free-text notes. Which statements about this data are correct? (Select TWO.)"
  options:
    - { id: a, text: "The drivers' notes are structured tabular data", explanation: "Incorrect. Free text is unstructured data." }
    - { id: b, text: "The GPS positions are time-series data", explanation: "Correct. They are measurements recorded in order over time, which is time-series data." }
    - { id: c, text: "The receipt photos are unstructured data", explanation: "Correct. Images have no predefined rows and columns, so they are unstructured." }
    - { id: d, text: "All three datasets are labelled because they were collected automatically", explanation: "Incorrect. Data is labelled only if it includes the answer the model should predict; automatic collection does not create labels." }
    - { id: e, text: "The GPS positions are unstructured data", explanation: "Incorrect. Timestamped coordinates fit naturally into a structured table." }
  answer: [b, c]
  explanation: "Structured data (tabular, time-series) fits rows and columns. Unstructured data (text, images, audio, video) does not. Labelled data includes the target value. Recognising the data type helps you choose the technique and service."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: medium

- id: q-mock-2-040
  set: mock-2
  type: single
  stem: "An agent hosted on Amazon Bedrock AgentCore must read and update each user's third-party calendar on that user's behalf through OAuth, without storing user tokens in the agent's code. Which AgentCore capability provides this?"
  options:
    - { id: a, text: "AgentCore Identity", explanation: "Correct. AgentCore Identity gives agents their own identity and manages access to AWS and third-party services, such as OAuth tokens, on behalf of users." }
    - { id: b, text: "Policy in AgentCore", explanation: "Incorrect. Policy defines which tools an agent may use and under what conditions; it does not manage user credentials." }
    - { id: c, text: "AgentCore Gateway", explanation: "Incorrect. Gateway turns APIs and Lambda functions into MCP tools; it does not act on behalf of users with their OAuth tokens." }
    - { id: d, text: "AgentCore Memory", explanation: "Incorrect. Memory stores conversation and long-term facts, not access credentials." }
  answer: [a]
  explanation: "AgentCore Identity handles who the agent is and how it accesses resources for users (for example OAuth). Policy in AgentCore enforces rules on tool use outside the agent's reasoning. Gateway exposes tools through MCP, and Memory keeps context."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: hard

- id: q-mock-2-041
  set: mock-2
  type: ordering
  stem: "A bank wants a specialist assistant that understands banking terminology and follows the bank's answer format. Place these customisation steps in the most appropriate order, from first to last."
  options:
    - { id: a, text: "Fine-tune the model on labelled prompt–response pairs in the bank's answer format", explanation: "Third: once the model understands the language, labelled examples teach the specific task and format." }
    - { id: b, text: "Curate and govern the data: remove PII, check consent and lineage, and balance sources", explanation: "First: every later step depends on clean, governed, representative data." }
    - { id: c, text: "Evaluate the customised model on a held-out, representative test set", explanation: "Last: the result must be measured before deployment." }
    - { id: d, text: "Run continued pre-training on unlabelled banking documents", explanation: "Second: unlabelled domain text teaches the model the field's vocabulary." }
  answer: [b, d, a, c]
  explanation: "Customisation starts with data preparation (curation, governance, labelling, representativeness). Continued pre-training on unlabelled domain text adapts the model to the domain, fine-tuning on labelled pairs teaches the task and format, and evaluation on held-out data confirms the result."
  domain: D3
  taskStatement: "3.3"
  lessonRef: day-19#explanation
  difficulty: hard

- id: q-mock-2-042
  set: mock-2
  type: single
  stem: "An online retailer has launched a generative AI shopping assistant. Leadership asks whether the assistant is actually increasing sales. Which metric answers this question MOST directly?"
  options:
    - { id: a, text: "The ROUGE score of the assistant's answers", explanation: "Incorrect. ROUGE measures text overlap with references, which is a model metric rather than a business outcome." }
    - { id: b, text: "Conversion rate of sessions that use the assistant compared with a baseline", explanation: "Correct. Conversion rate against a baseline directly measures whether the assistant turns more visitors into buyers." }
    - { id: c, text: "Average response latency", explanation: "Incorrect. Latency matters for user experience but does not show whether sales increased." }
    - { id: d, text: "Number of tokens processed per day", explanation: "Incorrect. Token volume measures usage and cost, not business value." }
  answer: [b]
  explanation: "Business value needs business metrics such as conversion rate, ARPU, customer lifetime value, efficiency or cost per interaction, measured against a baseline. Model metrics such as ROUGE or latency describe the model, not the outcome."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: easy

- id: q-mock-2-043
  set: mock-2
  type: multi
  stem: "A company wants to reduce the environmental impact of its generative AI document classifier without an unacceptable loss of accuracy. Which actions support this goal? (Select TWO.)"
  options:
    - { id: a, text: "Always choose the largest available model", explanation: "Incorrect. Larger models use more compute; choose the smallest model that meets the requirement." }
    - { id: b, text: "Keep a large endpoint running 24 hours a day to absorb possible spikes", explanation: "Incorrect. Idle capacity uses energy and money for no benefit." }
    - { id: c, text: "Use the smallest model that meets the accuracy target, for example a distilled model", explanation: "Correct. Smaller models need less compute and energy for every request." }
    - { id: d, text: "Retrain the model from scratch every month", explanation: "Incorrect. Frequent training from scratch uses a lot of compute; retrain only when monitoring shows it is needed." }
    - { id: e, text: "Run the workload on energy-efficient hardware such as AWS Inferentia or Graviton", explanation: "Correct. Purpose-built, efficient hardware lowers energy use per inference." }
  answer: [c, e]
  explanation: "Responsible model selection includes sustainability. Choose the smallest suitable model (or distil one), use efficient hardware such as Inferentia, Trainium and Graviton, and avoid idle endpoints. These choices usually cut cost as well."
