  taskStatement: "5.2"
  lessonRef: day-27#explanation
  difficulty: hard

- id: q-mock-2-047
  set: mock-2
  type: single
  stem: "A company has 6 AI applications and 10 internal tools. Today each application has its own custom integration for each tool, which means 60 integrations to maintain. Which approach would MOST reduce this integration effort?"
  options:
    - { id: a, text: "Expose each tool once through a Model Context Protocol (MCP) server and use MCP clients in the applications", explanation: "Correct. MCP is an open standard: each tool is wrapped once and every MCP-compatible application can use it, turning M × N integrations into M + N." }
    - { id: b, text: "Fine-tune each application's model on the tools' documentation", explanation: "Incorrect. Fine-tuning does not create integrations; something must still call the tools." }
    - { id: c, text: "Choose models with larger context windows", explanation: "Incorrect. Context size does not change how applications connect to tools." }
    - { id: d, text: "Build a RAG knowledge base over the tools' API documentation", explanation: "Incorrect. RAG retrieves information but does not let applications call the tools." }
  answer: [a]
  explanation: "The Model Context Protocol standardises how AI applications (hosts with MCP clients) connect to tools, resources and prompts exposed by MCP servers. Each side implements MCP once, so 6 + 10 = 16 integrations replace 6 × 10 = 60."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-10#explanation
  difficulty: hard

- id: q-mock-2-048
  set: mock-2
  type: multi
  stem: "A company must assess the helpfulness and tone of its support chatbot across 20,000 conversations every week. Having people review every conversation is too expensive, but the results must still be trustworthy. Which approaches should the company combine? (Select TWO.)"
  options:
    - { id: a, text: "Use LLM-as-a-judge in Amazon Bedrock Model Evaluation to score helpfulness and tone at scale", explanation: "Correct. A judge model can score subjective qualities across thousands of conversations without human reviewers." }
    - { id: b, text: "Regularly compare the judge's scores with human ratings on a sample of conversations", explanation: "Correct. Calibrating against people on a sample confirms that the automated judge is trustworthy." }
    - { id: c, text: "Score every conversation with BLEU against a single reference answer", explanation: "Incorrect. BLEU counts word overlap for translation-style tasks and cannot judge helpfulness or tone." }
    - { id: d, text: "Rely only on public benchmark leaderboards", explanation: "Incorrect. Benchmarks compare models on standard tasks, not this chatbot's real conversations." }
    - { id: e, text: "Measure only average response latency", explanation: "Incorrect. Latency says nothing about helpfulness or tone." }
  answer: [a, b]
  explanation: "LLM-as-a-judge evaluates subjective qualities at scale and should be calibrated against human judgement on a sample. Reference-based metrics and public benchmarks cannot measure helpfulness on your own traffic."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-mock-2-049
  set: mock-2
  type: single
  stem: "A government tax office wants to calculate the tax each citizen owes from reported income using published tax brackets. Every result must be exact and fully auditable. Which approach is MOST appropriate?"
  options:
    - { id: a, text: "Implement the brackets as deterministic business rules instead of using ML", explanation: "Correct. When a fixed rule gives the exact answer, ML adds cost and uncertainty without benefit." }
    - { id: b, text: "Train a regression model on past tax returns", explanation: "Incorrect. A regression model gives an estimate with error, but the result must be exact." }
    - { id: c, text: "Ask a foundation model to calculate the tax with chain-of-thought prompting", explanation: "Incorrect. Generative models are nondeterministic and can make arithmetic mistakes." }
    - { id: d, text: "Cluster citizens by income and apply the average tax of each cluster", explanation: "Incorrect. Cluster averages would give inexact, unfair results." }
  answer: [a]
  explanation: "AI and ML are not appropriate when a deterministic, rule-based answer is required, or when the cost outweighs the benefit. Use ML for patterns too complex to write as rules, not for calculations that are already precisely defined."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: medium

- id: q-mock-2-050
  set: mock-2
  type: single
  stem: "A payments company is preparing public documentation for its fraud detection model. An engineer proposes publishing the exact features, weights and score thresholds on the company website. What is the MOST appropriate response?"
  options:
    - { id: a, text: "Publish everything, because transparency always outweighs other concerns", explanation: "Incorrect. Full public detail would help fraudsters learn how to avoid detection, which harms safety." }
    - { id: b, text: "Publish nothing about the model", explanation: "Incorrect. Users and regulators still deserve to know how AI is used and how decisions can be challenged." }
    - { id: c, text: "Switch to a more opaque model so nobody can work out how it decides", explanation: "Incorrect. Reducing explainability does not solve the disclosure question and makes governance harder." }
    - { id: d, text: "Publish a general explanation for the public and share full details with regulators and auditors under controlled access", explanation: "Correct. Tailoring disclosure balances transparency with safety while keeping full accountability." }
  answer: [d]
  explanation: "Transparency and safety can conflict: too much detail can help attackers game or misuse a model. The usual answer is tailored disclosure, with general information for the public and full details for those with an oversight role."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#explanation
  difficulty: medium

- id: q-mock-2-051
  set: mock-2
  type: multi
  stem: "A bank's CISO is reviewing whether to use Amazon Bedrock with customer data. Which statements are correct? (Select TWO.)"
  options:
    - { id: a, text: "The bank remains responsible for IAM permissions, its data and how model outputs are used", explanation: "Correct. Under shared responsibility, AWS secures the service and the customer secures access, data and use." }
    - { id: b, text: "AWS is responsible for writing the bank's IAM policies", explanation: "Incorrect. IAM configuration is the customer's responsibility." }
    - { id: c, text: "Bedrock does not use customer prompts or responses to train its base models and does not share them with model providers", explanation: "Correct. Customer data stays private to the customer's account and is not used to improve base models." }
    - { id: d, text: "Model providers can read prompts to improve their models", explanation: "Incorrect. Bedrock does not share prompts or responses with model providers." }
    - { id: e, text: "Using Bedrock automatically makes the bank compliant with every regulation", explanation: "Incorrect. AWS compliance programmes cover AWS's side; the bank must still meet its own obligations." }
  answer: [a, c]
  explanation: "AWS generative AI services provide security, privacy and compliance support: Bedrock keeps customer data private and does not use it to train base models. Shared responsibility still applies, so the customer owns identities, data, configuration and how outputs are used."
  domain: D2
  taskStatement: "2.3"
  lessonRef: day-12#explanation
  difficulty: medium

- id: q-mock-2-052
  set: mock-2
  type: single
  stem: "Several teams copy prompts into application code by hand. A recent edit broke production, and nobody could tell which version had worked before. The teams want to store prompts with variables, compare variants, keep versions and roll back. Which AWS capability should they use?"
  options:
    - { id: a, text: "Amazon Bedrock Knowledge Bases", explanation: "Incorrect. Knowledge Bases retrieve documents for RAG; they do not version prompts." }
    - { id: b, text: "Amazon Bedrock Guardrails", explanation: "Incorrect. Guardrails filter content in prompts and responses; they do not manage prompt versions." }
    - { id: c, text: "Amazon Bedrock Prompt Management", explanation: "Correct. Prompt Management stores prompt templates with variables, lets you compare variants and creates versions you can deploy and roll back." }
    - { id: d, text: "Amazon SageMaker Model Registry", explanation: "Incorrect. Model Registry versions ML models, not prompts." }
  answer: [c]
  explanation: "Amazon Bedrock Prompt Management treats prompts as managed assets: templates with variables, model and inference settings, side-by-side comparison and immutable versions. Model Registry is the equivalent for ML models, not prompts."
