- id: q-mock-2-064
  set: mock-2
  type: single
  stem: "A product team wants to use an open-weight model, freely downloadable from a model hub, inside a paid commercial product. What should the team do before using it?"
  options:
    - { id: a, text: "Nothing, because downloadable weights can be used without restrictions", explanation: "Incorrect. Open weights do not mean unrestricted use; licences can limit commercial use or require attribution." }
    - { id: b, text: "Review the model's licence for commercial-use terms, attribution and restrictions", explanation: "Correct. Licence terms decide whether and how the model may be used commercially." }
    - { id: c, text: "Create a SageMaker Model Card, which grants the right to use the model", explanation: "Incorrect. Model Cards document a model; they do not grant legal rights." }
    - { id: d, text: "Download the model licence from AWS Artifact", explanation: "Incorrect. Artifact provides AWS's compliance reports and agreements, not third-party model licences." }
  answer: [b]
  explanation: "Open models increase transparency, but open weights are not the same as open training data or unrestricted use. Always check the licence for commercial use, attribution and acceptable-use restrictions."
