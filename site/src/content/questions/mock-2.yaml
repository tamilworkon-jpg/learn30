  difficulty: medium

- id: q-mock-2-032
  set: mock-2
  type: single
  stem: "Before ingesting 3 TB of documents from many Amazon S3 buckets into a knowledge base, the security team must find which objects contain credit card numbers and passport numbers. Which service should the team use?"
  options:
    - { id: a, text: "Amazon Bedrock Guardrails sensitive information filters", explanation: "Incorrect. These filters mask or block PII in prompts and responses at run time; they do not scan S3 buckets." }
