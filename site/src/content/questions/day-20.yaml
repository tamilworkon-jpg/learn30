- id: q-day-20-001
  set: day-20
  type: single
  stem: "A news company has human-written reference summaries for 500 articles. It wants an automatic metric that measures how much of each reference summary's content is captured by a model's summary. Which metric is MOST appropriate?"
  options:
    - { id: a, text: "ROUGE", explanation: "Correct. ROUGE is recall-oriented: it measures how much of the reference text's n-grams appear in the generated text, which makes it the classic summarisation metric." }
    - { id: b, text: "BLEU", explanation: "Incorrect. BLEU is precision-oriented with a brevity penalty and is the classic metric for machine translation." }
    - { id: c, text: "Perplexity", explanation: "Incorrect. Perplexity measures how surprised a language model is by text; it does not compare a summary with a reference." }
    - { id: d, text: "Cost per interaction", explanation: "Incorrect. Cost per interaction is a business metric, not a measure of summary content." }
  answer: [a]
  explanation: "ROUGE (Recall-Oriented Understudy for Gisting Evaluation) counts overlapping n-grams (ROUGE-N) or the longest common subsequence (ROUGE-L) between generated text and a reference. Because it focuses on recall of the reference, it is the standard metric for summarisation."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: easy

- id: q-day-20-002
  set: day-20
  type: single
  stem: "A company is comparing two machine translation models from English to German using professional reference translations. Which automatic metric was originally designed for this kind of task?"
  options:
    - { id: a, text: "ROUGE", explanation: "Incorrect. ROUGE is recall-oriented and is mainly used for summarisation." }
    - { id: b, text: "Task completion rate", explanation: "Incorrect. Task completion rate measures whether users or agents achieve a goal, not translation quality against references." }
    - { id: c, text: "BLEU", explanation: "Correct. BLEU measures the precision of the generated text's n-grams against reference translations, with a brevity penalty, and is the classic translation metric." }
    - { id: d, text: "F1 score for classification", explanation: "Incorrect. F1 combines precision and recall for classification labels, not for comparing generated sentences with references." }
  answer: [c]
  explanation: "BLEU (Bilingual Evaluation Understudy) checks how many n-grams of the generated output appear in one or more references and penalises outputs that are too short. Like ROUGE, it counts exact word overlap."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: easy

- id: q-day-20-003
  set: day-20
  type: single
  stem: "A model's answers are accurate paraphrases of the reference answers, for example 'The automobile is quick' for 'The car is fast', yet they receive low ROUGE scores. Which metric would better reflect their quality?"
  options:
    - { id: a, text: "BLEU", explanation: "Incorrect. BLEU also counts exact n-gram overlap, so it would also penalise paraphrases." }
    - { id: b, text: "ROUGE-2", explanation: "Incorrect. ROUGE-2 counts overlapping word pairs, which paraphrases rarely share." }
    - { id: c, text: "Perplexity", explanation: "Incorrect. Perplexity does not compare the answer with a reference meaning." }
    - { id: d, text: "BERTScore", explanation: "Correct. BERTScore compares contextual embeddings of the generated and reference text, so paraphrases with the same meaning score well." }
  answer: [d]
  explanation: "ROUGE and BLEU measure exact word overlap and miss synonyms and paraphrases. BERTScore uses embeddings from a BERT-style model to measure semantic similarity, which suits tasks where wording can vary but meaning must match."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-day-20-004
  set: day-20
  type: single
  stem: "A hospital wants clinicians to judge whether discharge summaries generated by two candidate models are medically accurate. Which Amazon Bedrock Model Evaluation option fits this requirement?"
  options:
    - { id: a, text: "An automatic evaluation using the built-in toxicity metric", explanation: "Incorrect. Toxicity scoring checks for harmful language, not clinical accuracy." }
    - { id: b, text: "A human evaluation job using the hospital's own work team of clinicians", explanation: "Correct. Human evaluation with your own work team lets experts rate outputs on metrics you define, which is right for expert, high-stakes judgement." }
    - { id: c, text: "A BLEU score against a single reference summary", explanation: "Incorrect. BLEU counts word overlap and cannot judge whether medical content is accurate." }
    - { id: d, text: "A public benchmark such as MMLU", explanation: "Incorrect. A general benchmark compares models on standard tasks, not on the hospital's own discharge summaries." }
  answer: [b]
  explanation: "Human evaluation remains the gold standard for subjective or expert qualities. Amazon Bedrock supports human evaluation jobs with your own work team, custom metrics and rating methods such as Likert scales or side-by-side comparison."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: easy

- id: q-day-20-005
  set: day-20
  type: single
  stem: "A team must score 20,000 chatbot replies for helpfulness and coherence overnight. There are no reference answers, and human reviewers are available only for a small sample. Which approach BEST fits?"
  options:
    - { id: a, text: "LLM-as-a-judge with a scoring rubric, calibrated against a human-rated sample", explanation: "Correct. A judge model scales to large volumes, scores subjective qualities without references and can be checked against human ratings." }
    - { id: b, text: "ROUGE scores against reference answers", explanation: "Incorrect. ROUGE requires reference answers, which the team does not have, and does not measure helpfulness." }
    - { id: c, text: "Human evaluation of all 20,000 replies by the available reviewers", explanation: "Incorrect. Human evaluation is slow and costly and cannot cover 20,000 replies overnight with a small team." }
    - { id: d, text: "Measuring the model's position on a public leaderboard", explanation: "Incorrect. Leaderboard positions do not score these specific replies." }
  answer: [a]
  explanation: "LLM-as-a-judge uses a strong foundation model with a rubric to score responses for qualities such as helpfulness, coherence and correctness. It is fast and cheap at scale; calibrating it against human ratings on a sample checks that it agrees with people."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-day-20-006
  set: day-20
  type: multi
  stem: "A team plans to rely on LLM-as-a-judge to evaluate its assistant. Which statements about this approach are correct? (Select TWO.)"
  options:
    - { id: a, text: "The judge model can be biased, for example by preferring longer answers or the answer shown first", explanation: "Correct. Judge models have known biases such as verbosity and position bias, and can simply be wrong." }
    - { id: b, text: "Humans should score a sample so the team can check that the judge agrees with people", explanation: "Correct. Calibrating the judge against human ratings is the standard way to trust its scores." }
    - { id: c, text: "LLM-as-a-judge always requires a human-written reference answer for every prompt", explanation: "Incorrect. A reference can be provided but is optional; the judge can score against a rubric alone." }
    - { id: d, text: "LLM-as-a-judge can only measure exact word overlap", explanation: "Incorrect. Exact overlap is what ROUGE and BLEU measure; a judge model can score subjective qualities such as helpfulness." }
    - { id: e, text: "LLM-as-a-judge removes any need for business metrics", explanation: "Incorrect. Quality scores do not show whether the application meets business objectives such as task completion or cost." }
  answer: [a, b]
  explanation: "LLM-as-a-judge scales well and scores subjective qualities with explanations, but judges can be biased or wrong. Teams calibrate the judge against human-rated samples and still track business alignment metrics."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-day-20-007
  set: day-20
  type: single
  stem: "A model tops a public leaderboard for general reasoning, but in a pilot it performs poorly on the company's insurance claim emails, which use regional jargon. What should the company do to evaluate candidate models more reliably for this use case?"
  options:
    - { id: a, text: "Choose the next model on the leaderboard", explanation: "Incorrect. The leaderboard measures general tasks, so the next model may share the same weakness on this specific use case." }
    - { id: b, text: "Increase the temperature during the pilot", explanation: "Incorrect. Temperature changes randomness; it does not make the evaluation more representative." }
    - { id: c, text: "Build its own evaluation dataset of representative claim emails with reference answers and edge cases", explanation: "Correct. A representative golden dataset measures fitness for the company's own task and becomes the yardstick for every change." }
    - { id: d, text: "Evaluate only with BLEU on the public benchmark", explanation: "Incorrect. A public benchmark still does not represent the company's emails, and BLEU is a translation metric." }
  answer: [c]
  explanation: "Benchmarks are useful for shortlisting models, but they may not reflect your domain, language or style and may be inflated by data contamination. Your own representative evaluation dataset shows whether a model fits your use case."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-day-20-008
  set: day-20
  type: single
  stem: "A RAG evaluation of an Amazon Bedrock knowledge base shows high faithfulness (answers stick to the retrieved context) but low context coverage (retrieved chunks often miss part of the needed information). What should the team change FIRST?"
  options:
    - { id: a, text: "Replace the foundation model with a larger one", explanation: "Incorrect. Generation is already faithful; a larger model cannot answer from information that was never retrieved." }
    - { id: b, text: "Improve retrieval, for example with hierarchical chunking, more retrieved chunks or a reranker", explanation: "Correct. Low coverage is a retrieval problem, so fix chunking, the number of results, filters or reranking." }
    - { id: c, text: "Lower the temperature of the generation step", explanation: "Incorrect. Temperature affects generation randomness, not which chunks are retrieved." }
    - { id: d, text: "Remove citations from the answers", explanation: "Incorrect. Citations help users verify answers and do not affect retrieval coverage." }
  answer: [b]
  explanation: "Evaluate RAG in two halves. Retrieval metrics (context relevance and coverage) show whether the right chunks were fetched; generation metrics (faithfulness, correctness, citation quality) show whether the answer used them well. The weak half tells you what to fix."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#examples
  difficulty: medium

- id: q-day-20-009
  set: day-20
  type: matching
  stem: "Match each evaluation need to the Amazon Bedrock evaluation type that fits it BEST."
  options:
    - { id: a, text: "Measure accuracy, robustness and toxicity on a built-in curated dataset", explanation: "Automatic programmatic evaluation fits because it computes built-in metrics on curated or custom prompt datasets." }
    - { id: b, text: "Have the company's brand team rate responses on brand voice using a Likert scale", explanation: "Human evaluation fits because your own work team rates outputs on metrics you define." }
    - { id: c, text: "Score thousands of responses for helpfulness and completeness using another model", explanation: "LLM-as-a-judge fits because an evaluator model scores quality metrics at scale." }
    - { id: d, text: "Check whether a knowledge base retrieves relevant context and gives faithful, cited answers", explanation: "RAG evaluation fits because it scores retrieval and retrieve-and-generate quality for knowledge bases." }
  matchTargets:
    - { id: t1, text: "LLM-as-a-judge evaluation" }
    - { id: t2, text: "RAG evaluation" }
    - { id: t3, text: "Automatic programmatic evaluation" }
    - { id: t4, text: "Human evaluation with your own work team" }
  answer: { a: t3, b: t4, c: t1, d: t2 }
  explanation: "Amazon Bedrock Model Evaluation offers automatic programmatic jobs (built-in metrics and datasets), human jobs (your own reviewers), LLM-as-a-judge jobs (an evaluator model scores quality and responsible-AI metrics) and RAG evaluations of knowledge bases. Results are stored in Amazon S3."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-day-20-010
  set: day-20
  type: single
  stem: "The reference summary is 'Profits rose 10% thanks to strong sales in Asia.' A model outputs only 'Profits rose 10%.' How would ROUGE and BLEU MOST likely judge this output?"
  options:
    - { id: a, text: "High ROUGE because it is concise, low BLEU because it misses words", explanation: "Incorrect. ROUGE rewards covering the reference, so missing half the reference lowers ROUGE, not raises it." }
    - { id: b, text: "Both scores are perfect because every output word is correct", explanation: "Incorrect. ROUGE also considers how much of the reference is covered, and BLEU applies a brevity penalty." }
    - { id: c, text: "Both scores are zero because the sentences are different lengths", explanation: "Incorrect. The output shares several n-grams with the reference, so neither score is zero." }
    - { id: d, text: "Low ROUGE because much of the reference is missing; its n-gram precision is high, but BLEU's brevity penalty reduces the BLEU score", explanation: "Correct. ROUGE is recall-oriented, so missing content hurts it; the output's words all appear in the reference, but BLEU penalises very short outputs." }
  answer: [d]
  explanation: "ROUGE asks 'how much of the reference did you cover?' and BLEU asks 'how much of what you wrote is in the reference?', with a brevity penalty so that very short outputs cannot score highly by saying almost nothing."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#examples
  difficulty: hard

- id: q-day-20-011
  set: day-20
  type: single
  stem: "A company wants to compare several foundation models on Amazon Bedrock for a summarisation task with the LEAST effort, without building its own evaluation tooling. Which option should it use?"
  options:
    - { id: a, text: "Amazon Bedrock Model Evaluation", explanation: "Correct. Bedrock Model Evaluation runs automatic, human, LLM-as-a-judge and RAG evaluation jobs and stores the results in S3." }
    - { id: b, text: "Amazon Bedrock Knowledge Bases", explanation: "Incorrect. Knowledge Bases provides managed RAG; it can be evaluated, but it is not the evaluation tool itself." }
    - { id: c, text: "Amazon Transcribe", explanation: "Incorrect. Transcribe converts speech to text." }
    - { id: d, text: "AWS Glue DataBrew", explanation: "Incorrect. DataBrew prepares data visually; it does not evaluate foundation models." }
  answer: [a]
  explanation: "Amazon Bedrock Model Evaluation (Evaluations in the console) lets you evaluate and compare models and RAG setups with built-in metrics and datasets, your own prompt datasets, human reviewers or a judge model, all without custom tooling."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#exam-tips
  difficulty: easy

- id: q-day-20-012
  set: day-20
  type: ordering
  stem: "Place these steps for evaluating a new generative AI assistant in the most appropriate order, from first to last."
  options:
    - { id: a, text: "Run an A/B test that sends a portion of real traffic to the assistant and compare business metrics", explanation: "This is the last step: online evaluation with real users after offline checks pass." }
    - { id: b, text: "Agree on measurable success criteria such as task completion, satisfaction and cost per conversation", explanation: "This is the first step: success criteria must be defined before building and evaluating." }
    - { id: c, text: "Run offline evaluation jobs, such as automatic and LLM-as-a-judge scoring, on the dataset", explanation: "This is the third step: automated evaluation needs the dataset to exist." }
    - { id: d, text: "Build a representative golden dataset of real prompts, reference answers and edge cases", explanation: "This is the second step: the dataset reflects the success criteria and real users." }
    - { id: e, text: "Have domain experts review a sample of outputs and check the judge's scores against theirs", explanation: "This is the fourth step: human review of a sample calibrates automated results before going live." }
  answer: [b, d, c, e, a]
  explanation: "Start with agreed business success criteria, build a representative golden dataset, run automated offline evaluations, confirm with human review of a sample, then evaluate online with an A/B test and keep monitoring."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#real-world
  difficulty: medium

- id: q-day-20-013
  set: day-20
  type: single
  stem: "An airline's booking agent produces polite, well-written replies, but managers want to know how often customers' booking changes are actually completed without a human. Which metric answers this question MOST directly?"
  options:
    - { id: a, text: "BERTScore against reference replies", explanation: "Incorrect. BERTScore measures semantic similarity to a reference, not whether the booking was changed." }
    - { id: b, text: "Average response length", explanation: "Incorrect. Length says nothing about whether the goal was achieved." }
    - { id: c, text: "Task completion (goal success) rate", explanation: "Correct. Task completion rate measures the share of conversations in which the user's goal is achieved without escalation." }
    - { id: d, text: "Toxicity score", explanation: "Incorrect. Toxicity measures harmful content, not goal achievement." }
  answer: [c]
  explanation: "For agents, the final reply is not enough. Task completion rate shows whether the agent achieved the user's goal, and it doubles as a business alignment metric alongside satisfaction and cost per interaction."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-day-20-014
  set: day-20
  type: multi
  stem: "Leadership asks whether a customer-service assistant is meeting its business objectives. Which metrics are MOST relevant? (Select THREE.)"
  options:
    - { id: a, text: "Task completion rate", explanation: "Correct. It shows how often customers' goals are achieved without escalation." }
    - { id: b, text: "User satisfaction, such as CSAT or thumbs-up rate", explanation: "Correct. Satisfaction shows whether customers find the assistant useful." }
    - { id: c, text: "Cost per interaction", explanation: "Correct. It captures model, retrieval, infrastructure and escalation costs per conversation, which decides whether the assistant is worth running." }
    - { id: d, text: "ROUGE-L score on a summarisation benchmark", explanation: "Incorrect. ROUGE-L is a technical text-overlap metric and does not show business value." }
    - { id: e, text: "The model's number of parameters", explanation: "Incorrect. Model size says nothing about whether business goals are met." }
    - { id: f, text: "Perplexity on a public text corpus", explanation: "Incorrect. Perplexity measures language-modelling fit, not business outcomes." }
  answer: [a, b, c]
  explanation: "Business alignment metrics connect the application to its objectives: task completion, user satisfaction, cost per interaction, latency and KPIs such as handling time, deflection or conversion. Technical metrics such as ROUGE matter only if they move these numbers."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-day-20-015
  set: day-20
  type: single
  stem: "For a high-volume FAQ assistant, Model X scores slightly higher than Model Y on an LLM-judge correctness metric. Model Y is 60% cheaper and twice as fast, and human reviewers could not tell their answers apart in a blind comparison. Which choice BEST meets the business objective?"
  options:
    - { id: a, text: "Model X, because the highest evaluation score should always win", explanation: "Incorrect. A tiny, imperceptible quality gain does not justify much higher cost and latency for a high-volume FAQ use case." }
    - { id: b, text: "Model Y, because quality is indistinguishable to users while cost and latency are much better", explanation: "Correct. Business fit weighs quality against cost and speed; at high volume, Model Y delivers equivalent perceived quality more efficiently." }
    - { id: c, text: "Neither; pre-train a new model that wins on every metric", explanation: "Incorrect. Pre-training is extremely expensive and unnecessary when an existing model meets the objective." }
    - { id: d, text: "Model X, because blind human comparisons are not valid evaluation", explanation: "Incorrect. Blind side-by-side comparison is a recognised and valuable human evaluation method." }
  answer: [b]
  explanation: "Evaluation results must be judged against business objectives. When quality differences are within what users can perceive, cost per interaction and latency often decide. For a high-stakes task such as legal drafting, a small quality gain might justify a higher cost."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#examples
  difficulty: hard

- id: q-day-20-016
  set: day-20
  type: single
  stem: "When evaluating a RAG application, which metric checks whether the generated answer is supported by the retrieved context rather than containing invented facts?"
  options:
    - { id: a, text: "Context relevance", explanation: "Incorrect. Context relevance is a retrieval metric that checks whether the retrieved chunks relate to the question." }
    - { id: b, text: "BLEU", explanation: "Incorrect. BLEU measures n-gram precision against a reference translation, not support from retrieved context." }
    - { id: c, text: "Latency", explanation: "Incorrect. Latency measures speed, not whether answers are grounded." }
    - { id: d, text: "Faithfulness", explanation: "Correct. Faithfulness is a generation metric that checks the answer is grounded in the retrieved context without hallucinated content." }
  answer: [d]
  explanation: "RAG evaluation separates retrieval metrics (context relevance, context coverage) from generation metrics (faithfulness, correctness, completeness, citation quality). Faithfulness specifically detects claims that go beyond the retrieved context."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-day-20-017
  set: day-20
  type: multi
  stem: "Which capabilities does an automatic programmatic evaluation job in Amazon Bedrock Model Evaluation provide? (Select TWO.)"
  options:
    - { id: a, text: "Built-in curated datasets, or the option to bring your own prompt dataset in Amazon S3", explanation: "Correct. Programmatic jobs can use built-in datasets or a custom JSONL prompt dataset in S3." }
    - { id: b, text: "Built-in metrics such as accuracy, robustness and toxicity for task types such as summarisation", explanation: "Correct. You choose a task type and built-in metrics for the job." }
    - { id: c, text: "A required work team of human reviewers for every job", explanation: "Incorrect. Human reviewers are used in human evaluation jobs, not automatic programmatic jobs." }
    - { id: d, text: "Automatic fine-tuning of the model when scores are low", explanation: "Incorrect. Evaluation jobs measure performance; they do not retrain models." }
    - { id: e, text: "A guarantee that the model meets the company's business objectives", explanation: "Incorrect. Technical scores must still be checked against business metrics such as task completion and cost." }
  answer: [a, b]
  explanation: "Automatic programmatic evaluation in Amazon Bedrock computes built-in metrics (accuracy, robustness, toxicity) for a chosen task type on built-in or custom datasets and stores results in S3. Human and LLM-as-a-judge jobs are separate evaluation types."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: easy

- id: q-day-20-018
  set: day-20
  type: single
  stem: "A support bot averages 4.3 out of 5 for helpfulness from an LLM judge, yet the contact centre's escalation rate has not fallen. Investigation shows the judge rewards long, polite answers, while customers want short instructions that solve their problem. What should the team do?"
  options:
    - { id: a, text: "Keep the current rubric because the average score is high", explanation: "Incorrect. A high score that does not match business outcomes shows the evaluation is measuring the wrong thing." }
    - { id: b, text: "Change the rubric to reward resolution, calibrate the judge against human-rated conversations and track task completion as a primary metric", explanation: "Correct. Aligning the rubric with the business goal, checking the judge against humans and measuring task completion fixes the misleading signal." }
    - { id: c, text: "Switch to BLEU because it is more objective", explanation: "Incorrect. BLEU is a translation metric that needs references and would not measure whether problems are solved." }
    - { id: d, text: "Ask the model to write even longer answers to raise the score further", explanation: "Incorrect. That would exploit the judge's verbosity bias and make the real problem worse." }
  answer: [b]
  explanation: "LLM judges can have verbosity bias, and any technical score can drift away from what the business needs. Rubrics should reflect the business objective, judges should be calibrated against human ratings, and business alignment metrics such as task completion should be tracked directly."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#examples
  difficulty: hard

- id: q-day-20-019
  set: day-20
  type: single
  stem: "In a human evaluation, reviewers compare answers from two models side by side. Why should the team hide which model produced each answer?"
  options:
    - { id: a, text: "To reduce the cost of the evaluation", explanation: "Incorrect. Hiding model names does not change cost; it changes the reliability of the ratings." }
    - { id: b, text: "Because Amazon Bedrock cannot display model names", explanation: "Incorrect. The reason is to avoid reviewer bias, not a product limitation." }
    - { id: c, text: "To prevent reviewers' expectations about a model from biasing their judgements", explanation: "Correct. Blind comparison keeps ratings focused on answer quality rather than on reputation or expectations." }
    - { id: d, text: "So that ROUGE scores can be computed automatically", explanation: "Incorrect. ROUGE is computed against references and has nothing to do with blinding reviewers." }
  answer: [c]
  explanation: "Good human evaluation uses clear guidelines, subject-matter experts where needed, several reviewers per item with inter-rater agreement checks, and blinding so reviewers do not know which model produced which answer."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: easy

- id: q-day-20-020
  set: day-20
  type: multi
  stem: "A team is evaluating an AI agent that books meeting rooms by calling calendar APIs. Besides checking the final reply, which measurements evaluate HOW the agent performed the task? (Select TWO.)"
  options:
    - { id: a, text: "Tool-use accuracy: whether it called the right API with the right parameters", explanation: "Correct. Choosing the correct tool with correct parameters is central to agent quality." }
    - { id: b, text: "Trajectory efficiency: how many steps, retries and model calls it needed", explanation: "Correct. Fewer unnecessary steps usually mean lower latency and cost; traces reveal the path." }
    - { id: c, text: "BLEU score of the final reply against a reference translation", explanation: "Incorrect. BLEU measures translation overlap and says nothing about the agent's actions." }
    - { id: d, text: "The size of the agent's foundation model", explanation: "Incorrect. Model size is not a measure of how well the task was performed." }
    - { id: e, text: "The number of documents in the company's knowledge base", explanation: "Incorrect. Knowledge base size does not evaluate the agent's path through the task." }
  answer: [a, b]
  explanation: "For agents, evaluate the path as well as the result: task completion, tool-use accuracy, trajectory and number of steps, latency, and safety or policy compliance. Traces from Bedrock Agents and AgentCore Observability show each reasoning step and tool call."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: hard
