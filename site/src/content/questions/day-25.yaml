- id: q-day-25-001
  set: day-25
  type: single
  stem: "A company builds a customer chatbot on Amazon Bedrock. Under the AWS shared responsibility model, which task is the company's responsibility?"
  options:
    - { id: a, text: "Defining the IAM policies that control which users and applications can invoke which models", explanation: "Correct. Identities and access policies are security in the cloud, which always stays with the customer, even for a fully managed service." }
    - { id: b, text: "Patching the operating systems of the hosts that run the foundation models", explanation: "Incorrect. With Bedrock, AWS runs and patches the underlying hosts and model runtime." }
    - { id: c, text: "Physically securing the data centres where the models run", explanation: "Incorrect. Physical security of facilities is part of security of the cloud, which is AWS's responsibility." }
    - { id: d, text: "Maintaining and scaling the model-serving software inside Amazon Bedrock", explanation: "Incorrect. Bedrock is fully managed, so AWS maintains and scales the model hosting and runtime." }
  answer: [a]
  explanation: "AWS is responsible for security of the cloud (facilities, hardware, managed model hosting); the customer is responsible for security in the cloud. Data, IAM policies, guardrail configuration and how outputs are used remain customer responsibilities with every service."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: easy

- id: q-day-25-002
  set: day-25
  type: single
  stem: "An application in private subnets of a VPC calls Amazon Bedrock. Security policy states that this traffic must not traverse the public internet. What should the company use?"
  options:
    - { id: a, text: "A NAT gateway in a public subnet", explanation: "Incorrect. A NAT gateway lets private resources reach the internet; traffic would still go to the public endpoint over the internet path." }
    - { id: b, text: "A VPC interface endpoint for Amazon Bedrock powered by AWS PrivateLink", explanation: "Correct. An interface endpoint places a private network interface for Bedrock inside the VPC, so calls stay on the AWS network." }
    - { id: c, text: "AWS WAF rules attached to the application", explanation: "Incorrect. AWS WAF filters HTTP requests to web applications; it does not create private connectivity to Bedrock." }
    - { id: d, text: "An internet gateway with a restrictive security group", explanation: "Incorrect. An internet gateway is exactly the public path the policy forbids; a security group does not change that." }
  answer: [b]
  explanation: "VPC interface endpoints, powered by AWS PrivateLink, give private connectivity from a VPC to AWS services such as Amazon Bedrock and SageMaker AI without using the public internet. Gateway endpoints do the same for Amazon S3."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: easy

- id: q-day-25-003
  set: day-25
  type: single
  stem: "A financial company stores fine-tuning data and custom model artifacts for Amazon Bedrock. Compliance requires that the company controls the encryption keys, can revoke access to them, and can audit every use of the keys. Which approach meets these requirements?"
  options:
    - { id: a, text: "Use AWS owned keys", explanation: "Incorrect. AWS owned keys are managed entirely by AWS; the customer cannot see, control or revoke them." }
    - { id: b, text: "Use AWS managed keys", explanation: "Incorrect. AWS managed keys are created for a service and managed by AWS; the customer cannot control the key policy or disable them." }
    - { id: c, text: "Use AWS KMS customer managed keys", explanation: "Correct. With customer managed keys the company controls the key policy, rotation, disabling and deletion, and every use is logged in CloudTrail." }
    - { id: d, text: "Store the encryption keys as secrets in AWS Secrets Manager", explanation: "Incorrect. Secrets Manager stores credentials such as passwords and API keys; encryption keys for AWS services are managed in AWS KMS." }
  answer: [c]
  explanation: "AWS KMS offers AWS owned, AWS managed and customer managed keys. When a requirement says the company must control, rotate, revoke or audit keys, choose customer managed keys. Reading encrypted data then needs permission on both the data and the key."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#examples
  difficulty: medium

- id: q-day-25-004
  set: day-25
  type: single
  stem: "Before using ten years of support transcripts stored in Amazon S3 as a knowledge base source, a company wants to find any credit card numbers and personal addresses in the files. Which AWS service should it use?"
  options:
    - { id: a, text: "Amazon Inspector", explanation: "Incorrect. Amazon Inspector scans EC2 instances, container images and Lambda functions for software vulnerabilities, not data in S3." }
    - { id: b, text: "AWS CloudTrail", explanation: "Incorrect. CloudTrail records API activity; it does not inspect the contents of files." }
    - { id: c, text: "Amazon Bedrock Guardrails sensitive information filter", explanation: "Incorrect. The guardrail filter detects PII in live prompts and responses, not in files stored in S3 buckets." }
    - { id: d, text: "Amazon Macie", explanation: "Correct. Macie uses machine learning and pattern matching to discover sensitive data such as PII and financial data in Amazon S3." }
  answer: [d]
  explanation: "Amazon Macie discovers sensitive data in S3 buckets and reports findings by bucket and object. Run it before data becomes training data or a RAG source so that sensitive values can be removed or redacted first."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: easy

- id: q-day-25-005
  set: day-25
  type: single
  stem: "An AI agent calls a third-party weather API that requires an API key. The security team requires the key to be stored encrypted, retrieved at run time and rotated automatically every 30 days. Which service meets these requirements?"
  options:
    - { id: a, text: "AWS Secrets Manager", explanation: "Correct. Secrets Manager stores secrets encrypted with KMS, controls access with IAM and supports automatic rotation." }
    - { id: b, text: "AWS Key Management Service", explanation: "Incorrect. KMS manages encryption keys; it does not store and rotate application secrets such as third-party API keys." }
    - { id: c, text: "An environment variable in the agent's code configuration", explanation: "Incorrect. Embedding keys in code or configuration risks leakage and provides no automatic rotation." }
    - { id: d, text: "Amazon Macie", explanation: "Incorrect. Macie discovers sensitive data in S3; it does not store or rotate secrets." }
  answer: [a]
  explanation: "AWS Secrets Manager is the service for storing and rotating credentials such as database passwords, OAuth client secrets and API keys. Applications fetch the secret at run time instead of hard-coding it."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: easy

- id: q-day-25-006
  set: day-25
  type: multi
  stem: "A company's Bedrock-based assistant can create support tickets and look up orders. The company is concerned about prompt injection. Which measures will reduce this risk? (Select TWO.)"
  options:
    - { id: a, text: "Enable the prompt attack filter in Amazon Bedrock Guardrails", explanation: "Correct. The prompt attack filter detects jailbreak and prompt injection attempts in input." }
    - { id: b, text: "Give the assistant's tools only the minimum permissions they need", explanation: "Correct. Least privilege limits the damage if an injection succeeds, because the assistant can only do a little." }
    - { id: c, text: "Increase the temperature so responses are less predictable", explanation: "Incorrect. Temperature controls randomness of output; it does not defend against injected instructions." }
    - { id: d, text: "Turn off model invocation logging so attackers cannot read prompts", explanation: "Incorrect. Logging does not expose prompts to attackers, and turning it off removes the audit trail needed to investigate attacks." }
    - { id: e, text: "Switch to a larger foundation model", explanation: "Incorrect. Larger models can still follow injected instructions; model size is not a security control." }
  answer: [a, b]
  explanation: "No single control stops prompt injection, so layer defences: filter input with the guardrail prompt attack filter, separate trusted instructions from untrusted content, apply least privilege to the model and its tools, validate output before acting, and require human approval for high-impact actions."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: medium

- id: q-day-25-007
  set: day-25
  type: single
  stem: "A guardrail used by a production chatbot was weakened last week, and the security team needs to find out which identity made the change and when. Where should they look?"
  options:
    - { id: a, text: "Bedrock model invocation logs", explanation: "Incorrect. Invocation logs record prompts and responses, not configuration changes to guardrails." }
    - { id: b, text: "AWS CloudTrail", explanation: "Correct. CloudTrail records API calls such as UpdateGuardrail, including the caller identity, time and source." }
    - { id: c, text: "Amazon Macie findings", explanation: "Incorrect. Macie reports sensitive data in S3; it does not track API activity." }
    - { id: d, text: "Amazon CloudWatch metrics", explanation: "Incorrect. Metrics show counts and latency, not which identity changed a configuration." }
  answer: [b]
  explanation: "CloudTrail is the audit trail for actions in an AWS account: who called which API, on which resource, and when. Model invocation logging is the complementary record of what the model was asked and what it answered."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#examples
  difficulty: easy

- id: q-day-25-008
  set: day-25
  type: single
  stem: "After a customer complaint, a team wants to read the exact prompt and response from a Bedrock conversation two weeks ago, but no record of the text exists anywhere. What is the MOST likely reason?"
  options:
    - { id: a, text: "AWS CloudTrail was not enabled in the account", explanation: "Incorrect. CloudTrail records API calls and metadata, not the full prompt and response text." }
    - { id: b, text: "The application did not use a guardrail", explanation: "Incorrect. Guardrails filter content; they are not the mechanism for storing prompts and responses." }
    - { id: c, text: "Model invocation logging had not been enabled; it is off by default", explanation: "Correct. Bedrock keeps no log of prompts and responses for you unless you enable model invocation logging to S3 or CloudWatch Logs." }
    - { id: d, text: "Bedrock deletes stored prompts after seven days", explanation: "Incorrect. Bedrock keeps no retrievable record of prompts for you by default; there is no seven-day customer-readable store. (Some models may briefly retain data for abuse detection, configurable in Bedrock data-retention settings, but that is not a log you can read.)" }
  answer: [c]
  explanation: "Model invocation logging records prompts and responses and delivers them to Amazon CloudWatch Logs and/or Amazon S3. It is off by default. Because the logs may contain personal data, encrypt them and restrict access."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: medium

- id: q-day-25-009
  set: day-25
  type: single
  stem: "An agent built on Amazon Bedrock AgentCore must read each user's calendar in a SaaS application using that user's own permissions. OAuth tokens must not be stored in the agent's code. Which capability should the company use?"
  options:
    - { id: a, text: "Policy in AgentCore", explanation: "Incorrect. Policy in AgentCore defines rules on which tool calls are allowed; it does not obtain or hold the user's OAuth tokens." }
    - { id: b, text: "Amazon Bedrock Guardrails", explanation: "Incorrect. Guardrails filter prompts and responses; they do not manage identities or credentials." }
    - { id: c, text: "An IAM user for the agent with long-term access keys", explanation: "Incorrect. Long-term keys are a leakage risk and would not let the agent act with each user's own SaaS permissions." }
    - { id: d, text: "AgentCore Identity", explanation: "Correct. AgentCore Identity gives agents workload identities and a token vault for OAuth tokens and API keys, so agents can act on behalf of users with scoped credentials." }
  answer: [d]
  explanation: "AgentCore Identity authenticates callers through existing identity providers and securely holds the OAuth tokens and API keys agents need to call tools on a user's behalf. Policy in AgentCore is the separate rulebook for what actions are allowed."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#examples
  difficulty: medium

- id: q-day-25-010
  set: day-25
  type: single
  stem: "A refund agent must never approve refunds above 500 dollars, even if a manipulated prompt convinces the agent that a larger refund is justified. Which approach BEST enforces this rule?"
  options:
    - { id: a, text: "Define a rule in Policy in AgentCore that is evaluated on tool calls outside the agent's reasoning", explanation: "Correct. Policy in AgentCore checks tool calls at the gateway independently of the agent's reasoning, so a confused or manipulated agent cannot talk its way past the rule." }
    - { id: b, text: "Add the instruction 'never refund more than 500 dollars' to the system prompt", explanation: "Incorrect. Instructions in the prompt can be overridden by prompt injection; they are not a deterministic control." }
    - { id: c, text: "Create a denied topic called refunds in Amazon Bedrock Guardrails", explanation: "Incorrect. A denied topic would block all conversation about refunds, and it filters text rather than enforcing limits on tool actions." }
    - { id: d, text: "Create a CloudWatch alarm on the number of refunds issued", explanation: "Incorrect. An alarm detects activity after the fact; it does not prevent the refund." }
  answer: [a]
  explanation: "For agents, important limits should be enforced outside the model. Policy in AgentCore applies rules to tool calls passing through AgentCore Gateway, which complements least-privilege permissions and human approval for high-impact actions."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: hard

- id: q-day-25-011
  set: day-25
  type: single
  stem: "A telecom company's support assistant sometimes includes customers' phone numbers in its answers. The company wants these numbers hidden in responses while still answering the question. What should it configure?"
  options:
    - { id: a, text: "Amazon Macie on the support bucket", explanation: "Incorrect. Macie discovers sensitive data in S3 but does not change live model responses." }
    - { id: b, text: "A sensitive information filter in Amazon Bedrock Guardrails set to mask phone numbers", explanation: "Correct. The sensitive information filter detects PII in prompts and responses and can mask it, preventing data leakage while still returning an answer." }
    - { id: c, text: "AWS KMS encryption on the knowledge base", explanation: "Incorrect. Encryption protects stored data from unauthorised access; it does not remove PII from answers shown to users." }
    - { id: d, text: "An IAM policy that denies bedrock:InvokeModel", explanation: "Incorrect. Denying invocation would stop the assistant working altogether instead of masking the numbers." }
  answer: [b]
  explanation: "Bedrock Guardrails sensitive information filters can block or mask PII types (and custom regex patterns) in both input and output. Masking keeps the response useful while preventing leakage of personal data."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#examples
  difficulty: medium

- id: q-day-25-012
  set: day-25
  type: single
  stem: "A company needs to stop insults and hate speech in both user prompts and model responses of its Amazon Bedrock chatbot. Which option meets this requirement?"
  options:
    - { id: a, text: "AWS WAF rules in front of the chatbot", explanation: "Incorrect. AWS WAF filters web requests by patterns; it is not designed to judge toxicity of model output." }
    - { id: b, text: "Amazon GuardDuty", explanation: "Incorrect. GuardDuty is a threat detection service that analyses logs; it does not filter chatbot content." }
    - { id: c, text: "Content filters in Amazon Bedrock Guardrails", explanation: "Correct. Guardrails content filters detect hate, insults, sexual content, violence and misconduct in input and output, with adjustable strengths." }
    - { id: d, text: "Amazon Inspector", explanation: "Incorrect. Inspector scans software for vulnerabilities; it does not analyse conversation content." }
  answer: [c]
  explanation: "Bedrock Guardrails content filters are the main toxicity control for generative AI applications and apply to both prompts and responses. AWS WAF filters web traffic and Amazon GuardDuty detects account threats — neither inspects model prompts or responses."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#exam-tips
  difficulty: easy

- id: q-day-25-013
  set: day-25
  type: multi
  stem: "A hospital will build a summarisation assistant on Amazon Bedrock. Patient notes must stay within the hospital's private network, the hospital must control the encryption keys, and auditors must see who invoked the model. Which services should the hospital use? (Select THREE.)"
  options:
    - { id: a, text: "A VPC interface endpoint for Amazon Bedrock (AWS PrivateLink)", explanation: "Correct. The endpoint keeps traffic between the VPC and Bedrock on the AWS network." }
    - { id: b, text: "Amazon GuardDuty", explanation: "Incorrect. GuardDuty detects threats from logs; it does not provide private connectivity, key control or an API audit trail." }
    - { id: c, text: "AWS KMS customer managed keys", explanation: "Correct. Customer managed keys give the hospital control over key policies, rotation and revocation." }
    - { id: d, text: "AWS CloudTrail", explanation: "Correct. CloudTrail records which identity called the model APIs and when." }
    - { id: e, text: "AWS Shield", explanation: "Incorrect. Shield protects against DDoS attacks and does not address these requirements." }
    - { id: f, text: "Amazon Macie", explanation: "Incorrect. Macie discovers sensitive data in S3; none of the three stated requirements is about discovering data." }
  answer: [a, c, d]
  explanation: "Break security requirements into clues: private network leads to a VPC endpoint with PrivateLink, control the keys leads to KMS customer managed keys, and who used the model leads to CloudTrail. Add model invocation logging if auditors also need the content of prompts and responses."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#examples
  difficulty: hard

- id: q-day-25-014
  set: day-25
  type: single
  stem: "A start-up hosts an open-source language model on Amazon EC2 instances it manages. An attacker exploits an unpatched library in the model server. According to the shared responsibility model, who was responsible for patching that library?"
  options:
    - { id: a, text: "AWS, because the instances run in AWS data centres", explanation: "Incorrect. AWS secures the physical infrastructure and hypervisor, not the software customers install on EC2." }
    - { id: b, text: "The model's open-source authors, because they published the model", explanation: "Incorrect. The authors may publish fixes, but applying patches to a deployment is the operator's job." }
    - { id: c, text: "AWS and the start-up equally, because the model is open source", explanation: "Incorrect. Responsibility is not split equally; on EC2 the operating system and installed software belong to the customer." }
    - { id: d, text: "The start-up, because on EC2 the customer manages the operating system and installed software", explanation: "Correct. With self-managed infrastructure, the customer patches the OS, containers and model server." }
  answer: [d]
  explanation: "The more managed the service, the more AWS secures. On EC2 the customer patches the OS and software; on SageMaker AI AWS manages the platform; on Bedrock AWS also runs the model runtime. Data, IAM and output use always remain with the customer."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#examples
  difficulty: medium

- id: q-day-25-015
  set: day-25
  type: multi
  stem: "Which practices apply the principle of least privilege to an AI application on AWS? (Select TWO.)"
  options:
    - { id: a, text: "Allow the chatbot's role to call bedrock:InvokeModel only on one approved model ARN", explanation: "Correct. Limiting actions and resources to exactly what the job needs is least privilege." }
    - { id: b, text: "Scope a SageMaker AI execution role to read one training bucket and write one output bucket", explanation: "Correct. The training job receives only the access it needs through a role with temporary credentials." }
    - { id: c, text: "Attach the AdministratorAccess policy to the data science team to speed up experiments", explanation: "Incorrect. Administrator access grants far more than experimentation needs and violates least privilege." }
    - { id: d, text: "Store long-term access keys in the notebook so jobs can run unattended", explanation: "Incorrect. Embedded long-term keys can leak and remain valid until revoked; services should use roles." }
    - { id: e, text: "Grant bedrock:* on all resources so new models work without policy changes", explanation: "Incorrect. Wildcard permissions grant every Bedrock action on every resource, the opposite of least privilege." }
  answer: [a, b]
  explanation: "Least privilege means granting only the actions and resources a job needs. Use IAM roles, which hand out temporary credentials, rather than long-term keys, and scope policies to specific models and buckets."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: medium

- id: q-day-25-016
  set: day-25
  type: ordering
  stem: "Arrange the defence-in-depth layers in the order a chatbot request passes through them, from the user's request to the final action."
  options:
    - { id: a, text: "An output guardrail checks the response for toxicity, PII and grounding", explanation: "Fourth: after the model generates text, the guardrail checks the response before it is used." }
    - { id: b, text: "An input guardrail screens the prompt for prompt attacks, denied topics and PII", explanation: "Second: the prompt is filtered before it reaches the model." }
    - { id: c, text: "The foundation model in Amazon Bedrock generates a response", explanation: "Third: the model only sees prompts that passed the input checks." }
    - { id: d, text: "IAM authorises the request, which travels through a VPC interface endpoint", explanation: "First: the caller must be authorised and the traffic reaches Bedrock privately." }
    - { id: e, text: "The application validates the output before acting on it", explanation: "Last: the application checks schema, limits or permissions before taking any action." }
  answer: [d, b, c, a, e]
  explanation: "Each layer protects against a different failure: identity and private networking control who can reach the model, guardrails filter input and output, and application-level validation stops a bad output from turning into a harmful action. CloudTrail and invocation logging record the steps."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#diagram
  difficulty: medium

