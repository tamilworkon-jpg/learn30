  taskStatement: "2.3"
  lessonRef: day-12#explanation
  difficulty: medium

- id: q-mock-1-055
  set: mock-1
  type: single
  stem: "A company runs a customer assistant on Amazon Bedrock. Under the AWS shared responsibility model, which task is the company's responsibility?"
  options:
