  lessonRef: day-11#explanation
  difficulty: medium

- id: q-mock-1-059
  set: mock-1
  type: single
  stem: "A data scientist must show a customer which input features contributed most to that customer's individual credit decision from a gradient-boosted tree model. Which tool BEST supports this?"
