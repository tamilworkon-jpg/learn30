  lessonRef: day-12#explanation
  difficulty: easy

- id: q-mock-1-043
  set: mock-1
  type: single
  stem: "A company wants to adapt a 70-billion-parameter open-weight model in Amazon SageMaker AI to three different tasks. GPU budget is limited, and the team wants to keep one shared base model and swap in a small task-specific component for each task. Which approach BEST fits?"
  options:
    - { id: a, text: "Parameter-efficient fine-tuning, such as LoRA adapters for each task", explanation: "Correct. PEFT freezes the base weights and trains small adapters, using far less compute and allowing several adapters on one base model." }
    - { id: b, text: "Full fine-tuning of three separate copies of the model", explanation: "Incorrect. Full fine-tuning updates all weights and creates three full-size copies, which is expensive." }
    - { id: c, text: "Pre-training a new model from scratch", explanation: "Incorrect. Pre-training costs months of compute and is almost never needed by a business." }
    - { id: d, text: "Continued pre-training on unlabelled text", explanation: "Incorrect. Continued pre-training adds domain knowledge to the whole model; it does not produce small swappable task components." }
  answer: [a]
  explanation: "Full fine-tuning updates every weight and produces a complete model copy. Parameter-efficient fine-tuning (PEFT), such as LoRA, trains only small adapter matrices, which needs much less compute and memory, reduces catastrophic forgetting and lets several adapters share one base model."
  domain: D3
  taskStatement: "3.3"
  lessonRef: day-19#explanation
  difficulty: hard

- id: q-mock-1-044
  set: mock-1
  type: single
  stem: "A regulator asks a bank why its LLM-based assistant gave a particular answer to a customer. The engineers can show the prompt and the response but cannot trace the answer to specific internal reasoning inside the model. Which generative AI limitation does this illustrate?"
  options:
    - { id: a, text: "High latency", explanation: "Incorrect. Latency is about response speed, not the ability to explain an answer." }
    - { id: b, text: "Limited adaptability", explanation: "Incorrect. Foundation models are highly adaptable; that is an advantage." }
    - { id: c, text: "Low interpretability", explanation: "Correct. Large models are opaque: it is hard to explain how they arrived at a specific output." }
    - { id: d, text: "Overfitting", explanation: "Incorrect. Overfitting is about failing to generalise from training data, not about explaining outputs." }
  answer: [c]
  explanation: "Interpretability is the degree to which people can understand how a model reaches its output. LLMs with billions of parameters have low interpretability, which matters in regulated settings; mitigations include grounding with citations, documentation and choosing transparent models where explanations are mandatory."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: easy

