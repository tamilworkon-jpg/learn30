- id: q-mock-1-046
  set: mock-1
  type: single
  stem: "A developer sets the top-p inference parameter of a text model to 0.2. What effect does this setting have on generation?"
  options:
    - { id: a, text: "Responses are limited to 20% of the maximum token count", explanation: "Incorrect. Response length is controlled by maximum tokens and stop sequences, not top-p." }
    - { id: b, text: "The model chooses only among the 20 most likely next tokens", explanation: "Incorrect. That describes top-k with k = 20." }
    - { id: c, text: "The model samples only from the smallest set of most likely tokens whose probabilities add up to 20%, giving focused output", explanation: "Correct. Top-p (nucleus sampling) keeps the most likely tokens until their probabilities reach p; a low p narrows the choice." }
    - { id: d, text: "Randomness increases by 20% compared with the default", explanation: "Incorrect. A lower top-p reduces, not increases, randomness." }
  answer: [c]
  explanation: "Top-p keeps the smallest set of tokens whose cumulative probability reaches p; top-k keeps the k most likely tokens; temperature reshapes the probabilities. Low values of all three give focused, repeatable output."
  domain: D3
  taskStatement: "3.1"
  lessonRef: day-15#explanation
  difficulty: hard

- id: q-mock-1-047
  set: mock-1
  type: single
  stem: "A utility records each smart meter's electricity use every 15 minutes for three years and wants to forecast demand for next week. Which type of data BEST describes these readings?"
  options:
    - { id: a, text: "Unstructured data", explanation: "Incorrect. Meter readings are numeric values in a fixed format, not free text, images or audio." }
    - { id: b, text: "Image data", explanation: "Incorrect. The readings are numbers, not pictures." }
    - { id: c, text: "Text data", explanation: "Incorrect. The readings are numeric measurements, not documents or messages." }
    - { id: d, text: "Time-series data", explanation: "Correct. Measurements recorded at regular time intervals, where order matters, are time-series data." }
  answer: [d]
  explanation: "Structured data comes in rows and columns, including tabular and time-series data; unstructured data includes text, images, audio and video. Time-series data is ordered by time and is the basis for forecasting."
