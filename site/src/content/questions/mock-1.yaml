  explanation: "The Generative AI Security Scoping Matrix: Scope 1 consumer app, 2 enterprise app, 3 pre-trained model, 4 fine-tuned model, 5 self-trained model. Scopes 1 and 2 are buying, 3 to 5 are building; each step up adds control and responsibility."
