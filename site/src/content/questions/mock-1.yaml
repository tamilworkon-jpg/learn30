  lessonRef: day-24#explanation
  difficulty: medium

- id: q-mock-1-033
  set: mock-1
  type: single
  stem: "Three applications share one carefully tuned prompt template with placeholders for customer data. The team wants to store the template centrally with its model and inference settings and be able to roll back to an earlier version if a change performs badly. Which solution BEST fits?"
  options:
    - { id: a, text: "Keep the template in code comments in each application", explanation: "Incorrect. Copies in each application drift apart and have no central versioning or rollback." }
    - { id: b, text: "Amazon Bedrock Guardrails", explanation: "Incorrect. Guardrails filter content for safety; they do not store or version prompt templates." }
    - { id: c, text: "Amazon Bedrock Knowledge Bases", explanation: "Incorrect. Knowledge Bases provide managed RAG over documents, not prompt versioning." }
    - { id: d, text: "Amazon Bedrock Prompt Management with versions", explanation: "Correct. Prompt Management stores templates with variables and model settings and creates immutable versions you can roll back to." }
  answer: [d]
  explanation: "Prompt templates use variables such as {{customer_name}}. Amazon Bedrock Prompt Management stores prompts with their model and inference configuration and creates immutable versions, so teams can share, test and roll back prompts."
  domain: D3
  taskStatement: "3.2"
  lessonRef: day-16#explanation
  difficulty: medium

- id: q-mock-1-034
  set: mock-1
  type: single
  stem: "A corporate legal team needs a model that reads 400-page merger agreements in a single pass and answers questions that refer to clauses spread across the whole document. Several candidate models have similar quality on legal text. Which selection factor should the team check FIRST?"
  options:
    - { id: a, text: "Whether the model can generate images", explanation: "Incorrect. Image generation is irrelevant to reading long text documents." }
    - { id: b, text: "The size of the model's context window", explanation: "Correct. The whole agreement must fit in the context window for the model to reason across all clauses in one pass." }
    - { id: c, text: "The model's parameter count", explanation: "Incorrect. A larger model is not automatically better and does not guarantee a large enough context window." }
    - { id: d, text: "The default temperature setting", explanation: "Incorrect. Temperature can be adjusted per request and does not limit how much text the model can read." }
  answer: [b]
  explanation: "Model selection factors include modality, task capability, accuracy, latency, cost, context window, languages, customisation, compliance and licensing. When long documents must be processed whole, the context window is the deciding constraint; otherwise you need chunking and RAG."
  domain: D2
  taskStatement: "2.2"
  lessonRef: day-11#explanation
  difficulty: medium

- id: q-mock-1-035
  set: mock-1
  type: ordering
  stem: "A subscription business wants to reduce customer churn with machine learning. Place the stages of its ML project in the correct order, from first to last."
  options:
    - { id: a, text: "Train and tune candidate models", explanation: "Third: the algorithm learns from the prepared data and hyperparameters are tuned." }
    - { id: b, text: "Define the business goal and frame it as an ML problem", explanation: "First: decide what success looks like, for example predicting which customers will cancel." }
    - { id: c, text: "Collect and prepare data, including feature engineering", explanation: "Second: gather historical data, clean it and create useful features." }
    - { id: d, text: "Evaluate the model against held-out data and the success criteria", explanation: "Fourth: confirm the model meets model and business metrics before release." }
    - { id: e, text: "Deploy the model, monitor it for drift and retrain when needed", explanation: "Last: production use, with monitoring that feeds back into retraining." }
  answer: [b, c, a, d, e]
  explanation: "The ML pipeline is a loop: business goal and problem framing, data collection, preparation and feature engineering, training and tuning, evaluation, deployment and monitoring, then retraining as data changes."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-mock-1-036
  set: mock-1
  type: single
  stem: "An insurer wants an assistant that, given a claim number, looks up the policy through an internal API, checks coverage rules in a document collection and then files a claim update. The company wants to write as little orchestration code as possible. Which solution BEST fits?"
  options:
    - { id: a, text: "Amazon Bedrock Agents with action groups for the APIs and an attached knowledge base", explanation: "Correct. Bedrock Agents is a managed way to build agents that plan multi-step tasks, call APIs and query knowledge bases." }
