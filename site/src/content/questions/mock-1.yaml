- id: q-mock-1-060
  set: mock-1
  type: single
  stem: "An insurer fine-tunes an Amazon Nova model on its own claims history and serves the custom model in its claims application. According to the Generative AI Security Scoping Matrix, which scope applies, and what does it add compared with calling the base model through an API?"
  options:
    - { id: a, text: "Scope 2; the insurer must only manage user access to an enterprise application", explanation: "Incorrect. Scope 2 is buying an enterprise application; the insurer is building with a model it customised." }
    - { id: b, text: "Scope 3; responsibilities are identical to using the pre-trained model", explanation: "Incorrect. Scope 3 uses a pre-trained model as is; fine-tuning adds responsibilities." }
    - { id: c, text: "Scope 5; the insurer is responsible for pre-training data from scratch", explanation: "Incorrect. Scope 5 is training your own model from scratch, which the insurer did not do." }
