  lessonRef: day-18#explanation
  difficulty: medium

- id: q-mock-1-037
  set: mock-1
  type: single
  stem: "A design studio uses a model that creates product images from a text description. The model starts from random noise and removes the noise over many steps until an image matching the description appears. What type of model is this?"
  options:
    - { id: a, text: "A recurrent neural network", explanation: "Incorrect. RNNs process sequences step by step, such as text or time series; they are not how modern image generators work." }
    - { id: b, text: "A clustering model", explanation: "Incorrect. Clustering groups unlabelled data; it does not generate images." }
    - { id: c, text: "A diffusion model", explanation: "Correct. Diffusion models generate images by starting from noise and denoising step by step, guided by a text prompt." }
    - { id: d, text: "A regression model", explanation: "Incorrect. Regression predicts a number." }
  answer: [c]
  explanation: "Diffusion models learn to reverse a noising process: they begin with random noise and gradually remove it, guided by a prompt, to produce an image. Transformer LLMs generate text one token at a time."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-08#explanation
  difficulty: easy

- id: q-mock-1-038
  set: mock-1
  type: single
  stem: "A company builds a procurement agent on Amazon Bedrock AgentCore. The agent creates purchase orders through tools exposed by AgentCore Gateway. Security requires that the agent can never create a purchase order above 10,000 dollars, even if a prompt injection convinces the agent to try. Which approach MOST reliably meets this requirement?"
  options:
    - { id: a, text: "Add an instruction to the system prompt that orders above 10,000 dollars are forbidden", explanation: "Incorrect. Prompt instructions live inside the model's reasoning and can be overridden by a successful injection." }
    - { id: b, text: "Add a denied topic about large purchases to an Amazon Bedrock guardrail", explanation: "Incorrect. Guardrails filter content in text; they do not enforce numeric limits on tool calls." }
    - { id: c, text: "Store the purchasing system's credentials in AgentCore Identity", explanation: "Incorrect. AgentCore Identity manages how the agent authenticates; it does not limit the amount of an order." }
    - { id: d, text: "Write a Policy in AgentCore rule that blocks purchase-order tool calls above 10,000 dollars", explanation: "Correct. Policy rules are enforced deterministically at the gateway, outside the agent's reasoning, so a manipulated agent cannot bypass them." }
  answer: [d]
  explanation: "Policy in AgentCore enforces rules about which tools an agent may call and under what conditions, checked by AgentCore where tool calls pass through the Gateway. Because enforcement is outside the model, it holds even when prompts are manipulated. AgentCore Identity handles credentials and authentication."
  domain: D5
  taskStatement: "5.1"
  lessonRef: day-25#explanation
  difficulty: hard

- id: q-mock-1-039
  set: mock-1
  type: multi
  stem: "A team wants to use Amazon Bedrock Model Evaluation to compare two models that summarise customer complaints, where tone and helpfulness matter as much as accuracy. Which evaluation types can judge these subjective qualities? (Select TWO.)"
  options:
    - { id: a, text: "Human evaluation by the company's own work team", explanation: "Correct. Human reviewers can rate tone, helpfulness and other subjective qualities." }
    - { id: b, text: "LLM-as-a-judge evaluation", explanation: "Correct. A judge model scores responses against criteria such as helpfulness and tone, at lower cost than human review." }
