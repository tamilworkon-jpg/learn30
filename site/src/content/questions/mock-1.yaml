- id: q-mock-1-061
  set: mock-1
  type: single
  stem: "A warehouse robot learns to pick items from shelves by trying different grip actions. It gains points when an item is picked successfully and loses points when an item is dropped, and over thousands of attempts it improves. Which type of machine learning is this?"
  options:
    - { id: a, text: "Supervised classification", explanation: "Incorrect. Supervised learning needs labelled examples of correct answers; here the robot learns from rewards." }
    - { id: b, text: "Unsupervised clustering", explanation: "Incorrect. Clustering groups unlabelled data; it does not learn actions from feedback." }
    - { id: c, text: "Reinforcement learning", explanation: "Correct. An agent learning actions through trial, error and rewards is reinforcement learning." }
    - { id: d, text: "Self-supervised pre-training", explanation: "Incorrect. Self-supervised learning creates labels from the data itself, as in pre-training foundation models." }
  answer: [c]
  explanation: "Reinforcement learning trains an agent to take actions in an environment to maximise cumulative reward, learning by trial and error. Supervised learning uses labels, unsupervised finds structure, and self-supervised learning is how foundation models are pre-trained."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: medium

- id: q-mock-1-062
  set: mock-1
  type: multi
  stem: "An insurer is preparing a dataset of prompt-response pairs to fine-tune a claims assistant. Which practices will MOST improve the quality of this fine-tuning data? (Select TWO.)"
