    - { id: c, text: "Amazon SageMaker Model Cards", explanation: "Correct. Model Cards document a model's intended use, risk rating, training details and evaluation results in one place." }
    - { id: d, text: "Amazon SageMaker Model Monitor", explanation: "Incorrect. Model Monitor watches a deployed endpoint for drift; it is not a documentation tool." }
  answer: [c]
  explanation: "Amazon SageMaker Model Cards provide standard documentation for your models, supporting transparency, governance and audits. AWS AI Service Cards are the equivalent documents that AWS publishes for its own AI services."
