- id: q-mock-1-058
  set: mock-1
  type: single
  stem: "A marketing team wants one tool that can draft product descriptions, translate them into four languages and summarise customer reviews, and it wants a working prototype within a week. Which generative AI advantage MOST directly supports this plan?"
