    - { id: d, text: "AWS Trusted Advisor checks", explanation: "Incorrect. Trusted Advisor reviews account best practices, not model output quality." }
    - { id: e, text: "Amazon CloudWatch latency alarms", explanation: "Incorrect. Latency alarms measure speed, not tone or helpfulness." }
  answer: [a, b]
  explanation: "Amazon Bedrock Model Evaluation offers automatic (programmatic) evaluation, human evaluation with your own work team, and LLM-as-a-judge, plus evaluation of RAG with Knowledge Bases. Human review captures nuance but is slow and costly; LLM-as-a-judge scales subjective scoring."
  domain: D3
  taskStatement: "3.4"
  lessonRef: day-20#explanation
  difficulty: medium

- id: q-mock-1-040
  set: mock-1
  type: multi
  stem: "A support centre records customer phone calls in Spanish. Managers who read only English want a written English version of every call. Which AWS services should be combined to meet this requirement? (Select TWO.)"
