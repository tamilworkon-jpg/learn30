    - { id: c, text: "An Amazon Bedrock batch inference job", explanation: "Incorrect. Batch inference processes prompts offline; it does not orchestrate interactive tool calls." }
    - { id: d, text: "Amazon SageMaker Clarify", explanation: "Incorrect. Clarify detects bias and explains predictions." }
  answer: [a]
