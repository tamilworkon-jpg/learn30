- id: q-mock-1-054
  set: mock-1
  type: multi
  stem: "A financial company's CISO asks why the company should build its generative AI assistant on Amazon Bedrock rather than let staff use a public consumer chatbot. Which are valid advantages of Amazon Bedrock? (Select TWO.)"
  options:
    - { id: a, text: "Prompts and company data are not used to train the Bedrock base models", explanation: "Correct. Customer inputs and outputs are not used to train the base models or shared with model providers." }
    - { id: b, text: "Data can be encrypted with AWS KMS and reached privately through VPC endpoints, within AWS compliance programs", explanation: "Correct. Encryption, private networking and compliance programs are key security advantages of AWS GenAI services." }
    - { id: c, text: "AWS becomes responsible for how the company uses model outputs", explanation: "Incorrect. Under shared responsibility, the customer remains responsible for how outputs are used." }
    - { id: d, text: "Models on Amazon Bedrock never hallucinate", explanation: "Incorrect. Any foundation model can hallucinate; grounding and guardrails reduce the risk." }
    - { id: e, text: "Amazon Bedrock is free of charge for regulated industries", explanation: "Incorrect. Bedrock is billed on usage for all customers." }
  answer: [a, b]
  explanation: "Advantages of building on AWS include data privacy (inputs not used to train base models), encryption and private connectivity, compliance programs, Guardrails for safety and speed to market. Shared responsibility still applies: customers own their data, access and use of outputs."
