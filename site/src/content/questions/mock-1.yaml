  difficulty: medium

- id: q-mock-1-041
  set: mock-1
  type: single
  stem: "During a pilot, claims adjusters approved 99% of an AI system's recommendations without checking them, including several that were obviously wrong. Which type of bias does this behaviour show?"
  options:
    - { id: a, text: "Sampling bias", explanation: "Incorrect. Sampling bias arises when training data does not represent the real population." }
    - { id: b, text: "Automation bias", explanation: "Correct. Automation bias is people trusting a model's output too much and failing to apply their own judgement." }
    - { id: c, text: "Measurement bias", explanation: "Incorrect. Measurement bias comes from flawed or inconsistent data collection." }
    - { id: d, text: "Label bias", explanation: "Incorrect. Label bias comes from inaccurate or prejudiced labels in training data." }
  answer: [b]
  explanation: "Most AI bias starts in the data (sampling, historical, measurement and label bias), but automation bias is a human problem: over-reliance on the model. Mitigations include training reviewers, showing confidence scores and auditing human overrides."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-22#explanation
  difficulty: medium

- id: q-mock-1-042
  set: mock-1
  type: single
  stem: "A software team wants an agentic development environment that turns natural-language requirements into specifications, a design and a task list, and then helps write and test the code. Which AWS offering BEST matches this description?"
  options:
    - { id: a, text: "Amazon Quick", explanation: "Incorrect. Amazon Quick is an agentic workspace for business users: BI dashboards, research, chat agents and automation." }
