  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: medium

- id: q-mock-1-048
  set: mock-1
  type: multi
  stem: "A bank is deciding how much to explain about its card-fraud model to customers, auditors and its own data scientists. Which statements about explainability trade-offs are correct? (Select TWO.)"
  options:
    - { id: a, text: "Publishing the exact features and thresholds the model uses could help fraudsters learn how to evade it", explanation: "Correct. Full transparency can help attackers game a model, so the level of disclosure must be balanced against safety." }
    - { id: b, text: "Explanations should fit the audience, such as plain-language reasons for customers and feature attributions for data scientists", explanation: "Correct. Human-centred explainable AI presents explanations in terms the audience can understand and act on." }
    - { id: c, text: "More interpretable models are always more accurate than opaque models", explanation: "Incorrect. Interpretable models are usually less flexible and can be less accurate on complex data." }
    - { id: d, text: "Opaque models such as deep neural networks can never be explained in any way", explanation: "Incorrect. Post-hoc methods such as SHAP can explain individual predictions of opaque models." }
    - { id: e, text: "A fully transparent model removes the need for other security controls", explanation: "Incorrect. Transparency does not replace access control, monitoring or other security measures." }
  answer: [a, b]
  explanation: "Explainability involves trade-offs: more interpretable usually means less flexible, and too much transparency can expose data or help attackers. Human-centred design for explainable AI tailors explanations to each audience so they can act on them."
  domain: D4
  taskStatement: "4.2"
  lessonRef: day-24#explanation
  difficulty: hard

- id: q-mock-1-049
  set: mock-1
  type: multi
  stem: "A support agent built on a foundation model handles long customer conversations. After about 40 turns, answer quality drops and token costs climb because the full transcript and every retrieved document are sent on every turn. Which context-engineering changes would help the MOST? (Select TWO.)"
  options:
    - { id: a, text: "Summarise older turns and keep durable facts in long-term memory instead of resending the full transcript", explanation: "Correct. Compressing history keeps important information while cutting tokens and noise." }
    - { id: b, text: "Retrieve only the few most relevant chunks for each turn instead of every document", explanation: "Correct. Sending only relevant context improves focus and reduces input tokens." }
    - { id: c, text: "Raise the maximum output tokens", explanation: "Incorrect. Longer outputs add cost and do not fix an overloaded context." }
    - { id: d, text: "Move to a model with a larger context window and keep sending everything", explanation: "Incorrect. A bigger window delays the limit but keeps the cost and the irrelevant content that dilutes attention." }
    - { id: e, text: "Increase the temperature so the agent explores more answers", explanation: "Incorrect. Temperature controls randomness, not what goes into the context." }
  answer: [a, b]
  explanation: "Context engineering decides what enters the context window (instructions, retrieved knowledge, history, tool results and memory) and keeps it relevant, well ordered and within the token budget. Summarising history and retrieving selectively improve quality and cut cost."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-09#explanation
  difficulty: hard

- id: q-mock-1-050
  set: mock-1
  type: single
  stem: "A tutoring app uses an LLM to solve multi-step maths word problems. The model often jumps straight to a wrong final number. Which prompt engineering technique is MOST likely to improve accuracy?"
  options:
    - { id: a, text: "Zero-shot prompting with a shorter question", explanation: "Incorrect. Removing detail does not help the model reason through several steps." }
    - { id: b, text: "Chain-of-thought prompting that asks the model to reason step by step before answering", explanation: "Correct. Chain-of-thought improves performance on maths, logic and multi-step problems." }
    - { id: c, text: "A negative prompt that says 'do not make mistakes'", explanation: "Incorrect. Telling a model not to err does not give it a better reasoning process." }
    - { id: d, text: "Raising the temperature", explanation: "Incorrect. More randomness tends to reduce accuracy on precise reasoning tasks." }
  answer: [b]
  explanation: "Chain-of-thought prompting asks the model to work through intermediate steps before giving the final answer, which improves results on arithmetic, logic and multi-step tasks. Few-shot examples that show worked reasoning can strengthen it further."
  domain: D3
  taskStatement: "3.2"
  lessonRef: day-16#explanation
  difficulty: easy

- id: q-mock-1-051
  set: mock-1
  type: single
  stem: "A five-person startup wants to add text generation to its app. It has no ML operations staff, traffic is unpredictable, and it wants to pay only for what it uses with no servers to manage. Which way of using a model in production BEST fits?"
  options:
    - { id: a, text: "Call a foundation model through a managed API such as Amazon Bedrock", explanation: "Correct. A managed API has no servers to run, scales automatically and charges per use." }
    - { id: b, text: "Self-host an open-source model on Amazon EC2 GPU instances", explanation: "Incorrect. Self-hosting gives control but requires the team to manage instances, scaling and patching." }
    - { id: c, text: "Run a SageMaker AI real-time endpoint around the clock", explanation: "Incorrect. A persistent endpoint is self-hosted capacity that is billed even when idle." }
    - { id: d, text: "Deploy the model on an Amazon EKS cluster", explanation: "Incorrect. Running Kubernetes adds significant operational work." }
  answer: [a]
  explanation: "Production options range from a managed API (Amazon Bedrock: no servers, pay per use) to self-hosted APIs (SageMaker AI endpoints, EC2, EKS: more control but you run the infrastructure). Small teams with variable traffic usually benefit most from a managed API."
