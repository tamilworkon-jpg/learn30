  lessonRef: day-19#explanation
  difficulty: medium

- id: q-mock-1-063
  set: mock-1
  type: single
  stem: "A company plans 100,000 requests per month to a model on Amazon Bedrock with on-demand pricing. Each request sends 1,000 input tokens and receives 200 output tokens. Input tokens cost 0.0008 dollars per 1,000 and output tokens cost 0.0032 dollars per 1,000. What is the estimated monthly cost?"
  options:
    - { id: a, text: "144 dollars", explanation: "Correct. Per request: 1 x 0.0008 + 0.2 x 0.0032 = 0.00144 dollars; multiplied by 100,000 requests gives 144 dollars." }
    - { id: b, text: "96 dollars", explanation: "Incorrect. This prices all 1,200 tokens at the input rate and ignores the higher output price." }
    - { id: c, text: "64 dollars", explanation: "Incorrect. This counts only the output tokens." }
    - { id: d, text: "384 dollars", explanation: "Incorrect. This prices all 1,200 tokens at the output rate." }
  answer: [a]
  explanation: "On-demand cost is approximately requests x (input tokens x input price + output tokens x output price). Input and output tokens are priced separately, and output tokens usually cost more."
  domain: D2
  taskStatement: "2.1"
  lessonRef: day-09#explanation
  difficulty: hard

- id: q-mock-1-064
  set: mock-1
  type: ordering
  stem: "A lender is building a credit model in Amazon SageMaker AI and wants to check for bias throughout the model's life. Place the steps in the correct order, from first to last."
