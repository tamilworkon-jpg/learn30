  lessonRef: day-06#explanation
  difficulty: medium

- id: q-mock-1-052
  set: mock-1
  type: single
  stem: "A company wants to reduce the environmental impact of a foundation-model-powered text classification feature without falling below its required accuracy. Which approach BEST supports this goal?"
  options:
    - { id: a, text: "Switch to the largest available model to finish each request faster", explanation: "Incorrect. Larger models use more compute and energy per request." }
