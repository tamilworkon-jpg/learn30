- id: q-week-1-037
  set: week-1
  type: single
  stem: "A data team has hundreds of CSV and Parquet files arriving in Amazon S3 from different applications. It wants to discover the schema of each dataset automatically and record the schemas in a central catalogue that other tools can query. Which AWS service should it use?"
  options:
    - { id: a, text: "AWS Data Exchange", explanation: "Incorrect. Data Exchange is for finding and subscribing to third-party datasets." }
    - { id: b, text: "Amazon Redshift", explanation: "Incorrect. Redshift is a data warehouse for SQL analytics; it does not crawl S3 to discover schemas for a central catalogue." }
    - { id: c, text: "AWS Glue crawlers and the Glue Data Catalog", explanation: "Correct. Glue crawlers discover data and its schema, and the Glue Data Catalog records the schemas centrally." }
    - { id: d, text: "AWS Lake Formation", explanation: "Incorrect. Lake Formation builds and secures a data lake with fine-grained permissions; schema discovery is done by Glue crawlers." }
  answer: [c]
  explanation: "AWS Glue is serverless data integration: crawlers discover data, the Glue Data Catalog records schemas, and ETL jobs transform data. Lake Formation governs access to the data lake, Redshift is the data warehouse, and Data Exchange supplies third-party data."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: easy

- id: q-week-1-038
  set: week-1
  type: single
  stem: "A retailer's analysts already keep sales data in a cloud data warehouse and are fluent in SQL. They want to train a simple prediction model directly from the warehouse by using SQL statements. Which AWS option fits BEST?"
