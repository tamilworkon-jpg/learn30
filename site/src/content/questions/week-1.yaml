  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: medium

- id: q-week-1-027
  set: week-1
  type: single
  stem: "A retail planner with no coding experience wants to predict next quarter's weekly sales for each store from three years of historical sales data. Which AWS option meets this requirement with the LEAST effort?"
  options:
    - { id: a, text: "Amazon Personalize", explanation: "Incorrect. Personalize builds recommendations from user interaction data, not time-series forecasts." }
    - { id: b, text: "Amazon Rekognition", explanation: "Incorrect. Rekognition analyses images and video; it does not forecast numeric values." }
    - { id: c, text: "Amazon SageMaker Canvas", explanation: "Correct. Forecasting is regression on time-series data, and SageMaker Canvas lets analysts build such models without writing code." }
    - { id: d, text: "Amazon Comprehend", explanation: "Incorrect. Comprehend extracts insights from text; it does not forecast numeric values." }
  answer: [c]
