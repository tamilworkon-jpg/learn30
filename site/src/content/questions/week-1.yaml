  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: easy

- id: q-week-1-028
  set: week-1
  type: single
  stem: "A logistics manager asks: 'How many pallets will each warehouse need next Tuesday?' The company has two years of daily pallet counts per warehouse. Which ML technique matches this question?"
  options:
    - { id: a, text: "Classification", explanation: "Incorrect. Classification answers 'which category?' or 'yes or no?', not 'how many?'." }
    - { id: b, text: "Clustering", explanation: "Incorrect. Clustering finds natural groups in unlabelled data; here there is a known numeric target." }
    - { id: c, text: "Association rule learning", explanation: "Incorrect. Association rules find items that occur together; they do not predict a quantity." }
    - { id: d, text: "Regression", explanation: "Correct. 'How many?' asks for a number, and the history provides labelled examples, so this is regression on time-series data." }
  answer: [d]
  explanation: "Rewrite the business request as a question about the output. 'How much?' or 'how many?' means regression; 'which category?' or 'yes or no?' means classification; 'what natural groups exist?' with no labels means clustering. Forecasting is regression on time-series data."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: easy

- id: q-week-1-029
  set: week-1
  type: single
  stem: "A small architecture firm reviews about 30 supplier contracts a year by hand, which takes one person a few days in total. A consultant proposes building and hosting a custom ML model to review the contracts. What is the BEST recommendation?"
  options:
    - { id: a, text: "Build the model on SageMaker AI, because automation always pays back", explanation: "Incorrect. Automation pays back only when the benefit exceeds the cost of data, development, hosting and monitoring." }
    - { id: b, text: "Keep the manual process, because the task is too small for a custom model to justify its cost", explanation: "Correct. A rare, low-volume task rarely repays the cost of collecting data, training, hosting and monitoring a model." }
    - { id: c, text: "Label thousands of contracts with SageMaker Ground Truth first, then build the model", explanation: "Incorrect. Labelling at scale adds even more cost to a task that only happens 30 times a year." }
    - { id: d, text: "Pre-train a new foundation model on legal text", explanation: "Incorrect. Pre-training a foundation model costs millions of dollars and is far out of proportion to the task." }
  answer: [b]
  explanation: "AI is not the right answer when the cost outweighs the benefit or the problem is rare or tiny. Always do a cost–benefit analysis that includes data preparation, labelling, development, hosting, monitoring and human review before building a model."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: hard

- id: q-week-1-030
  set: week-1
  type: single
  stem: "A factory needs to classify vibration readings from a sensor every few milliseconds on a small device on the production line. The device has no reliable internet connection, and the same reading must always produce the same result. Which approach fits BEST?"
  options:
    - { id: a, text: "A compact traditional ML model trained on labelled sensor data", explanation: "Correct. Millisecond latency, small devices, high volume and consistent outputs are operational constraints that point to traditional ML." }
    - { id: b, text: "A large foundation model called through Amazon Bedrock for every reading", explanation: "Incorrect. An API call to a large model adds network dependency and seconds of latency, and outputs can vary between runs." }
    - { id: c, text: "A diffusion model that generates synthetic vibration signals", explanation: "Incorrect. Diffusion models generate content such as images; they do not classify sensor readings in real time." }
    - { id: d, text: "An Amazon Lex bot that asks the operator about each reading", explanation: "Incorrect. Lex builds conversational bots; a human conversation for every few-millisecond reading is impractical." }
  answer: [a]
  explanation: "Task statement 1.2 asks you to choose between traditional ML and foundation models. Structured data, one narrow prediction, millisecond latency, very high volume, small devices and a need for identical outputs all point to traditional ML. Foundation models fit unstructured data, generation and many tasks where seconds of latency are acceptable."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: hard

- id: q-week-1-031
  set: week-1
  type: single
  stem: "An insurer receives thousands of claim documents in many different layouts. For each document it wants to ask 'What is the policy number?' and 'What is the date of loss?' and receive the answer values. Which AWS service fits BEST?"
  options:
