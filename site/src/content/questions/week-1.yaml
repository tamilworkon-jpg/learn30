  taskStatement: "1.2"
  lessonRef: day-05#examples
  difficulty: medium

- id: q-week-1-034
  set: week-1
  type: multi
  stem: "A bank deploys an ML model that scores every one of its 40 million daily card transactions. Investigators see the fraud score next to each flagged transaction but still make the final decision. Which types of business value does this illustrate? (Select TWO.)"
  options:
    - { id: a, text: "Scalability", explanation: "Correct. Scoring 40 million transactions a day is a volume no human team could handle." }
    - { id: b, text: "Personalisation", explanation: "Incorrect. Personalisation tailors experiences to each person, such as recommendations; fraud scoring does not." }
    - { id: c, text: "Decision support", explanation: "Correct. The score gives investigators better information while the human still decides." }
    - { id: d, text: "Removing the need for any human oversight", explanation: "Incorrect. Humans still make the final decision, which is the opposite of removing oversight." }
    - { id: e, text: "Guaranteed, exact answers for every transaction", explanation: "Incorrect. ML predictions are probabilistic; they are right most of the time, not guaranteed." }
  answer: [a, c]
  explanation: "AI adds value through automation, scalability, decision support, personalisation, and consistency and availability. Here the model handles enormous volume (scalability) and informs human investigators (decision support). ML outputs remain probabilistic, which is why a human keeps the final say on costly decisions."
  domain: D1
  taskStatement: "1.2"
  lessonRef: day-05#explanation
  difficulty: medium

