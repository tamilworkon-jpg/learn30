  explanation: "Know one capability set per service: Comprehend for text insights including PII; Transcribe for speech to text with diarization; Translate for language translation; Polly for text to speech; Lex for bots; Rekognition for images and video including PPE detection; Textract for documents; Personalize for recommendations."
