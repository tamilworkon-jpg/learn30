  answer: [a]
  explanation: "Amazon Redshift is the cloud data warehouse for SQL analytics on large structured datasets, and Redshift ML lets analysts create and train models with SQL. It fits teams whose data and skills already live in the warehouse."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-week-1-039
  set: week-1
  type: single
  stem: "A lender wants a report BEFORE training on whether some age groups are under-represented in its data, and a report AFTER training that shows which features drove each prediction. Which SageMaker AI feature provides both?"
  options:
    - { id: a, text: "SageMaker Model Monitor", explanation: "Incorrect. Model Monitor watches models in production for drift; it is not the pre-training bias and explainability tool." }
    - { id: b, text: "SageMaker Feature Store", explanation: "Incorrect. Feature Store stores and shares features; it does not report bias or explanations." }
    - { id: c, text: "SageMaker Pipelines", explanation: "Incorrect. Pipelines automates workflow steps; it can call Clarify but does not itself analyse bias." }
    - { id: d, text: "SageMaker Clarify", explanation: "Correct. Clarify detects bias before and after training and explains which features drove predictions." }
  answer: [d]
  explanation: "SageMaker Clarify covers bias and explainability: it can report class imbalance and other bias metrics in the data before training, measure bias in the trained model, and explain feature importance for predictions."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-week-1-040
  set: week-1
  type: single
  stem: "A data science team runs hundreds of training experiments with different datasets and hyperparameters. It wants to record each run's parameters and metrics so that runs can be compared and the best one reproduced. Which SageMaker AI capability fits BEST?"
  options:
    - { id: a, text: "SageMaker Ground Truth", explanation: "Incorrect. Ground Truth is for labelling data." }
    - { id: b, text: "Managed MLflow in SageMaker AI", explanation: "Correct. Managed MLflow tracks runs, parameters and metrics so experiments can be compared and reproduced." }
    - { id: c, text: "SageMaker Model Monitor", explanation: "Incorrect. Model Monitor watches deployed models for drift, not training experiments." }
    - { id: d, text: "SageMaker JumpStart", explanation: "Incorrect. JumpStart is a hub of pre-trained models." }
  answer: [b]
  explanation: "Experimentation is a core MLOps idea: track every run's data, code, parameters and metrics so results can be compared and reproduced. In SageMaker AI this is done with managed MLflow."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-week-1-041
  set: week-1
  type: single
  stem: "A defect detector inspects 2,000 parts, of which 50 are truly defective. It flags 60 parts as defective, and 40 of those flagged parts really are defective. What is the model's recall?"
  options:
    - { id: a, text: "67%", explanation: "Incorrect. 40 ÷ 60 = 67% is precision: the share of flagged parts that were really defective." }
    - { id: b, text: "73%", explanation: "Incorrect. About 0.73 is the F1 score, the harmonic mean of precision and recall." }
    - { id: c, text: "80%", explanation: "Correct. Recall = TP ÷ (TP + FN) = 40 ÷ (40 + 10) = 80%; the model caught 40 of the 50 defective parts." }
    - { id: d, text: "98.5%", explanation: "Incorrect. 98.5% is accuracy: (40 true positives + 1,930 true negatives) ÷ 2,000." }
  answer: [c]
  explanation: "TP = 40, FP = 20, FN = 10 and TN = 1,930. Recall = 40 ÷ 50 = 80% (of all real defects, how many were caught). Precision = 40 ÷ 60 = 67%. Accuracy = 98.5%, which looks impressive only because most parts are fine."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#examples
  difficulty: hard

- id: q-week-1-042
  set: week-1
  type: single
  stem: "A fraud model outputs a probability for each transaction. The team lowers the decision threshold from 0.8 to 0.5, so more transactions are flagged. What is the MOST likely effect?"
  options:
    - { id: a, text: "Recall rises and precision falls", explanation: "Correct. Flagging more cases catches more real fraud (higher recall) but also more legitimate transactions (lower precision)." }
    - { id: b, text: "Precision rises and recall falls", explanation: "Incorrect. That is the effect of raising the threshold." }
    - { id: c, text: "Both precision and recall rise", explanation: "Incorrect. Moving the threshold trades one against the other; there is no free lunch." }
    - { id: d, text: "AUC rises because the threshold changed", explanation: "Incorrect. AUC measures separation across all thresholds, so changing the threshold does not change it." }
  answer: [a]
  explanation: "A threshold turns a probability into a decision. Lowering it flags more cases: recall goes up, precision goes down. Raising it does the opposite. The right threshold depends on the business cost of false negatives versus false positives."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-week-1-043
  set: week-1
  type: single
  stem: "A team has trained three binary classifiers and wants to compare how well each one separates the two classes, without first choosing a decision threshold. Which metric should it use?"
  options:
    - { id: a, text: "AUC (area under the ROC curve)", explanation: "Correct. AUC measures class separation across all thresholds; 0.5 is random guessing and 1.0 is perfect." }
    - { id: b, text: "Mean absolute error (MAE)", explanation: "Incorrect. MAE is a regression metric for numeric predictions." }
    - { id: c, text: "R²", explanation: "Incorrect. R² measures how much variation a regression model explains." }
    - { id: d, text: "Accuracy", explanation: "Incorrect. Accuracy depends on the chosen threshold and is misleading with imbalanced classes." }
  answer: [a]
  explanation: "AUC summarises a classifier's ability to separate classes over every possible threshold, so it is the natural metric for comparing models independent of the threshold. Precision, recall, F1 and accuracy are all calculated at one chosen threshold."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-week-1-044
  set: week-1
  type: single
  stem: "A start-up plans to download an open-source pre-trained model from a public model hub and deploy it inside a paid product. What should the team check FIRST about the model as a model source?"
  options:
    - { id: a, text: "Whether the model was trained with reinforcement learning", explanation: "Incorrect. The training method does not determine whether the start-up may use the model commercially." }
    - { id: b, text: "Whether its licence permits commercial use", explanation: "Correct. Open-source models come with licences that may restrict commercial use, so the licence must be checked before building a product on the model." }
    - { id: c, text: "Whether it has more parameters than any competing model", explanation: "Incorrect. Size alone does not make a model suitable and is not the first legal check." }
    - { id: d, text: "Whether it can be accessed only through Amazon Bedrock", explanation: "Incorrect. Open-source models can be downloaded and self-hosted; Bedrock availability is not the first concern." }
  answer: [b]
  explanation: "Model sources include open-source pre-trained models (for example on Hugging Face or in SageMaker JumpStart), proprietary foundation models accessed by API through Amazon Bedrock, and custom models trained on your own data. For open-source models, check the licence, which may restrict commercial use."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: easy

- id: q-week-1-045
  set: week-1
  type: single
  stem: "A card-fraud model's input data in production looks statistically similar to its training data. However, fraudsters have changed tactics, so transaction patterns that used to be safe now often indicate fraud, and the model's accuracy is falling. What is this called?"
  options:
    - { id: a, text: "Data drift", explanation: "Incorrect. Data drift means the inputs themselves change; here the inputs look the same." }
    - { id: b, text: "Underfitting", explanation: "Incorrect. Underfitting is a model too simple to learn the pattern even at training time; this model worked until the world changed." }
    - { id: c, text: "Concept drift", explanation: "Correct. Concept drift means the relationship between the inputs and the correct answer has changed." }
    - { id: d, text: "Class imbalance", explanation: "Incorrect. Class imbalance describes rare classes in the data, not a change in what the patterns mean over time." }
  answer: [c]
  explanation: "Data drift is a change in the input data, for example customers moving from desktop to mobile. Concept drift is a change in the relationship between inputs and outcome, for example what counts as fraud evolving as criminals adapt. Both are detected by monitoring and fixed by retraining on recent data."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: hard

- id: q-week-1-046
  set: week-1
  type: single
  stem: "A retailer has agreed on a business goal of reducing returns by 10%. The team now decides that the target will be 'item returned: yes or no', that this is a classification task, which data is needed and what accuracy would be good enough. Which ML lifecycle stage is this?"
  options:
    - { id: a, text: "Feature engineering", explanation: "Incorrect. Feature engineering selects and creates input features after the data has been collected and prepared." }
    - { id: b, text: "Evaluation", explanation: "Incorrect. Evaluation measures a trained model's performance on held-out data." }
    - { id: c, text: "Monitoring", explanation: "Incorrect. Monitoring watches a deployed model in production." }
    - { id: d, text: "Framing the ML problem", explanation: "Correct. Framing translates the business goal into an ML task: the target, the task type, the data needed and the accuracy required." }
  answer: [d]
  explanation: "The lifecycle starts with identifying the business goal, then framing the ML problem (target, task type, data, success threshold), then collecting and pre-processing data, feature engineering, training and tuning, evaluation, deployment, monitoring and retraining."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: easy

- id: q-week-1-047
  set: week-1
  type: multi
  stem: "A team has built a model that predicts the selling price of used cars. Which metrics are appropriate for evaluating this model? (Select TWO.)"
  options:
    - { id: a, text: "F1 score", explanation: "Incorrect. F1 is a classification metric that balances precision and recall." }
    - { id: b, text: "Root mean squared error (RMSE)", explanation: "Correct. RMSE measures how far numeric predictions are from the true values and punishes large errors more." }
    - { id: c, text: "Recall", explanation: "Incorrect. Recall measures how many real positive cases a classifier caught." }
    - { id: d, text: "Mean absolute error (MAE)", explanation: "Correct. MAE reports the average size of the error in the same units as the price." }
    - { id: e, text: "AUC", explanation: "Incorrect. AUC measures how well a classifier separates classes." }
  answer: [b, d]
  explanation: "Predicting a price is regression, so use regression metrics: MAE (average absolute error), RMSE (squares errors so large misses dominate) and R² (share of variation explained). Precision, recall, F1, accuracy and AUC are classification metrics."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: easy

- id: q-week-1-048
  set: week-1
  type: multi
  stem: "A credit model has an excellent overall F1 score. Before approving it for production, which additional checks should the team perform? (Select THREE.)"
  options:
    - { id: a, text: "Performance for each subgroup, such as region and age group", explanation: "Correct. A model that scores well overall can still fail a subgroup; SageMaker Clarify helps with this analysis." }
    - { id: b, text: "Inference latency and cost at the expected traffic", explanation: "Correct. A model that is too slow or too expensive to serve can still fail the business." }
    - { id: c, text: "Which features drive predictions, and whether a regulator would accept that", explanation: "Correct. Explainability is part of evaluation, especially for regulated decisions such as credit." }
    - { id: d, text: "Accuracy on the training set only", explanation: "Incorrect. Training-set scores do not show how the model generalises to new data." }
    - { id: e, text: "The number of notebook cells used to build the model", explanation: "Incorrect. This says nothing about whether the model is fit for production." }
    - { id: f, text: "Whether the model has more layers than the previous version", explanation: "Incorrect. Model size is not an approval criterion; performance, fairness, explainability, latency and cost are." }
  answer: [a, b, c]
  explanation: "Evaluation is more than one number. Before approval, check performance per subgroup, explainability, latency and cost at expected traffic, and robustness to unusual inputs. A model can have strong overall metrics and still fail on any of these."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: hard

- id: q-week-1-049
  set: week-1
  type: multi
  stem: "A company wants a controlled, repeatable path to production: every model must be built by the same automated steps, and only versions that a reviewer has approved may be deployed. Which SageMaker AI features support this? (Select TWO.)"
  options:
    - { id: a, text: "SageMaker Pipelines", explanation: "Correct. Pipelines defines the steps (process, train, evaluate, register) as a repeatable, automated workflow." }
    - { id: b, text: "SageMaker Ground Truth", explanation: "Incorrect. Ground Truth manages human data labelling; it does not control the path to production." }
    - { id: c, text: "SageMaker Canvas", explanation: "Incorrect. Canvas is a no-code tool for analysts to build models, not a release-control mechanism." }
    - { id: d, text: "SageMaker Data Wrangler", explanation: "Incorrect. Data Wrangler prepares and transforms data before training." }
    - { id: e, text: "SageMaker Model Registry", explanation: "Correct. Model Registry catalogues model versions with metrics and an approval status before deployment." }
  answer: [a, e]
  explanation: "MLOps applies software-engineering discipline to ML. Repeatable processes come from automating the workflow with SageMaker Pipelines; production readiness comes from versioning and approving models in SageMaker Model Registry. Model Monitor and retraining close the loop after deployment."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: hard

- id: q-week-1-050
  set: week-1
  type: ordering
  stem: "A churn model is managed with MLOps practices. Place these events of one automated refresh cycle in the correct order, from first to last."
  options:
    - { id: a, text: "The new model version is evaluated and registered in SageMaker Model Registry", explanation: "Third: the retrained model is evaluated and recorded as a new version with its metrics." }
    - { id: b, text: "SageMaker Model Monitor detects that production input data has drifted", explanation: "First: monitoring notices that live data no longer looks like the training data." }
    - { id: c, text: "The approved version is deployed to the production endpoint", explanation: "Last: only an approved version is put into production." }
    - { id: d, text: "A SageMaker Pipelines workflow retrains the model on recent data", explanation: "Second: the drift triggers the automated pipeline to retrain on fresh data." }
    - { id: e, text: "A risk manager reviews the metrics and approves the version", explanation: "Fourth: a human approval gate checks the new version before deployment." }
  answer: [b, d, a, e, c]
  explanation: "Monitoring detects drift, the pipeline retrains on recent data, the new version is evaluated and registered, a reviewer approves it, and the approved version is deployed. The lifecycle is a loop: monitoring feeds back into data collection and retraining."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-week-1-051
  set: week-1
  type: matching
  stem: "Match each team need to the Amazon SageMaker AI feature that addresses it."
  options:
    - { id: a, text: "Radiologists must annotate thousands of scans, with easy ones labelled automatically", explanation: "SageMaker Ground Truth manages human and assisted labelling workflows." }
    - { id: b, text: "The pricing team and the marketing team should reuse the same 'customer lifetime spend' values for training and inference", explanation: "SageMaker Feature Store is a central repository to store, share and reuse features." }
    - { id: c, text: "Be alerted when the quality of a live model's predictions starts to decay", explanation: "SageMaker Model Monitor detects data drift, model-quality decay and bias drift in production." }
    - { id: d, text: "Start from a pre-trained model and deploy or fine-tune it with a few clicks", explanation: "SageMaker JumpStart is a hub of pre-trained and foundation models." }
  matchTargets:
    - { id: t1, text: "SageMaker Ground Truth" }
    - { id: t2, text: "SageMaker Feature Store" }
    - { id: t3, text: "SageMaker Model Monitor" }
    - { id: t4, text: "SageMaker JumpStart" }
  answer: { a: t1, b: t2, c: t3, d: t4 }
  explanation: "Learn SageMaker AI features by the lifecycle stage they serve: Ground Truth for labelling, Data Wrangler for preparation, Feature Store for features, JumpStart for pre-trained models, training jobs and Automatic Model Tuning for training, Clarify for bias and explainability, Pipelines and Model Registry for MLOps, and Model Monitor for production monitoring."
  domain: D1
  taskStatement: "1.3"
  lessonRef: day-06#explanation
  difficulty: medium

- id: q-week-1-052
  set: week-1
  type: single
  stem: "A voice assistant's speech model is 95% accurate on average but only 78% accurate for speakers with a regional accent that was rare in the training data. Which action would MOST directly reduce this gap?"
  options:
    - { id: a, text: "Report only the 95% average, because it reflects most users", explanation: "Incorrect. A good average can hide poor performance for a subgroup; reporting only the average ignores the problem." }
    - { id: b, text: "Increase regularisation so the model becomes simpler", explanation: "Incorrect. A simpler model would likely be less accurate for the under-represented group, not more." }
    - { id: c, text: "Collect more representative recordings from speakers with that accent, retrain and evaluate accuracy per accent group", explanation: "Correct. The gap comes from under-representation in the data, so more representative data plus per-group evaluation addresses it directly." }
    - { id: d, text: "Switch from real-time to batch inference", explanation: "Incorrect. The inference type affects latency and cost, not accuracy for a demographic group." }
  answer: [c]
  explanation: "In responsible AI, bias often comes from data that under-represents a group, so the model underfits and is less accurate for that group. The remedy is representative training data and subgroup analysis that measures performance for each group, both before launch and in production."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-02#explanation
  difficulty: medium

- id: q-week-1-053
  set: week-1
  type: single
  stem: "A product manager argues that a hiring-screening model must be fair because its overall accuracy is 91%. Which statement BEST explains why this reasoning is flawed?"
  options:
    - { id: a, text: "Overall accuracy is always lower than subgroup accuracy", explanation: "Incorrect. Overall accuracy is an average; some subgroups can be higher and others lower." }
    - { id: b, text: "Fairness can only be measured after the model is retired", explanation: "Incorrect. Fairness should be measured before launch and monitored during production." }
    - { id: c, text: "Accuracy cannot be calculated for classification models", explanation: "Incorrect. Accuracy is a standard classification metric, although it can mislead." }
    - { id: d, text: "A high average can hide much worse performance for under-represented groups", explanation: "Correct. A model can perform well on average while systematically failing a subgroup, so fairness must be measured per group." }
  answer: [d]
  explanation: "Fairness is measured, not assumed. Because an overall metric averages across everyone, poor accuracy for a small or under-represented group can be hidden by good results for the majority. Evaluate per subgroup and check that training data is representative."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-02#explanation
  difficulty: easy

- id: q-week-1-054
  set: week-1
  type: single
  stem: "A health app's model was trained with very few examples from patients over 75. Each time the model is retrained on a slightly different sample, its predictions for this age group change a lot, and they are often wrong. Which description fits BEST?"
  options:
    - { id: a, text: "High variance for that subgroup, caused by too little representative data", explanation: "Correct. Predictions that swing with each training sample are a sign of high variance, and too few examples from the group cause it." }
    - { id: b, text: "High bias for every group, caused by too many features", explanation: "Incorrect. The problem is specific to one age group, and adding features is not the cause described." }
    - { id: c, text: "Concept drift, caused by changes in medical practice", explanation: "Incorrect. Nothing in the scenario says the relationship between inputs and outcomes changed over time." }
    - { id: d, text: "A good fit, because the overall accuracy is acceptable", explanation: "Incorrect. Unstable and often wrong predictions for a group are not a good fit, whatever the average says." }
  answer: [a]
  explanation: "Task statement 4.1 asks you to describe the effects of bias and variance on demographic groups. With very few examples, a model can be unstable (high variance) or too simple (high bias) for that group, and either way the group receives worse outcomes. Representative data and subgroup evaluation are the remedies."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-02#explanation
  difficulty: hard

- id: q-week-1-055
  set: week-1
  type: single
  stem: "A company's face-verification model works well for most users but fails far more often for people with darker skin tones. Which cause is MOST likely?"
  options:
    - { id: a, text: "The model uses asynchronous inference", explanation: "Incorrect. The inference option affects how predictions are delivered, not accuracy for a group." }
    - { id: b, text: "The training data contained mostly images of people with lighter skin tones", explanation: "Correct. Unrepresentative training data is the most common cause of a model performing worse for an under-represented group." }
    - { id: c, text: "The test set was used only once", explanation: "Incorrect. Using the test set once at the end is good practice." }
    - { id: d, text: "The model's learning rate was too low", explanation: "Incorrect. A low learning rate slows training overall; it does not explain a gap for one demographic group." }
  answer: [b]
  explanation: "When training data under-represents or misrepresents a group, the model learns less about that group and performs worse for it. Checking that data is representative of everyone the model will serve, and measuring accuracy per group, are core responsible-AI practices."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-02#explanation
  difficulty: easy

- id: q-week-1-056
  set: week-1
  type: multi
  stem: "A health insurer uses a model to decide which patients are offered a follow-up programme. It is concerned that the model may work less well for patients from rural areas. Which actions should it take? (Select TWO.)"
  options:
    - { id: a, text: "Measure the model's accuracy separately for rural and urban patients", explanation: "Correct. Subgroup analysis reveals whether the model performs worse for one group." }
    - { id: b, text: "Rely on the overall accuracy because rural patients are a minority", explanation: "Incorrect. Relying on the average is exactly how unfair performance for a minority goes unnoticed." }
    - { id: c, text: "Make sure the training data represents rural patients adequately", explanation: "Correct. Representative training data addresses the most common source of group-level bias." }
    - { id: d, text: "Increase the model's complexity until training accuracy reaches 100%", explanation: "Incorrect. Pushing training accuracy to 100% invites overfitting and does not fix missing data for a group." }
    - { id: e, text: "Remove the validation set to give the model more training data", explanation: "Incorrect. Without validation data the team cannot judge how the model generalises, for any group." }
  answer: [a, c]
  explanation: "To manage the effect of bias and variance on demographic groups, evaluate performance per subgroup and ensure the training data represents everyone the model serves. Continue to monitor per group after deployment."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-02#explanation
  difficulty: medium

- id: q-week-1-057
  set: week-1
  type: ordering
  stem: "A bank discovers that its churn model, trained only on data from city branches, performs poorly for rural customers. Place the remediation steps in the order the bank should follow, from first to last."
  options:
    - { id: a, text: "Retrain the model on the combined, representative data", explanation: "Second: once representative data exists, the model is retrained on it." }
    - { id: b, text: "Monitor accuracy for each customer segment after deployment", explanation: "Last: per-segment monitoring catches any new gap in production." }
    - { id: c, text: "Collect representative data from every region, including rural branches", explanation: "First: the root cause is missing data, so it must be gathered before retraining." }
    - { id: d, text: "Evaluate accuracy per customer segment before launch", explanation: "Third: subgroup analysis confirms the gap has closed before the model goes live." }
  answer: [c, a, d, b]
  explanation: "When a model is biased against a group it rarely saw, fix the data first, retrain, verify performance per segment before launch, and keep monitoring per segment afterwards. This combines statistical thinking (fit and variance) with responsible-AI thinking (fairness across groups)."
  domain: D4
  taskStatement: "4.1"
  lessonRef: day-02#real-world
  difficulty: medium
