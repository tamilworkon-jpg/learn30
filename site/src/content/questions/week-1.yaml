- id: q-week-1-033
  set: week-1
  type: multi
  stem: "A hotel chain wants a phone hotline where callers speak naturally to book rooms. The system must understand the booking request, ask for missing details such as dates, look up availability through an AWS Lambda function and speak the reply in a natural voice. Which AWS services should it use? (Select TWO.)"
  options:
    - { id: a, text: "Amazon Lex", explanation: "Correct. Lex handles the conversation: it recognises speech and intents, collects slots such as dates and calls a Lambda function to fulfil the request." }
    - { id: b, text: "Amazon Textract", explanation: "Incorrect. Textract extracts data from documents, which is not needed for a phone conversation." }
    - { id: c, text: "Amazon Personalize", explanation: "Incorrect. Personalize produces recommendations; it does not run conversations." }
    - { id: d, text: "Amazon Polly", explanation: "Correct. Polly turns the reply text into lifelike speech for the caller." }
    - { id: e, text: "Amazon Rekognition", explanation: "Incorrect. Rekognition analyses images and video, not phone calls." }
  answer: [a, d]
  explanation: "Amazon Lex builds voice and text bots using intents, utterances and slots, handles speech recognition and language understanding, and can call AWS Lambda to fulfil requests. Amazon Polly speaks the reply. Combining single-purpose managed services is a common exam pattern."
