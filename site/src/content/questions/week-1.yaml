- id: q-week-1-001
  set: week-1
  type: single
  stem: "A garden-centre chain installs irrigation controllers that switch the sprinklers on whenever soil moisture drops below 20% and off when it rises above 35%. The thresholds were set by a horticulturist and never change. How is this system BEST classified?"
  options:
    - { id: a, text: "Machine learning, because it reacts to sensor data", explanation: "Incorrect. Reacting to data is not the same as learning from data; nothing in the controller is learned from examples." }
    - { id: b, text: "Deep learning, because it processes sensor signals", explanation: "Incorrect. Deep learning uses multi-layer neural networks; this controller is a pair of fixed thresholds." }
    - { id: c, text: "Rule-based automation, not machine learning", explanation: "Correct. A person wrote fixed if-then thresholds and the system never learns or changes them, so it is rules, not ML." }
    - { id: d, text: "Generative AI, because it produces an action", explanation: "Incorrect. Generative AI creates new content such as text or images; switching a valve on a threshold is not content generation." }
  answer: [c]
  explanation: "Machine learning learns patterns from data and produces a model. A system that applies thresholds hand-written by an expert is classic rule-based automation. The exam often tests whether a simple, fixed rule needs ML at all; it usually does not."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-01#examples
  difficulty: easy

- id: q-week-1-002
  set: week-1
  type: single
  stem: "A streaming service wants an assistant that, when a viewer says 'set up a film night for Saturday', searches the catalogue, checks the viewer's subscription tier through an API, adds three films to a watchlist and schedules a reminder, all without the viewer guiding each step. Which type of AI does this BEST represent?"
  options:
    - { id: a, text: "Agentic AI", explanation: "Correct. The system plans steps toward a goal and calls tools (catalogue search, subscription API, watchlist, scheduler) to act, which defines an AI agent." }
    - { id: b, text: "Supervised classification", explanation: "Incorrect. Classification assigns a category to an input; it does not plan and carry out a multi-step task." }
    - { id: c, text: "Unsupervised clustering", explanation: "Incorrect. Clustering groups similar items without labels; it does not take actions on the user's behalf." }
    - { id: d, text: "Computer vision", explanation: "Incorrect. Computer vision interprets images and video; nothing here involves visual input." }
  answer: [a]
  explanation: "Agentic AI uses a foundation model as its reasoning engine to break a goal into steps, call tools such as APIs and databases, check the results and continue. Words like 'take actions', 'call APIs' and 'complete a multi-step task' point to agentic AI rather than a chatbot that only answers."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-01#explanation
  difficulty: easy

- id: q-week-1-003
  set: week-1
  type: single
  stem: "Which system is an example of artificial intelligence that does NOT use machine learning?"
  options:
    - { id: a, text: "A decision tree trained on ten years of loan repayment records", explanation: "Incorrect. A decision tree learns its splits from data, so it is machine learning (though not deep learning)." }
    - { id: b, text: "A 1980s expert system that encodes doctors' diagnostic knowledge as hand-written if-then rules", explanation: "Correct. Expert systems mimic human reasoning, so they are AI, but their rules are written by people rather than learned from data." }
    - { id: c, text: "A convolutional neural network that classifies skin-lesion photos", explanation: "Incorrect. A CNN is deep learning, which is a subset of machine learning." }
    - { id: d, text: "A k-means model that groups shoppers into segments", explanation: "Incorrect. K-means learns cluster centres from data, so it is unsupervised machine learning." }
  answer: [b]
  explanation: "AI is the umbrella term for systems that perform tasks associated with human intelligence. Not every AI system is ML: rule-based and expert systems are AI without learning. Not every ML model is deep learning (a decision tree is not a neural network)."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-01#explanation
  difficulty: medium

- id: q-week-1-004
  set: week-1
  type: single
  stem: "In a model review, a data scientist says 'this model has high bias', and later a compliance officer says 'this model is biased against older applicants'. Which statement BEST explains the two uses of the word?"
  options:
    - { id: a, text: "Both mean the model's training data contained too few rows", explanation: "Incorrect. Small datasets can contribute to problems, but neither meaning of bias is defined as a row count." }
    - { id: b, text: "Both mean the model overfits the training data", explanation: "Incorrect. Statistical bias is linked to underfitting, not overfitting, and unfair treatment is a separate responsible-AI concept." }
    - { id: c, text: "The data scientist means the model is unfair; the compliance officer means it is too simple", explanation: "Incorrect. This reverses the two meanings." }
    - { id: d, text: "The data scientist means systematic error from overly simple assumptions; the compliance officer means unfair treatment of a group of people", explanation: "Correct. Statistical bias is error from a too-simple model (underfitting); responsible-AI bias is a model systematically disadvantaging certain people." }
  answer: [d]
  explanation: "The exam uses bias in two senses. In statistics, high bias means the model makes overly simple assumptions and underfits. In responsible AI, bias means outcomes that unfairly favour or disadvantage individuals or groups, often because the training data under-represents them. Read the context to know which is meant."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-01#explanation
  difficulty: medium

- id: q-week-1-005
  set: week-1
  type: single
  stem: "A telecom company builds a churn model from a table with the columns tenure in months, monthly spend, number of support calls and churned (yes or no). In machine learning terms, what are tenure, monthly spend and number of support calls?"
  options:
    - { id: a, text: "Labels", explanation: "Incorrect. The label is the answer being predicted, which here is the churned column." }
    - { id: b, text: "Hyperparameters", explanation: "Incorrect. Hyperparameters are training settings chosen before training, such as the learning rate, not dataset columns." }
    - { id: c, text: "Features", explanation: "Correct. Features are the input attributes the model uses to make its prediction." }
    - { id: d, text: "Parameters", explanation: "Incorrect. Parameters are the internal values, such as weights, that the model learns during training." }
  answer: [c]
  explanation: "Features are the inputs (tenure, spend, support calls) and the label or target is the value to predict (churned). Parameters are learned by the model during training, and hyperparameters are set by people before training."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#explanation
  difficulty: easy

- id: q-week-1-006
  set: week-1
  type: single
  stem: "A clinic has only 1,200 labelled patient records. Holding back 30% of them for validation and testing leaves too few examples to train on. Which technique gives a reliable performance estimate while letting every example be used for both training and validation?"
  options:
    - { id: a, text: "Data augmentation", explanation: "Incorrect. Data augmentation creates variations of training examples to reduce overfitting; it does not change how the data is split for evaluation." }
    - { id: b, text: "Early stopping", explanation: "Incorrect. Early stopping halts training when the validation score stops improving; it still needs a separate validation set." }
    - { id: c, text: "Tuning hyperparameters on the test set", explanation: "Incorrect. Using the test set for tuning leaks information and produces an optimistic score." }
    - { id: d, text: "K-fold cross-validation", explanation: "Correct. The training data is split into folds, the model is trained several times holding out a different fold each time, and the scores are averaged." }
  answer: [d]
  explanation: "Cross-validation splits the data into k folds and trains k times, each time validating on a different fold. Every example is used for both training and validation, and the averaged score is more reliable than a single split, which is valuable when data is scarce."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#explanation
  difficulty: medium

- id: q-week-1-007
  set: week-1
  type: single
  stem: "A theatre group forecasts daily ticket sales. The data scientist randomly shuffles three years of daily records before splitting them into training and validation sets. Validation scores are excellent, but forecasts for the coming weeks are poor. What is the MOST likely cause?"
  options:
    - { id: a, text: "The model saw information from the future during training, so the validation score was unrealistically high", explanation: "Correct. Random shuffling puts later days in the training set while earlier days are validated, so the model effectively peeks at the future." }
    - { id: b, text: "The model is too simple and underfits the data", explanation: "Incorrect. An underfit model would score poorly on validation too, but validation scores were excellent." }
    - { id: c, text: "The validation set was too large", explanation: "Incorrect. Validation set size does not explain a gap between excellent validation scores and poor real forecasts." }
    - { id: d, text: "Time-series data cannot be used for machine learning", explanation: "Incorrect. Time-series forecasting is a common ML task; the data must simply be split in time order." }
  answer: [a]
  explanation: "For time-series data, order matters. You must train on the past and validate on a later period. Random shuffling leaks future information into training, so validation looks great on paper and disappoints in production, a form of data leakage."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#explanation
  difficulty: hard

- id: q-week-1-008
  set: week-1
  type: single
  stem: "A product owner is planning the budget for a recommendation model that will run in production for three years. Which statement about training and inference is MOST accurate?"
  options:
    - { id: a, text: "Training happens every time a prediction is requested, so it dominates the budget", explanation: "Incorrect. Training is the learning phase done occasionally; predictions on new data are inference." }
    - { id: b, text: "Inference happens constantly in production and usually accounts for most of the lifetime cost", explanation: "Correct. Training happens occasionally, but the model serves predictions continuously, so serving cost usually dominates over the model's life." }
    - { id: c, text: "Inference updates the model's parameters with each new request", explanation: "Incorrect. Inference uses the learned parameters; changing them requires training or retraining." }
    - { id: d, text: "Training is cheap and fast, so it can be ignored in planning", explanation: "Incorrect. Training is compute-heavy and can take minutes to weeks; it is simply less frequent than inference." }
  answer: [b]
  explanation: "Training is the expensive learning phase, run when the model is built or retrained. Inference is using the trained model on new data and happens all the time, often with latency requirements. Over a production model's lifetime most of the cost is usually inference, so how the model is served matters as much as how it is built."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#explanation
  difficulty: easy

- id: q-week-1-009
  set: week-1
  type: single
  stem: "A tax-advice firm hosts a small document classifier on Amazon SageMaker AI. It receives heavy traffic for six weeks of the filing season and almost none for the rest of the year. Requests are small, and users accept that the first request after a quiet period may be slower. Which inference option is MOST cost-effective with the least capacity management?"
  options:
    - { id: a, text: "A real-time endpoint on a GPU instance running all year", explanation: "Incorrect. A persistent endpoint is billed while it runs, so it would cost money through the long idle months." }
    - { id: b, text: "Batch transform run once a day", explanation: "Incorrect. Users are waiting for each classification, so a daily offline batch would not meet the need." }
    - { id: c, text: "Serverless inference", explanation: "Correct. Serverless inference scales automatically with intermittent traffic and bills only while requests are processed, accepting possible cold starts." }
    - { id: d, text: "Asynchronous inference with results written to Amazon S3", explanation: "Incorrect. Asynchronous inference is designed for large payloads or long processing times; these requests are small and users want a direct response." }
  answer: [c]
  explanation: "Serverless inference suits intermittent or unpredictable traffic: AWS provisions and scales the compute, there is no idle cost, and the trade-off is a possible cold start after an idle period. Real-time endpoints fit steady, latency-critical traffic; batch fits offline jobs; asynchronous fits large payloads or long processing."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#examples
  difficulty: medium

- id: q-week-1-010
  set: week-1
  type: single
  stem: "A geospatial company sends satellite images of about 800 MB each to a model hosted on Amazon SageMaker AI. Each image takes around 20 minutes to analyse, clients collect the results later, and the company wants compute to scale down to zero when no images are waiting. Which inference option fits BEST?"
  options:
    - { id: a, text: "Real-time inference", explanation: "Incorrect. Real-time endpoints are built for quick responses to small requests and keep instances running even when idle." }
    - { id: b, text: "Serverless inference", explanation: "Incorrect. Serverless inference targets small, intermittent requests; it is not designed for payloads of hundreds of megabytes processed for many minutes." }
    - { id: c, text: "Batch transform", explanation: "Incorrect. Batch transform processes a whole dataset on a schedule; here images arrive individually throughout the day and each needs its own result." }
    - { id: d, text: "Asynchronous inference", explanation: "Correct. Asynchronous inference queues requests with payloads up to 1 GB and processing up to about an hour, writes results to S3, and can scale to zero when the queue is empty." }
  answer: [d]
  explanation: "Asynchronous inference places each request in a queue, processes it in the background and writes the result to Amazon S3, optionally sending a notification. It handles large payloads (up to 1 GB) and long processing times (up to about an hour) and can scale down to zero instances when idle."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#explanation
  difficulty: medium

- id: q-week-1-011
  set: week-1
  type: single
  stem: "A photo-sharing app wants to tag every uploaded photo with each applicable label from a list that includes 'beach', 'dog', 'sunset' and 'people'. A single photo can receive several tags at once. Which type of ML task is this?"
  options:
    - { id: a, text: "Multi-label classification", explanation: "Correct. Multi-label classification allows several categories to apply to the same input, such as a photo containing both a dog and a beach." }
    - { id: b, text: "Binary classification", explanation: "Incorrect. Binary classification chooses between exactly two classes." }
    - { id: c, text: "Multi-class classification", explanation: "Incorrect. Multi-class classification picks exactly one class out of many for each input." }
    - { id: d, text: "Regression", explanation: "Incorrect. Regression predicts a continuous number, not a set of categories." }
  answer: [a]
  explanation: "Classification predicts categories. Binary has two classes, multi-class picks one of many, and multi-label allows several categories at once. Regression predicts a continuous quantity."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: medium

- id: q-week-1-012
  set: week-1
  type: single
  stem: "An operations team stores application logs as JSON records. Records share some common fields, but different services add their own fields and there is no fixed schema. How is this data BEST described?"
  options:
    - { id: a, text: "Structured data", explanation: "Incorrect. Structured data fits rows and columns with a fixed schema, which these logs do not have." }
    - { id: b, text: "Semi-structured data", explanation: "Correct. JSON, XML and log files have some organisation, such as named fields, but no rigid schema." }
    - { id: c, text: "Unstructured data", explanation: "Incorrect. Unstructured data such as free text, images and audio has no predefined organisation at all; JSON records do have named fields." }
    - { id: d, text: "Time-series image data", explanation: "Incorrect. The records are text-based logs, not images." }
  answer: [b]
  explanation: "Structured data has a fixed schema (database tables). Semi-structured data has some organisation but no rigid schema (JSON, XML, logs). Unstructured data has no predefined model (free text, images, audio, video, PDFs)."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: easy

- id: q-week-1-013
  set: week-1
  type: single
  stem: "A grocery chain wants to discover which products are often bought together in the same basket so that it can plan shelf placement. Its transaction data contains no outcome column. Which technique fits BEST?"
  options:
    - { id: a, text: "Linear regression", explanation: "Incorrect. Linear regression predicts a continuous number from labelled examples; there is no target to predict here." }
    - { id: b, text: "Reinforcement learning", explanation: "Incorrect. Reinforcement learning trains an agent through actions and rewards; nothing here involves an agent acting in an environment." }
    - { id: c, text: "Association rule learning", explanation: "Correct. Association rules find items that frequently occur together, the classic market-basket analysis." }
    - { id: d, text: "Principal component analysis (PCA)", explanation: "Incorrect. PCA compresses many features into fewer; it does not find items that co-occur in baskets." }
  answer: [c]
  explanation: "Association rule learning is an unsupervised technique that discovers items that often appear together, for example 'customers who buy bread and butter also buy jam'. It needs no labels, which matches transaction data with no outcome column."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: medium

- id: q-week-1-014
  set: week-1
  type: single
  stem: "A team takes an image model pre-trained on millions of general photos, freezes all of its existing layers and trains only a newly added output layer on 2,000 labelled images of its own products. What is this approach called?"
  options:
    - { id: a, text: "Training from scratch", explanation: "Incorrect. Training from scratch starts with random weights; here the pre-trained layers are reused." }
    - { id: b, text: "Self-supervised pre-training", explanation: "Incorrect. Self-supervised pre-training creates labels from the data itself on a huge dataset; the team is adapting an already pre-trained model with labelled data." }
    - { id: c, text: "Reinforcement learning from human feedback", explanation: "Incorrect. RLHF uses human ratings as a reward signal to align a model's responses; it is not used to add a new image output layer." }
    - { id: d, text: "Transfer learning by feature extraction", explanation: "Correct. Freezing the pre-trained layers and training only a new output layer is the feature-extraction form of transfer learning." }
  answer: [d]
  explanation: "Transfer learning reuses a model pre-trained on a large general dataset. In feature extraction, the pre-trained layers are frozen and only a new output layer is trained. In fine-tuning, some or all layers continue training with a small learning rate. Both need far less data and compute than training from scratch."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-04#explanation
  difficulty: medium

- id: q-week-1-015
  set: week-1
  type: single
  stem: "While training a neural network, the team sees the loss jump up and down from one step to the next and never settle, instead of decreasing steadily. Which change is MOST likely to help?"
  options:
    - { id: a, text: "Lower the learning rate", explanation: "Correct. A learning rate that is too high makes gradient descent overshoot the minimum and bounce around; smaller steps let the loss settle." }
    - { id: b, text: "Raise the learning rate", explanation: "Incorrect. Larger steps would make the overshooting worse." }
    - { id: c, text: "Remove the activation functions", explanation: "Incorrect. Without activation functions the network collapses into a linear model and loses the ability to learn complex patterns." }
    - { id: d, text: "Replace backpropagation with batch transform", explanation: "Incorrect. Batch transform is a SageMaker AI inference option, not a training algorithm." }
  answer: [a]
  explanation: "Gradient descent nudges each weight in the direction that reduces the loss; the learning rate is the step size. Steps that are too big overshoot and bounce around, while steps that are too small make training very slow. The learning rate is a hyperparameter chosen before training."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-04#explanation
  difficulty: hard

- id: q-week-1-016
  set: week-1
  type: single
  stem: "A transformer reads all the tokens of a sentence at the same time instead of one after another. What does the architecture add so that the model still knows the order of the words?"
  options:
    - { id: a, text: "A hidden state passed from one step to the next", explanation: "Incorrect. A hidden state is how a recurrent neural network carries memory step by step; transformers do not process tokens sequentially." }
    - { id: b, text: "Positional encoding", explanation: "Correct. Positional encoding adds information about where each token sits in the sequence, because parallel self-attention does not imply order on its own." }
    - { id: c, text: "Pooling layers", explanation: "Incorrect. Pooling shrinks feature maps in convolutional neural networks for images." }
    - { id: d, text: "A softmax output layer", explanation: "Incorrect. Softmax turns scores into probabilities; it does not encode word order." }
  answer: [b]
  explanation: "Self-attention lets every token look at every other token in parallel, which makes training scale and captures long-range context. Because the model no longer reads word by word, positional encoding is added to each token so the model knows its position in the sequence."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-04#explanation
  difficulty: medium

- id: q-week-1-017
  set: week-1
  type: multi
  stem: "An IT team is building an inventory of AI systems in the company. Which of these systems are examples of generative AI? (Select TWO.)"
  options:
    - { id: a, text: "A model that predicts next quarter's sales for each store", explanation: "Incorrect. Predicting a number is traditional ML regression, not content generation." }
    - { id: b, text: "An assistant that writes SQL queries from analysts' plain-English questions", explanation: "Correct. Writing new code from a prompt is content generation by an LLM." }
    - { id: c, text: "A model that scores card transactions for fraud risk", explanation: "Incorrect. Scoring or classifying transactions is traditional ML." }
    - { id: d, text: "A tool that creates new banner images from a text description", explanation: "Correct. Producing new images from a prompt is generative AI, typically with a diffusion model." }
    - { id: e, text: "A k-means model that groups customers into segments", explanation: "Incorrect. Clustering finds groups in existing data; it does not create new content." }
  answer: [b, d]
  explanation: "Traditional ML classifies, scores, predicts or groups. Generative AI creates new content such as text, code, images, audio or video that resembles its training data. Clue words are create, draft, write, summarise and generate."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-01#examples
  difficulty: easy

- id: q-week-1-018
  set: week-1
  type: multi
  stem: "A delivery-time model scores 61% on its training data and 60% on its validation data. Which actions are MOST likely to improve it? (Select TWO.)"
  options:
    - { id: a, text: "Add more informative features, such as distance to the customer and time of day", explanation: "Correct. Poor scores on both sets mean underfitting, and more informative features give the model more signal to learn." }
    - { id: b, text: "Increase regularisation strength", explanation: "Incorrect. Regularisation penalises complexity, which would make an underfit model even simpler." }
    - { id: c, text: "Use a more expressive model or train for longer", explanation: "Correct. A richer model or more training helps a model that is too simple to capture the pattern." }
    - { id: d, text: "Apply early stopping to end training sooner", explanation: "Incorrect. Early stopping prevents overfitting; an underfit model needs more learning, not less." }
    - { id: e, text: "Add dropout to the network", explanation: "Incorrect. Dropout is an overfitting remedy that limits how much the network relies on individual paths." }
  answer: [a, c]
  explanation: "Low training and validation scores that are close together indicate underfitting (high bias). Fixes are more informative features, a more expressive model, longer training and less regularisation. Regularisation, early stopping and dropout are remedies for overfitting."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-02#explanation
  difficulty: medium

- id: q-week-1-019
  set: week-1
  type: multi
  stem: "A payments team is preparing 2 million transactions to train a fraud classifier. Only 0.1% of the transactions are fraud. Which steps directly address this class imbalance? (Select TWO.)"
  options:
    - { id: a, text: "Oversample the fraud class or add synthetic fraud examples", explanation: "Correct. Increasing the share of the rare class helps the model learn its pattern instead of always predicting the majority class." }
    - { id: b, text: "One-hot encode the merchant category column", explanation: "Incorrect. One-hot encoding converts categories into numbers; it does not change the balance between classes." }
    - { id: c, text: "Judge the model with precision and recall rather than accuracy", explanation: "Correct. With 99.9% legitimate transactions, accuracy is misleading; precision and recall show whether fraud is actually caught." }
    - { id: d, text: "Scale transaction amounts to a comparable range", explanation: "Incorrect. Scaling puts features on similar ranges; it does not address imbalance between classes." }
    - { id: e, text: "Remove the fraud transactions as outliers", explanation: "Incorrect. The rare fraud cases are exactly what the model must learn; removing them makes the problem worse." }
  answer: [a, c]
  explanation: "When one class is rare, a model that always predicts the majority class scores very high accuracy and is useless. Remedies include collecting more minority examples, oversampling the rare class, undersampling the common class or creating synthetic examples, and evaluating with precision and recall instead of accuracy."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: hard

- id: q-week-1-020
  set: week-1
  type: multi
  stem: "A quality engineer is reviewing a convolutional neural network (CNN) that checks photos of circuit boards. Which statements correctly describe how a CNN works? (Select TWO.)"
  options:
    - { id: a, text: "Small filters slide across the image, and each learns to spot a pattern such as an edge or a curve", explanation: "Correct. Convolutional filters detect local patterns wherever they appear in the image." }
    - { id: b, text: "It keeps a hidden state that carries memory from one word to the next", explanation: "Incorrect. A hidden state passed step by step describes a recurrent neural network for sequences." }
    - { id: c, text: "Pooling layers shrink the feature maps while keeping the strongest signals", explanation: "Correct. Pooling reduces the size of feature maps and keeps the most important responses." }
    - { id: d, text: "Self-attention compares every token with every other token in parallel", explanation: "Incorrect. Self-attention is the core mechanism of transformers." }
    - { id: e, text: "It requires hand-engineered features such as the colour of each pixel region", explanation: "Incorrect. Deep networks such as CNNs learn features directly from raw pixels." }
  answer: [a, c]
  explanation: "A CNN slides small learned filters across an image to detect local patterns, uses pooling to shrink the feature maps, and builds a hierarchy from edges to shapes to whole objects. RNNs carry a hidden state through sequences, and transformers use self-attention."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-04#explanation
  difficulty: medium

- id: q-week-1-021
  set: week-1
  type: ordering
  stem: "Order these terms from the BROADEST category to the most specific, where each term is a subset of the one before it."
  options:
    - { id: a, text: "Deep learning", explanation: "Third: deep learning is the part of ML that uses multi-layer neural networks." }
    - { id: b, text: "Artificial intelligence", explanation: "First: AI is the umbrella term for any technique that mimics human intelligence, including rules." }
    - { id: c, text: "Generative AI", explanation: "Last: generative AI is built on deep learning, especially transformers, and creates new content." }
    - { id: d, text: "Machine learning", explanation: "Second: ML is the part of AI that learns patterns from data." }
  answer: [b, d, a, c]
  explanation: "The terms nest: AI contains ML, ML contains deep learning, and deep learning contains generative AI. Agentic AI builds on generative AI by adding planning, tools and actions."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-01#explanation
  difficulty: easy

- id: q-week-1-022
  set: week-1
  type: matching
  stem: "Match each dataset to the data type that describes it BEST."
  options:
    - { id: a, text: "Readings from a smart meter recorded every 15 minutes for two years", explanation: "Time-series: values recorded in time order, where yesterday influences today." }
    - { id: b, text: "Recordings of customer phone calls to a contact centre", explanation: "Audio: speech recordings, typically used for transcription." }
    - { id: c, text: "A table of customer accounts with plan type, monthly spend and tenure", explanation: "Tabular: rows and columns of numbers and categories." }
    - { id: d, text: "Thousands of free-text product reviews", explanation: "Text: documents and reviews, used for sentiment and entity extraction." }
  matchTargets:
    - { id: t1, text: "Tabular" }
    - { id: t2, text: "Time-series" }
    - { id: t3, text: "Text" }
    - { id: t4, text: "Audio" }
  answer: { a: t2, b: t4, c: t1, d: t3 }
  explanation: "Task statement 1.1 names several data types. Tabular data suits credit scoring and churn; time-series suits forecasting and must not be shuffled; text suits Amazon Comprehend or Amazon Bedrock; audio suits Amazon Transcribe."
  domain: D1
  taskStatement: "1.1"
  lessonRef: day-03#explanation
  difficulty: easy

- id: q-week-1-023
