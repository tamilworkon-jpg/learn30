- id: q-day-27-017
  set: day-27
  type: multi
  stem: "A compliance officer must show (1) that buckets with patient data have been encrypted throughout the past year, (2) which administrator disabled encryption on one bucket in March, and (3) AWS's own HIPAA-related documentation and agreement. Which services provide this evidence? (Select THREE.)"
  options:
    - { id: a, text: "AWS Config", explanation: "Correct. Config shows configuration history and rule compliance over time for need (1)." }
    - { id: b, text: "Amazon Inspector", explanation: "Incorrect. Inspector reports software vulnerabilities, which none of the three needs asks for." }
    - { id: c, text: "AWS CloudTrail", explanation: "Correct. CloudTrail identifies the administrator who made the API call for need (2)." }
    - { id: d, text: "AWS Trusted Advisor", explanation: "Incorrect. Trusted Advisor gives current best-practice recommendations, not a year of configuration history or AWS's agreements." }
    - { id: e, text: "AWS Artifact", explanation: "Correct. Artifact provides AWS's compliance documents and agreements such as a BAA for need (3)." }
    - { id: f, text: "Amazon CloudWatch", explanation: "Incorrect. CloudWatch monitors performance metrics and alarms, not configuration compliance or AWS's agreements." }
  answer: [a, c, e]
