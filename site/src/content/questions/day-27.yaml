- id: q-day-27-018
  set: day-27
  type: multi
  stem: "A company enables Amazon Bedrock model invocation logging. The logs contain customer names and account details from prompts. Which data governance measures should it apply to these logs? (Select TWO.)"
  options:
    - { id: a, text: "Encrypt the logs with a KMS key and restrict who can read them", explanation: "Correct. Logs that contain prompts are sensitive data and need encryption and access control." }
    - { id: b, text: "Set a retention period and a lifecycle rule for the logs", explanation: "Correct. Retention should be chosen deliberately so logs are kept as long as required and no longer." }
    - { id: c, text: "Keep the logs forever in case they are useful later", explanation: "Incorrect. Keeping personal data indefinitely increases cost and privacy risk, and may break retention rules." }
    - { id: d, text: "Make the logs publicly readable for transparency", explanation: "Incorrect. Public logs would expose customers' personal data." }
    - { id: e, text: "Disable CloudTrail to avoid storing duplicate information", explanation: "Incorrect. CloudTrail records API activity, which invocation logs do not replace; disabling it removes the audit trail." }
  answer: [a, b]
  explanation: "Data governance covers logging, retention, lifecycle, residency and monitoring. Logs are data too: protect them with encryption and access control, and set retention periods because defaults such as CloudWatch Logs keep data indefinitely."
  domain: D5
  taskStatement: "5.2"
  lessonRef: day-27#explanation
  difficulty: medium

- id: q-day-27-019
  set: day-27
  type: ordering
  stem: "Arrange the scopes of the Generative AI Security Scoping Matrix in order, from the least ownership of the AI stack to the most."
