- name: Amazon Bedrock
  aka: [Bedrock]
  category: Generative AI & agents
  purpose: "Fully managed, serverless access to foundation models from Amazon and leading providers through one API, plus tools to build GenAI apps."
  examCue: "Choose this for GenAI without managing infrastructure: model choice, Knowledge Bases (RAG), Agents, Guardrails, Model Evaluation, Prompt Management, fine-tuning, batch or provisioned throughput."
  notThis: "Not for training classic ML models from scratch (that's SageMaker AI) and not a single model itself (Nova is Amazon's FM family on Bedrock)."
  inScope: true
  taskStatements: ['2.3', '3.1', '3.2', '3.4', '4.1', '5.1']
  lessonRefs: ['day-01#explanation', 'day-01#deep-dive', 'day-02#explanation', 'day-12']
- name: Amazon Bedrock AgentCore
  aka: [AgentCore]
  category: Generative AI & agents
  purpose: "Services to deploy and operate AI agents securely at scale: Runtime, Memory, Gateway, Identity, Policy, Observability, Code Interpreter, Browser."
  examCue: "Choose this when the scenario asks how to run agents in production securely with any framework or model: session isolation, agent identity and access, tool gateway, memory, tracing."
  notThis: "Not an agent-writing SDK (that's Strands Agents) and not a foundation model; it is the runtime and operations layer for agents."
  inScope: true
  taskStatements: ['2.3', '3.1', '5.1']
  lessonRefs: ['day-01#diagram', 'day-01#deep-dive', 'day-12']
- name: Amazon Nova
  aka: [Nova]
  category: Generative AI & agents
  purpose: "Amazon's own family of foundation models on Bedrock: understanding (text, image, video), creative (image and video generation) and speech models."
  examCue: "Choose this when the scenario wants a cost-effective, fast Amazon-built FM in Bedrock, or Amazon image/video generation or speech-to-speech models."
  notThis: "Not a separate platform you host yourself; Nova models are consumed through Amazon Bedrock."
  inScope: true
  taskStatements: ['2.3', '3.1']
  lessonRefs: ['day-01#diagram', 'day-01#explanation', 'day-12']
- name: Kiro
  category: Generative AI & agents
  purpose: "AWS agentic IDE and CLI that turns prompts into specs, designs and tasks (spec-driven development) and implements code with AI agents."
  examCue: "Choose this when the scenario is about developers building software with an AI coding agent, spec-driven development, agent hooks or steering files."
  notThis: "Not a business analytics workspace (that's Amazon Quick) and not an agent hosting runtime (that's AgentCore)."
  inScope: true
  taskStatements: ['2.3']
  lessonRefs: ['day-12']
- name: Strands Agents
  aka: [Strands Agents SDK]
  category: Generative AI & agents
  purpose: "Open-source, model-driven SDK (Python and TypeScript) for building AI agents in a few lines of code with tools, MCP and multi-agent patterns."
  examCue: "Choose this when the scenario asks for an open-source framework or SDK to code an agent loop (model + tools + prompt), including multi-agent and MCP tool use."
  notThis: "Not a managed hosting service; deploy Strands agents on AgentCore Runtime, Lambda, ECS or EKS."
  inScope: true
  taskStatements: ['2.3', '3.1']
  lessonRefs: ['day-10', 'day-12']
- name: Amazon Quick
  aka: [Amazon Quick Suite, Amazon QuickSight]
  category: Generative AI & agents
  purpose: "AWS agentic AI workspace for business users: BI dashboards (formerly QuickSight), research, chat agents and workflow automation over company data."
  examCue: "Choose this when business users want to ask questions of their data in natural language, build dashboards, run research agents or automate everyday workflows without coding."
  notThis: "Not a developer IDE (that's Kiro) and not a model API (that's Bedrock); it replaces the old Amazon Q Business/QuickSight branding in the guide."
  inScope: true
  taskStatements: ['2.3']
  lessonRefs: ['day-01#diagram', 'day-01#exam-tips', 'day-12']
- name: AWS Transform
  category: Generative AI & agents
  purpose: "Agentic AI service that automates migration and modernization: .NET porting, mainframe modernization, VMware migration, code upgrades."
  examCue: "Choose this when the scenario is modernizing legacy workloads with AI agents, such as moving .NET Framework to Linux, mainframe COBOL, or VMware to AWS."
  notThis: "Not a general coding assistant for new apps (that's Kiro) and not a data migration tool for databases."
  inScope: true
  taskStatements: ['2.3']
  lessonRefs: ['day-12']
